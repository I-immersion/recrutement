<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>LUMIIA recrute</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --cosmos:#0b0520;--deep:#05001a;--panel:#140932;
  --cyan:#4dd9e8;--mag:#d946ef;--violet:#a855f7;--lime:#b8ff3c;--or:#ffd700;
  --danger:#ff4444;--ok:#4ade80;
  --tx:#f0e8f8;--soft:#c9c2e8;--dim:rgba(201,194,232,.70);
  --bd:rgba(255,255,255,.09);
}
html,body{height:100%;background:var(--deep);color:var(--tx);font-family:'Nunito',sans-serif;}
body{overflow-x:hidden;}
h1,h2,h3,.bebas{font-family:'Bebas Neue',sans-serif;letter-spacing:.06em;font-weight:400;}
.wrap{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:18px 18px 28px;}
.logo{height:30px;width:auto;max-width:180px;object-fit:contain;mix-blend-mode:screen;display:block;margin:0 auto 4px;}
.tag{text-align:center;font-size:.72rem;letter-spacing:.28em;color:var(--dim);text-transform:uppercase;margin-bottom:18px;}
.card{background:linear-gradient(160deg,rgba(20,9,50,.95),rgba(11,5,32,.95));border:1px solid var(--bd);border-radius:18px;padding:20px;}
.btn{display:block;width:100%;padding:16px 18px;border:none;border-radius:14px;font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:.1em;cursor:pointer;background:linear-gradient(90deg,var(--lime),#7ee81f);color:#08130a;margin-top:14px;}
.btn:active{transform:scale(.985);}
.btn.sec{background:transparent;border:1px solid var(--bd);color:var(--soft);font-size:1rem;font-family:'Nunito';letter-spacing:0;padding:12px;}
.btn:disabled{opacity:.32;filter:grayscale(.5);cursor:not-allowed;}
.opt{display:block;width:100%;text-align:left;padding:15px 16px;margin-top:10px;border-radius:14px;border:1px solid var(--bd);background:rgba(255,255,255,.03);color:var(--tx);font-size:.98rem;line-height:1.35;font-family:'Nunito';cursor:pointer;}
.opt.on{border-color:var(--lime);background:rgba(184,255,60,.12);}
.opts .opt{display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:16px 16px 16px 13px;margin-top:12px;border-radius:16px;border:1px solid var(--bd);background:linear-gradient(135deg,rgba(255,255,255,.06),rgba(255,255,255,.018));color:var(--tx);font-size:1rem;line-height:1.35;font-family:'Nunito';cursor:pointer;transition:transform .12s,border-color .12s,background .12s;}
.opts .opt:active{transform:scale(.985);}
.opts .opt.on{border-color:var(--lime);background:rgba(184,255,60,.15);}
.opts .opt .k{flex:0 0 32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue';font-size:1.2rem;color:var(--cyan);background:rgba(77,217,232,.14);border:1px solid rgba(77,217,232,.32);transition:all .12s;}
.opts .opt.on .k{color:#08130a;background:var(--lime);border-color:var(--lime);}
.opts .opt .kt{flex:1;}
.q{font-size:1.5rem;line-height:1.22;margin:10px 0 6px;}
.qbar{height:4px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden;margin:10px 0 2px;}
.qbar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--cyan),var(--lime));transition:width .3s ease;}
.opts{margin-top:26px;}
.step{font-size:.7rem;letter-spacing:.25em;color:var(--cyan);text-transform:uppercase;}
.big{font-family:'Bebas Neue',sans-serif;font-size:3.4rem;line-height:.95;letter-spacing:.02em;}
.nw{display:inline-block;white-space:nowrap;}
.mut{color:var(--soft);font-size:.92rem;line-height:1.45;}
.dim{color:var(--dim);font-size:.88rem;line-height:1.5;}
input,select,textarea{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--bd);background:rgba(255,255,255,.04);color:var(--tx);font-family:'Nunito';font-size:1rem;margin-top:8px;}
label.f{display:block;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-top:14px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.chip{padding:9px 14px;border-radius:999px;border:1px solid var(--bd);background:rgba(255,255,255,.03);color:var(--soft);font-size:.88rem;cursor:pointer;}
.chip.on{border-color:var(--lime);color:var(--lime);background:rgba(184,255,60,.1);}
.center{text-align:center;}
.spacer{flex:1;}
/* ── JEU ── */
#stage{position:relative;width:100%;height:62vh;min-height:380px;border-radius:18px;border:1px solid var(--bd);background:radial-gradient(120% 80% at 50% 0%,rgba(168,85,247,.16),transparent 60%),var(--panel);overflow:hidden;touch-action:none;user-select:none;}
.hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.hud .t{font-family:'Bebas Neue';font-size:1.6rem;color:var(--cyan);}
.hud .s{font-family:'Bebas Neue';font-size:1.6rem;color:var(--lime);}
.bar{height:5px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden;margin-bottom:12px;}
.bar>i{display:block;height:100%;background:var(--cyan);width:100%;}
.cli{position:absolute;width:64px;text-align:center;transition:opacity .2s;}
.cli .face{font-size:2.1rem;line-height:1;}
.cli .want{font-size:1.15rem;margin-top:-2px;}
.cli .pat{height:4px;width:46px;margin:4px auto 0;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden;}
.cli .pat>i{display:block;height:100%;background:var(--ok);width:100%;}
.cli.tgt{filter:drop-shadow(0 0 10px var(--lime));}
.btl{position:absolute;width:56px;height:76px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.9rem;background:rgba(255,255,255,.06);border:1px solid var(--bd);}
.btl.grab{border-color:var(--lime);background:rgba(184,255,60,.14);z-index:20;}
.fly{position:absolute;font-size:2rem;pointer-events:none;z-index:30;}
.pop{position:absolute;font-family:'Bebas Neue';font-size:1.3rem;pointer-events:none;z-index:40;animation:up .7s ease-out forwards;}
@keyframes up{to{transform:translateY(-38px);opacity:0;}}
@keyframes bob{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-12px) scale(1.14);}}
@keyframes zin{from{opacity:0;transform:scale(.6);}to{opacity:1;transform:scale(1);}}
.beat{position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:3px solid var(--mag);}
.tile{position:absolute;width:calc(50% - 14px);border-radius:14px;border:1px solid var(--bd);background:rgba(255,255,255,.04);padding:12px 8px;text-align:center;cursor:pointer;}
.tile.on{border-color:var(--lime);background:rgba(184,255,60,.12);}
.tile.ko{border-color:var(--danger);}
.tile .fc{font-size:2rem;}
.tile .nm{font-family:'Bebas Neue';font-size:1.25rem;letter-spacing:.05em;margin-top:2px;}
.tray{position:absolute;width:120px;height:22px;border-radius:6px;background:linear-gradient(180deg,#c9c2e8,#6b6390);}
.glass{position:absolute;width:16px;height:26px;border-radius:3px 3px 6px 6px;background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(77,217,232,.55));}
/* ── TV ── */
#tv{display:none;min-height:100dvh;padding:34px 40px;}
#tv h1{font-size:clamp(2rem,5vw,4rem);color:var(--lime);}
.lb{display:grid;grid-template-columns:auto 1fr auto;gap:10px 18px;margin-top:22px;font-size:clamp(1rem,2.4vw,1.7rem);align-items:center;}
.lb .r{font-family:'Bebas Neue';color:var(--cyan);}
.lb .p{font-family:'Bebas Neue';letter-spacing:.06em;}
.lb .s{font-family:'Bebas Neue';color:var(--lime);}
/* ── ADMIN ── */
#admin{display:none;padding:20px;max-width:1000px;margin:0 auto;}
#admin table{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:10px;}
#admin th,#admin td{border-bottom:1px solid var(--bd);padding:7px 8px;text-align:left;vertical-align:top;}
#admin th{color:var(--cyan);font-family:'Bebas Neue';letter-spacing:.08em;font-size:1rem;}
.adm-sec{margin-top:26px;}
.adm-sec>h2{color:var(--lime);font-size:1.5rem;}
.qed{border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:10px;}
.row2{display:flex;gap:10px;}
.hidden{display:none!important;}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--lime);color:var(--lime);padding:11px 18px;border-radius:99px;font-size:.9rem;z-index:999;}

/* ── SPLASH ── */
#splash{position:fixed;inset:0;z-index:900;background:radial-gradient(ellipse 90% 60% at 50% 40%,#1b0a3f,#05001a 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;}
#splash .orb{position:absolute;border-radius:50%;filter:blur(38px);opacity:.55;animation:float 7s ease-in-out infinite;}
#splash .o1{width:230px;height:230px;background:var(--violet);top:8%;left:-40px;}
#splash .o2{width:190px;height:190px;background:var(--cyan);bottom:12%;right:-30px;animation-delay:-2.5s;}
#splash .o3{width:150px;height:150px;background:var(--mag);top:44%;right:16%;animation-delay:-4.5s;}
@keyframes float{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(16px,-26px) scale(1.14);}}
#splash .sp-logo{position:relative;height:74px;max-width:280px;object-fit:contain;mix-blend-mode:screen;animation:logoIn 1.1s cubic-bezier(.2,.9,.25,1.2) both;}
@keyframes logoIn{from{opacity:0;transform:scale(.55) translateY(26px);}to{opacity:1;transform:none;}}
#splash .sp-t{position:relative;font-family:'Bebas Neue';font-size:clamp(1.9rem,8vw,2.9rem);line-height:1.02;color:var(--lime);margin-top:20px;animation:rise .7s .5s both;}
#splash .sp-s{position:relative;color:var(--soft);margin-top:12px;font-size:1rem;animation:rise .7s .85s both;max-width:340px;}
@keyframes rise{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:none;}}
#splash .sp-btn{position:relative;margin-top:26px;min-width:250px;animation:rise .6s 1.2s both;}
#splash .sp-ver{position:absolute;bottom:16px;left:0;right:0;font-size:.7rem;letter-spacing:.2em;color:var(--dim);}
.sp-load{position:relative;width:190px;height:4px;border-radius:99px;background:rgba(255,255,255,.12);margin-top:26px;overflow:hidden;}
.sp-load>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--lime));animation:fill 6.2s linear forwards;}
@keyframes fill{to{width:100%;}}
.spark{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--lime);opacity:0;animation:spk 2.6s ease-out infinite;}
@keyframes spk{0%{opacity:0;transform:translateY(0) scale(.4);}25%{opacity:1;}100%{opacity:0;transform:translateY(-120px) scale(1.3);}}
/* ── PARCOURS CANDIDATURE ── */
.steps{display:flex;gap:5px;margin-bottom:16px;}
.steps i{flex:1;height:4px;border-radius:99px;background:rgba(255,255,255,.13);}
.steps i.on{background:var(--lime);}
.steps i.done{background:rgba(184,255,60,.45);}
.stepno{font-family:'Bebas Neue';letter-spacing:.16em;color:var(--cyan);font-size:.9rem;margin-bottom:6px;}
.opt{display:block;width:100%;text-align:left;padding:13px 15px;border-radius:13px;border:1px solid var(--bd);background:rgba(255,255,255,.04);color:var(--tx);margin-top:9px;font-size:.98rem;font-family:'Nunito';cursor:pointer;line-height:1.35;}
.opt.on{border-color:var(--lime);background:rgba(184,255,60,.13);}
.opt .oh{font-weight:900;display:block;}
.opt .os{color:var(--dim);font-size:.85rem;display:block;margin-top:2px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px;}
.grid2 .opt{margin-top:0;text-align:center;}
.dispo{width:100%;border-collapse:separate;border-spacing:5px;margin-top:10px;}
.dispo th{font-family:'Bebas Neue';font-size:.9rem;color:var(--dim);letter-spacing:.06em;font-weight:400;}
.dispo td{text-align:center;}
.dispo .cx{display:block;padding:11px 0;border-radius:10px;border:1px solid var(--bd);background:rgba(255,255,255,.04);cursor:pointer;font-size:1.1rem;color:var(--dim);}
.dispo .cx.on{border-color:var(--lime);background:rgba(184,255,60,.16);color:var(--lime);}
.dispo .dj{font-family:'Bebas Neue';font-size:1rem;color:var(--soft);text-align:left;padding-left:2px;}
.media{border:1px dashed var(--bd);border-radius:14px;padding:16px;text-align:center;margin-top:12px;}
.media.ok{border-color:var(--ok);border-style:solid;background:rgba(74,222,128,.07);}
.media video,.media img{max-width:100%;border-radius:10px;margin-top:10px;}
.mini{display:inline-block;width:auto;min-width:130px;padding:11px 16px;font-size:1rem;margin:6px 4px 0;}
.rec{color:var(--danger);font-family:'Bebas Neue';font-size:1.5rem;letter-spacing:.08em;}
.savebar{position:fixed;left:0;right:0;bottom:0;background:rgba(11,5,32,.94);border-top:1px solid var(--bd);padding:8px 14px;font-size:.76rem;color:var(--dim);text-align:center;z-index:80;}
/* ── ADMIN COMPARATIF ── */
.cmp{width:100%;border-collapse:collapse;font-size:.82rem;}
.cmp th{position:sticky;top:0;background:var(--panel);z-index:2;}
.cmp td{vertical-align:middle;}
.cbar{height:9px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;min-width:70px;}
.cbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--lime));}
.pill2{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.72rem;border:1px solid var(--bd);margin:1px 2px 1px 0;}
.pill2.hot{border-color:var(--lime);color:var(--lime);}
.pill2.no{border-color:var(--danger);color:var(--danger);}
.pill2.wip{border-color:var(--or);color:var(--or);}
.avat{width:42px;height:42px;border-radius:10px;object-fit:cover;}
.fiche{position:fixed;inset:0;background:rgba(5,0,26,.93);z-index:200;overflow:auto;padding:22px;}
.fiche .inner{max-width:640px;margin:0 auto;}
#adm-gate{max-width:320px;margin:40px auto;text-align:center;}
#adm-gate input{text-align:center;font-size:2rem;letter-spacing:.6em;font-family:'Bebas Neue';}
/* ══════════════════════════════════════════════════════════════
   BACK-OFFICE — thème sombre, structuré, lisible
   ══════════════════════════════════════════════════════════════ */

  display:block;margin-top:14px;}

#admin .qed-h{display:flex;align-items:center;gap:8px;color:#e6edf3;}
#admin .qed-h .btn{margin-left:auto;}
#admin .rep{display:flex;align-items:center;gap:9px;margin-top:8px;}
#admin .rep .rl{flex:0 0 26px;height:26px;border-radius:6px;background:#1f2b3a;color:#79b8ff;
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.8rem;}
#admin .rep input{margin-top:0;flex:1;}
#admin .fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;}
#admin #adm-gate,#admin #adm-login{background:#161b22;border:1px solid #2a323d;}

/* ── fiche candidat, panneau opaque ── */
.fiche{position:fixed;inset:0;background:rgba(1,4,9,.78);z-index:200;overflow:auto;padding:24px 12px 70px;}
.fiche .inner{max-width:880px;margin:0 auto;background:#161b22;color:#e6edf3;border:1px solid #303a48;border-radius:12px;
  padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.7);font-family:'Nunito',sans-serif;}
.fiche .fhead{display:flex;gap:16px;align-items:center;border-bottom:2px solid #2a323d;padding-bottom:16px;}
.fiche .fphoto{width:104px;height:104px;object-fit:cover;border-radius:10px;border:1px solid #303a48;flex:0 0 auto;}
.fiche .fphoto.vide{display:flex;align-items:center;justify-content:center;background:#11161d;color:#5d6a7a;}
.fiche .fid{flex:1;min-width:0;}
.fiche .fid h3{margin:0;font-family:'Nunito';font-weight:900;font-size:1.5rem;color:#e6edf3;line-height:1.15;}
.fiche .fcoord{margin-top:6px;font-size:.95rem;color:#c3ccd6;}
.fiche .fclose{width:auto!important;min-width:0!important;padding:8px 16px!important;margin:0!important;
  background:#1a212a;border:1px solid #3a4552;color:#c3ccd6;border-radius:8px;font-weight:900;cursor:pointer;font-family:'Nunito';}
.fiche .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:680px){ .fiche .fgrid{grid-template-columns:1fr;} }
.fiche .fbox{border:1px solid #2a323d;border-radius:9px;padding:14px 16px 16px;margin-top:14px;background:#12171e;}
.fiche .stepno{color:#58a6ff;font-family:'Nunito';font-weight:900;font-size:.74rem;letter-spacing:.09em;
  text-transform:uppercase;border-bottom:1px solid #2a323d;padding-bottom:6px;margin-bottom:10px;}
.fiche .kv{display:flex;gap:12px;justify-content:space-between;align-items:baseline;padding:5px 0;border-bottom:1px dotted #262f3a;font-size:.92rem;}
.fiche .kv:last-child{border-bottom:none;}
.fiche .kk{color:#8b98a8;flex:0 0 auto;font-size:.84rem;font-weight:700;}
.fiche .kvv{text-align:right;color:#e6edf3;}
.fiche .dim{color:#6b7787;}
.fiche .mono{font-family:ui-monospace,Menlo,monospace;font-size:.82em;color:#8b98a8;}
.fiche .pill2{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.78rem;font-weight:700;
  border:1px solid #3a4552;color:#c3ccd6;background:#1a212a;margin:2px 3px 2px 0;}
.fiche .pill2.hot{background:rgba(63,185,80,.14);border-color:#2f7a3d;color:#7ee787;}
.fiche .pill2.no{background:rgba(248,81,73,.13);border-color:#8b3a35;color:#ff8b81;}
.fiche .pill2.wip{background:rgba(210,153,34,.13);border-color:#8a6a1f;color:#e3b341;}
.fiche .qa{padding:10px 0;border-bottom:1px solid #232b35;}
.fiche .qa:last-child{border-bottom:none;}
.fiche .qq{color:#8b98a8;font-size:.86rem;line-height:1.4;}
.fiche .ra{color:#e6edf3;font-weight:900;margin-top:3px;line-height:1.4;}
.fiche .quote{margin-top:4px;padding:9px 12px;border-left:3px solid #4d9dff;background:#0f141b;border-radius:0 7px 7px 0;
  color:#dbe3ec;line-height:1.5;font-size:.94rem;}
.fiche .cpt{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:99px;background:#1f2b3a;color:#79b8ff;font-size:.7rem;}
.fiche .lien{color:#58a6ff;text-decoration:none;border-bottom:1px solid rgba(88,166,255,.4);}
.fiche table.gr{width:100%;border-collapse:collapse;font-size:.84rem;}
.fiche table.gr th{background:#1c2530;color:#9aa7b6;border:1px solid #2a323d;padding:6px;font-weight:900;font-size:.74rem;text-transform:uppercase;}
.fiche table.gr th.jr{text-align:left;width:60px;}
.fiche table.gr td{border:1px solid #232b35;padding:7px;text-align:center;font-weight:900;}
.fiche table.gr td.oui{background:rgba(63,185,80,.16);color:#7ee787;}
.fiche table.gr td.non{background:#0f141b;color:#39424e;}
.fiche .factions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;padding-top:16px;border-top:2px solid #2a323d;}
.fiche .factions .btn{width:auto;min-width:0;padding:11px 18px;margin:0;border-radius:8px;font-family:'Nunito';
  font-weight:900;cursor:pointer;background:#1a212a;border:1px solid #3a4552;color:#c3ccd6;}
.fiche .factions .btn.danger{border-color:#8b3a35;color:#ff8b81;background:#1a212a;}
.fiche .factions .btn.danger.armed{background:#c0392b;border-color:#c0392b;color:#fff;}
.fiche .factions .btn.danger:hover{background:#241a1a;}
.fiche .factions .btn.danger.armed:hover{background:#a3291d;}
</style>
</head>

/* ══════════ SONS — WebAudio partagé par tous les mini-jeux ══════════ */
var SFX = (function(){
  var AC = null, ok = true;
  function ctx(){
    if(!ok) return null;
    if(!AC){
      try { AC = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e){ ok = false; return null; }
    }
    if(AC.state === "suspended"){ try{ AC.resume(); }catch(e){} }
    return AC;
  }
  function tone(freq, dur, type, vol, delay, glide){
    var c = ctx(); if(!c) return;
    try {
      var t = c.currentTime + (delay || 0);
      var o = c.createOscillator(), g = c.createGain();
      o.type = type || "sine";
      o.frequency.setValueAtTime(freq, t);
      if(glide) o.frequency.exponentialRampToValueAtTime(glide, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol || 0.15, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t + dur + 0.02);
    } catch(e){}
  }
  function noise(dur, hp, vol, delay){
    var c = ctx(); if(!c) return;
    try {
      var t = c.currentTime + (delay || 0);
      var n = Math.floor(c.sampleRate * dur);
      var buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
      for(var i=0;i<n;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/n, 2.2);
      var s = c.createBufferSource(); s.buffer = buf;
      var f = c.createBiquadFilter(); f.type = "highpass"; f.frequency.value = hp || 2000;
      var g = c.createGain(); g.gain.value = vol || 0.14;
      s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
    } catch(e){}
  }
  return {
    unlock: function(){ ctx(); },
    tick:   function(fort){ tone(fort ? 1560 : 1040, 0.06, "square", fort ? 0.20 : 0.11); },
    ice:    function(){ noise(0.09, 2600, 0.15); },
    pop:    function(){ tone(660, 0.10, "triangle", 0.13); },          /* un client arrive */
    ok:     function(){ tone(784, 0.09, "triangle", 0.16); tone(1175, 0.14, "triangle", 0.14, 0.07); },
    bad:    function(){ tone(190, 0.20, "sawtooth", 0.13, 0, 110); },
    leave:  function(){ tone(300, 0.30, "sine", 0.14, 0, 120); },
    spill:  function(){ noise(0.16, 700, 0.13); },
    step:   function(){ tone(520, 0.05, "sine", 0.07); },
    soft:   function(){ tone(880, 0.045, "sine", 0.06); },                         /* chip, case a cocher */
    click:  function(){ tone(660, 0.05, "triangle", 0.10); tone(990, 0.06, "triangle", 0.07, 0.035); },
    swoosh: function(){ noise(0.20, 900, 0.06); },                                 /* apparition d'un ecran */
    ready:  function(){ tone(523, 0.10, "triangle", 0.12); tone(784, 0.14, "triangle", 0.11, 0.10); },
    win:    function(){ [523,659,784,1046].forEach(function(f,i){ tone(f, 0.22, "triangle", 0.15, i*0.09); }); },
    lose:   function(){ tone(330, 0.28, "sine", 0.13); tone(247, 0.36, "sine", 0.12, 0.16); }
  };
})();

/* reduit la taille d'un titre jusqu'a ce que la ligne longue tienne sur UNE ligne */
function fitOneLine(boxId, lineId, maxRem, minRem){
  var box = $(boxId), ln = $(lineId);
  if(!box || !ln) return;
  var s = maxRem, guard = 0;
  box.style.fontSize = s + 'rem';
  while(ln.scrollWidth > box.clientWidth && s > minRem && guard++ < 120){
    s -= 0.05; box.style.fontSize = s + 'rem';
  }
}
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function nl2br(s){ return esc(s).replace(/\n/g,"<br>"); }

    if(v){
      if(v.quiz_nuit) CFG.quiz_nuit = v.quiz_nuit;

      if(v.games) CFG.games = v.games;

      if(v.experiences) CFG.experiences = v.experiences;
      if(v.savoirs) CFG.savoirs = v.savoirs;
      if(v.situations) CFG.situations = v.situations;
      if(v.question_video) CFG.question_video = v.question_video;
      if(v.pitchs) CFG.pitchs = v.pitchs;
      if(v.anciennetes) CFG.anciennetes = v.anciennetes;
      if(v.anciennetes_metier) CFG.anciennetes_metier = v.anciennetes_metier;
      if(v.textes) CFG.textes = v.textes;

/* ══════════ ECRAN 2 — quiz ══════════ */
function screenQuiz(){
  var qs = S.parcours === "nuit" ? CFG.quiz_nuit : CFG.quiz_jour;
  if(S.qi >= qs.length){ return afterQuiz(); }
  var q = qs[S.qi];
  var LETTRES = "ABCDEFGH";
  var h = '<div class="card">'
    + '<div class="step">Question ' + (S.qi+1) + ' / ' + qs.length + '</div>'
    + '<div class="qbar"><i style="width:' + Math.round((S.qi+1)/qs.length*100) + '%"></i></div>'
    + '<div class="q">' + esc(q.q) + '</div>';

  /* question a reponse libre : un champ par element attendu, + une echappatoire */
  if(q.libre){
    var champs = q.champs || ["Réponse"];
    h += '<div class="opts">';
    for(var c=0;c<champs.length;c++){
      h += '<label class="f">' + esc(champs[c]) + '</label>'
        + '<input id="q-l' + c + '" maxlength="90" placeholder="' + esc(q.ph || "") + '">';
    }
    if(q.aucune){
      h += '<div class="chips" style="margin-top:16px"><div class="chip" id="q-non">'
        + esc(q.aucune) + '</div></div>';
    }
    h += '</div><button class="btn" id="q-ok" disabled>CONTINUER</button></div>';
    view(h);
    SFX.swoosh();

    var non = $("q-non");
    function lus(){
      var v = [];
      for(var c=0;c<champs.length;c++){
        var e = $("q-l" + c), x = e ? (e.value||"").trim() : "";
        if(x) v.push(x);
      }
      return v;
    }
    /* le bouton ne s'active qu'avec les 3 morceaux OU la case */
    function maj(){
      var ok = (non && non.classList.contains("on")) || lus().length === champs.length;
      $("q-ok").disabled = !ok;
    }
    for(var c2=0;c2<champs.length;c2++){
      (function(e){ if(e) e.oninput = function(){
        if(non && non.classList.contains("on")) non.classList.remove("on");
        maj();
      }; })($("q-l" + c2));
    }
    if(non) non.onclick = function(){
      this.classList.toggle("on");
      if(this.classList.contains("on")){
        for(var c3=0;c3<champs.length;c3++){ var e = $("q-l" + c3); if(e) e.value = ""; }
      }
      maj();
    };
    maj();

    $("q-ok").onclick = function(){
      var r = (non && non.classList.contains("on")) ? (q.aucune || "Aucune idée") : lus().join("\n");
      S.quiz.push({ q: q.q, r: r, libre: true });
      S.qi++; screenQuiz();
    };
    return;
  }

  h += '<div class="opts">';
  for(var i=0;i<q.o.length;i++){
    h += '<button class="opt" data-i="' + i + '"><span class="k">' + LETTRES.charAt(i) + '</span>'
      + '<span class="kt">' + esc(q.o[i]) + '</span></button>';
  }
  h += '</div></div>';
  view(h);
  SFX.swoosh();
  var btns = document.querySelectorAll(".opt");
  for(var k=0;k<btns.length;k++){
    btns[k].onclick = function(){
      var i = parseInt(this.getAttribute("data-i"),10);
      S.quiz.push({ q: q.q, r: q.o[i] });
      this.classList.add("on");
      setTimeout(function(){ S.qi++; screenQuiz(); }, 200);
    };
  }
}

function afterQuiz(){
  if(S.parcours === "jour"){ return screenOffre(); }
  S.gameList = buildGameList();
  S.gi = 0; S.score = 0; S.games = [];

}

function buildGameList(){
  var list = [];

  if(CFG.games.commande) extras.push("commande");

function screenGameIntro(){
  if(S.gi >= S.gameList.length) return screenScore();
  var g = GAMES[S.gameList[S.gi]];
  view('<div class="card center">'
    + '<div class="step">Jeu ' + (S.gi+1) + ' / ' + S.gameList.length + '</div>'
    + '<div style="margin:10px 0 4px">' + gameIco(g.key, 64) + '</div>'
    + '<div class="big" style="color:var(--lime)">' + g.nom + '</div>'
    + '<div class="mut" style="margin-top:10px">' + esc(g.consigne) + '</div>'
    + '<div class="sp-load" style="margin:20px auto 0"><i style="animation-duration:5s"></i></div>'
    + '<button class="btn" id="gstart">' + esc(T("jeu_btn")) + '</button>'
    + '</div>');
  SFX.ready();
  /* meme principe que l'accueil : ca part tout seul, le bouton ne sert qu'a couper l'attente */
  var parti = false;
  function lancer(){ if(parti) return; parti = true; screenGame(); }
  var autoJeu = setTimeout(lancer, 5000);
  $("gstart").onclick = function(){ clearTimeout(autoJeu); lancer(); };
}

function screenGame(){
  var g = GAMES[S.gameList[S.gi]];
  view('<div class="hud"><div class="t" id="h-t">' + g.nom + '</div><div class="s" id="h-s">0</div></div>'
    + '<div class="bar"><i id="h-bar"></i></div>'
    + '<div id="stage"></div>');
  var stage = $("stage");
  var pts = 0;
  function addPts(n, x, y, txt){
    pts += n;
    $("h-s").textContent = pts;
    if(x != null){
      var p = el('<div class="pop"></div>');
      p.textContent = txt || (n>0 ? "+"+n : String(n));
      p.style.color = n>0 ? "var(--lime)" : "var(--danger)";
      p.style.left = (x-14)+"px"; p.style.top = (y-14)+"px";
      stage.appendChild(p);
      setTimeout(function(){ p.remove(); }, 700);
    }
  }
  function finish(){
    /* on garde le MEILLEUR essai du jeu, pas la somme : rejouer ne gonfle pas le score */
    var prec = null;
    for(var i=0;i<S.games.length;i++){ if(S.games[i].jeu === g.key) prec = S.games[i]; }
    if(prec){
      prec.essais = (prec.essais || 1) + 1;
      prec.points = Math.max(prec.points, pts);
    } else {
      S.games.push({ jeu: g.key, points: pts, essais: 1 });
    }
    S.score = 0;
    for(var j=0;j<S.games.length;j++) S.score += S.games[j].points;
    setTimeout(function(){ screenGameFin(g, pts, prec); }, 350);
  }
  var api = { stage: stage, addPts: addPts, finish: finish, setTimer: setTimer };
  if(g.key === "shaker")  runShaker(api);
  if(g.key === "service") runService(api);
  if(g.key === "commande") runCommande(api);
  if(g.key === "plateau") runPlateau(api);
}

/* Ecran d'entre-deux : on peut refaire le jeu autant de fois qu'on veut. */
function screenGameFin(g, pts, prec){
  var meilleur = pts, essais = 1;
  for(var i=0;i<S.games.length;i++){
    if(S.games[i].jeu === g.key){ meilleur = S.games[i].points; essais = S.games[i].essais || 1; }
  }
  var record = essais > 1 && pts >= meilleur && pts > 0;
  var dernier = S.gi >= S.gameList.length - 1;
  view('<div class="card center">'
    + '<div class="step">' + esc(g.nom) + '</div>'
    + '<div style="margin:10px 0 2px">' + gameIco(g.key, 56) + '</div>'
    + '<div class="big" style="font-size:3.6rem;color:var(--lime);line-height:1">' + pts + '</div>'
    + '<div class="dim" style="margin-top:-2px">points</div>'
    + (essais > 1
        ? '<div class="mut" style="margin-top:10px">' + (record ? "Nouveau record 🎉" : "Meilleur essai : " + meilleur + " points")
          + ' <span class="dim">(' + essais + ' essais)</span></div>'
        : '')
    + '<button class="btn" id="gf-next">' + esc(dernier ? T("jeufin_dernier") : T("jeufin_suivant")) + '</button>'
    + '<button class="btn sec" id="gf-again">' + esc(T("jeufin_rejouer")) + '</button>'
    + '<div class="dim" style="margin-top:10px">' + Tb("jeufin_note") + '</div>'
    + '</div>');
  SFX.ready();
  $("gf-again").onclick = screenGame;
  $("gf-next").onclick  = function(){ S.gi++; screenGameIntro(); };
}

function setTimer(sec, onEnd){
  var bar = $("h-bar"); var t0 = Date.now(); var stop = false;
  (function tick(){
    if(stop) return;
    var e = (Date.now()-t0)/1000;
    var r = Math.max(0, 1 - e/sec);
    if(bar) bar.style.width = (r*100)+"%";
    if(r <= 0){ onEnd(); return; }
    requestAnimationFrame(tick);
  })();
  return function(){ stop = true; };
}

/* ── JEU 1 : SHAKER ── */
/* v3.0 : le shaker est OPAQUE (silhouette pleine, comme un vrai shaker).
   Les ingrédients sont des éprouvettes verticales sur le côté gauche, une couleur
   chacune ; à droite, l'éprouvette du cocktail. Remuer en rythme fait descendre les
   ingrédients et monter le cocktail : c'est le mélange qui se fait. */
function runShaker(api){
  var stage = api.stage;
  var W = stage.clientWidth, H = stage.clientHeight;

  var BPM    = 140;
  var PERIOD = Math.round(60000 / BPM);
  var DUR    = GAMES.shaker.dur;
  var BEATS  = Math.floor(DUR * 1000 / PERIOD);
  var NEED   = Math.max(1, Math.round(BEATS * 0.60));
  var TOL_OK = Math.round(PERIOD * 0.28), TOL_NEAR = Math.round(PERIOD * 0.48);

  var RECETTES = [
    { nom:"MAI TAI",      ing:["Rhum ambré","Jus d’ananas","Glaçons"], c:["#c9702e","#f7c948","#bfe9ff"], cCkt:"#ff8a3d" },
    { nom:"COSMOPOLITAN", ing:["Vodka","Cranberry","Glaçons"],          c:["#e7e0ff","#d81e5b","#bfe9ff"], cCkt:"#ff2e7e" },
    { nom:"MOJITO",       ing:["Rhum blanc","Citron vert","Glaçons"],   c:["#e7e0ff","#8ef04a","#bfe9ff"], cCkt:"#7ee81f" },
    { nom:"BLUE LAGOON",  ing:["Vodka","Curaçao bleu","Glaçons"],       c:["#e7e0ff","#2e7dff","#bfe9ff"], cCkt:"#35c8ff" }
  ];
  var REC = rnd(RECETTES);

  var t0 = 0, done = false, started = false, holding = false;
  var good = 0, changes = 0, mix = 0;
  var stopT = null, lastChangeT = 0, ivs = [];
  var dir = 0, extY = null, prevY = 0, vel = 0;
  var lastBeat = -99, activeSide = 0, beatPulse = 0;

  var SHW = 106, SHH = 159;
  var Y_HAUT = Math.max(160, H * 0.32);
  var Y_BAS  = Math.min(H - 120, H * 0.80);
  var Y_MIN  = SHH/2 + 12, Y_MAX = H - SHH/2 - 24;
  var curY   = (Y_HAUT + Y_BAS) / 2;

  /* ══════ BANDEAU ══════ */
  stage.appendChild(el('<div style="position:absolute;left:0;right:0;top:8px;text-align:center;font-family:\'Bebas Neue\';font-size:1.25rem;letter-spacing:.1em;color:var(--cyan);z-index:3">' + esc(T("shaker_titre")) + '</div>'));
  var titre = el('<div style="position:absolute;left:0;right:0;top:32px;text-align:center;font-family:\'Bebas Neue\';font-size:1.1rem;letter-spacing:.14em;color:var(--or);z-index:3"></div>');
  titre.textContent = REC.nom; stage.appendChild(titre);

  var leg = '';
  REC.ing.forEach(function(n, i){
    leg += '<span style="display:inline-block;margin:0 6px;white-space:nowrap">'
      + '<span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:' + REC.c[i] + ';vertical-align:middle;margin-right:4px"></span>'
      + '<span style="vertical-align:middle">' + esc(n) + '</span></span>';
  });
  stage.appendChild(el('<div style="position:absolute;left:0;right:0;top:53px;text-align:center;color:var(--soft);font-size:.7rem;line-height:1.5;padding:0 6px;z-index:3">' + leg + '</div>'));

  var pctEl = el('<div style="position:absolute;left:0;right:0;top:78px;text-align:center;color:var(--lime);font-size:.82rem;font-weight:900;z-index:3"></div>');
  stage.appendChild(pctEl);

  /* ══════ ÉPROUVETTES ══════ */
  var TB_TOP = 108, TB_H = Math.max(150, H - TB_TOP - 54);
  function eprouvette(x, w, coul, etiquette){
    var t = el('<div style="position:absolute;border-radius:9px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.05);overflow:hidden;z-index:2">'
      + '<i style="position:absolute;left:0;right:0;bottom:0;height:100%;transition:height .18s ease-out"></i></div>');
    t.style.left = x + "px"; t.style.top = TB_TOP + "px";
    t.style.width = w + "px"; t.style.height = TB_H + "px";
    var f = t.firstChild;
    f.style.background = "linear-gradient(180deg," + coul + "cc," + coul + ")";
    f.style.boxShadow = "0 0 14px " + coul + "66";
    stage.appendChild(t);
    if(etiquette){
      /* etiquette calee sur le bord droit de l'eprouvette : elle deborde vers l'interieur
         de l'ecran, jamais en dehors (« COCKTAIL » ne tient pas dans 34 px de large) */
      var lb = el('<div style="position:absolute;white-space:nowrap;text-align:right;font-family:\'Bebas Neue\';font-size:.72rem;letter-spacing:.1em;color:var(--soft);z-index:2"></div>');
      lb.textContent = etiquette;
      lb.style.right = (W - x - w) + "px";
      lb.style.top = (TB_TOP - 17) + "px";
      stage.appendChild(lb);
    }
    return { box:t, fill:f };
  }
  var LW = 24, LG = 7, LX = 10;
  var tubesIng = [];
  for(var i=0;i<3;i++) tubesIng.push(eprouvette(LX + i*(LW+LG), LW, REC.c[i], null));
  var RW = 38, RX = W - RW - 10;
  var tubeCkt = eprouvette(RX, RW, REC.cCkt, "COCKTAIL");

  /* ══════ REPÈRES DE CADENCE ══════ */
  function zone(py){
    var z = el('<div style="position:absolute;left:50%;width:104px;height:54px;margin-left:-52px;margin-top:-27px;border-radius:27px;border:2px dashed rgba(255,255,255,.18);transition:background .09s,border-color .09s,transform .09s;z-index:1"></div>');
    z.style.top = py + "px"; stage.appendChild(z); return z;
  }
  var zH = zone(Y_HAUT), zB = zone(Y_BAS);

  /* ══════ LE SHAKER, OPAQUE ══════ */
  var BODY = "M31 47H69l8 81q1 13-12 13H35q-13 0-12-13z";
  var shk = el('<div style="position:absolute;left:50%;top:0;width:' + SHW + 'px;height:' + SHH + 'px;margin-left:' + (-SHW/2) + 'px;margin-top:' + (-SHH/2) + 'px;transform-origin:50% 70%;will-change:transform;z-index:6;filter:drop-shadow(0 10px 18px rgba(0,0,0,.55))">'
    + '<svg viewBox="0 0 100 150" width="100%" height="100%">'
    +   '<defs><linearGradient id="shkmet" x1="0" y1="0" x2="1" y2="0">'
    +     '<stop offset="0" stop-color="#fbf9ff"/><stop offset=".30" stop-color="#ddd7ef"/>'
    +     '<stop offset=".58" stop-color="#9d95c0"/><stop offset=".82" stop-color="#6f6891"/>'
    +     '<stop offset="1" stop-color="#8d86ae"/></linearGradient></defs>'
    +   '<path d="M41 3h18a7 7 0 0 1 7 7v17H34V10a7 7 0 0 1 7-7z" fill="url(#shkmet)"/>'
    +   '<rect x="29" y="30" width="42" height="13" rx="3.5" fill="url(#shkmet)"/>'
    +   '<path d="' + BODY + '" fill="url(#shkmet)"/>'
    +   '<path d="M38 56v64" stroke="rgba(255,255,255,.55)" stroke-width="7" stroke-linecap="round" fill="none"/>'
    +   '<path d="M64 60v56" stroke="rgba(40,30,70,.30)" stroke-width="9" stroke-linecap="round" fill="none"/>'
    + '</svg></div>');
  stage.appendChild(shk);

  var fb = el('<div style="position:absolute;left:0;right:0;top:96px;text-align:center;font-family:\'Bebas Neue\';font-size:1.7rem;letter-spacing:.06em;opacity:0;transition:opacity .12s;z-index:8"></div>');
  stage.appendChild(fb);

  var hint = el('<div style="position:absolute;left:0;right:0;bottom:6px;text-align:center;color:var(--dim);font-size:.76rem;line-height:1.35;padding:0 12px;z-index:3"></div>');
  hint.textContent = T("shaker_hint");
  stage.appendChild(hint);

  var warnEl = el('<div style="position:absolute;left:0;right:0;top:0;bottom:0;background:rgba(255,50,50,.30);opacity:0;transition:opacity .16s;pointer-events:none;display:flex;align-items:center;justify-content:center;z-index:12">'
    + '<div style="font-family:\'Bebas Neue\';font-size:2.6rem;letter-spacing:.08em;color:#fff;text-shadow:0 3px 18px rgba(0,0,0,.6)"></div></div>');
  var warnTx = warnEl.firstChild; stage.appendChild(warnEl);

  var startEl = el('<div style="position:absolute;left:0;right:0;top:0;bottom:0;background:rgba(5,0,26,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 22px;z-index:20"></div>');
  startEl.appendChild(el('<div style="font-family:\'Bebas Neue\';font-size:1.1rem;letter-spacing:.2em;color:var(--cyan)">' + esc(T("shaker_choisi")) + '</div>'));
  var rn = el('<div style="font-family:\'Bebas Neue\';font-size:2.6rem;color:var(--lime);margin-top:4px"></div>');
  rn.textContent = REC.nom; startEl.appendChild(rn);
  var ri = el('<div style="color:var(--soft);font-size:.95rem;margin-top:8px"></div>');
  ri.textContent = REC.ing.join("  ·  "); startEl.appendChild(ri);
  var rp = el('<div style="font-family:\'Bebas Neue\';font-size:1.5rem;color:#fff;margin-top:22px;animation:bob 1.1s ease-in-out infinite"></div>');
  rp.textContent = T("shaker_start"); startEl.appendChild(rp);
  stage.appendChild(startEl);

  var cd = el('<div style="position:absolute;left:0;right:0;top:96px;text-align:center;font-family:\'Bebas Neue\';font-size:3rem;color:#fff;opacity:0;transition:opacity .1s;z-index:14"></div>');
  stage.appendChild(cd);

  /* ══════ NIVEAUX ══════ */
  function paint(){
    var reste = (1 - mix) * 100;
    for(var i=0;i<tubesIng.length;i++) tubesIng[i].fill.style.height = reste.toFixed(1) + "%";
    tubeCkt.fill.style.height = (mix * 100).toFixed(1) + "%";
    pctEl.textContent = "Cocktail " + Math.round(mix * 100) + "%";
  }
  paint();

  function pulseTubes(){
    tubesIng.forEach(function(t){
      t.box.style.transform = "scaleX(1.12)";
      setTimeout(function(){ t.box.style.transform = ""; }, 130);
    });
    tubeCkt.box.style.transform = "scaleX(1.1)";
    setTimeout(function(){ tubeCkt.box.style.transform = ""; }, 130);
  }

  function flash(txt, col){
    fb.textContent = txt; fb.style.color = col; fb.style.opacity = "1";
    setTimeout(function(){ fb.style.opacity = "0"; }, 240);
  }
  function setWarn(txt){
    if(txt){ warnTx.textContent = txt; warnEl.style.opacity = "1"; }
    else warnEl.style.opacity = "0";
  }

  function registerChange(t){
    if(!started || done) return;
    var e = t - t0;
    if(e < -PERIOD * 0.5) return;
    changes++;
    if(lastChangeT){ ivs.push(t - lastChangeT); if(ivs.length > 3) ivs.shift(); }
    lastChangeT = t;

    var off = ((e % PERIOD) + PERIOD) % PERIOD;
    if(off > PERIOD / 2) off -= PERIOD;
    var a = Math.abs(off);
    if(a <= TOL_OK){ good++; api.addPts(12, W/2, curY, "+12"); SFX.ice(); flash("DEDANS", "var(--lime)"); pulseTubes(); }
    else if(a <= TOL_NEAR){ api.addPts(4, W/2, curY, "+4"); flash("presque", "var(--or)"); }
    else { flash("à côté", "var(--danger)"); }
    mix = Math.min(1, good / NEED);
    paint();
  }

  function avgIv(){
    if(!ivs.length) return PERIOD;
    var s = 0; for(var i=0;i<ivs.length;i++) s += ivs[i];
    return s / ivs.length;
  }

  var MIN_AMP = Math.max(18, H * 0.055);
  function py(ev){ var r = stage.getBoundingClientRect(); return ev.clientY - r.top; }

  function begin(){
    if(started) return;
    started = true;
    SFX.unlock();
    startEl.style.display = "none";
    t0 = Date.now() + PERIOD * 3 + 120;
    stopT = api.setTimer(DUR + (PERIOD * 3 + 120) / 1000, endRound);
  }
  function onDown(ev){
    begin(); holding = true;
    curY = prevY = py(ev); extY = curY; dir = 0;
    if(stage.setPointerCapture && ev.pointerId != null){ try{ stage.setPointerCapture(ev.pointerId); }catch(e){} }
  }
  function onMove(ev){
    if(!holding || done) return;
    var y = py(ev);
    curY = Math.max(Y_MIN, Math.min(Y_MAX, y));
    if(extY === null){ extY = y; return; }
    var d = y - extY;
    if(dir === 0){
      if(Math.abs(d) > MIN_AMP){ dir = d > 0 ? 1 : -1; extY = y; }
      return;
    }
    if(d * dir > 0){ extY = y; }
    else if(Math.abs(d) > MIN_AMP){ dir = -dir; extY = y; registerChange(Date.now()); }
  }
  function onUp(){ holding = false; dir = 0; extY = null; }

  stage.addEventListener("pointerdown", onDown);
  stage.addEventListener("pointermove", onMove);
  stage.addEventListener("pointerup", onUp);
  stage.addEventListener("pointercancel", onUp);
  stage.addEventListener("pointerleave", onUp);

  var idleGuard = setTimeout(function(){ if(!started && !done){ done = true; api.finish(); } }, 20000);

  (function anim(){
    if(done) return;
    var now = Date.now();

    if(started){
      var b = Math.floor((now - t0) / PERIOD);
      if(b !== lastBeat){
        lastBeat = b; beatPulse = now;
        if(b >= -3){ SFX.tick(b >= 0 && b % 4 === 0); activeSide = ((b % 2) + 2) % 2; }
        if(b < 0){ cd.textContent = String(-b); cd.style.opacity = "1"; }
        else if(b === 0){ cd.style.opacity = "0"; }
      }
      var pulse = Math.max(0, 1 - (now - beatPulse) / 220);
      var on = activeSide === 0 ? zB : zH, off = activeSide === 0 ? zH : zB;
      on.style.background  = "rgba(184,255,60," + (0.10 + 0.30 * pulse).toFixed(3) + ")";
      on.style.borderColor = "var(--lime)";
      on.style.transform   = "scale(" + (1 + 0.14 * pulse).toFixed(3) + ")";
      off.style.background = "transparent";
      off.style.borderColor = "rgba(255,255,255,.18)";
      off.style.transform  = "scale(1)";

      var w = "";
      if(b >= 1){
        var idle = now - (lastChangeT || t0);
        if(idle > PERIOD * 2.0) w = "TROP LENT";
        else if(ivs.length >= 2){
          var a = avgIv();
          if(a < PERIOD * 0.62) w = "TROP RAPIDE";
          else if(a > PERIOD * 1.55) w = "TROP LENT";
        }
      }
      setWarn(w);
    }

    vel = curY - prevY; prevY = curY;
    var tilt = Math.max(-15, Math.min(15, vel * 0.7));
    var bp = started ? Math.max(0, 1 - (now - beatPulse) / 200) : 0;
    shk.style.transform = "translateY(" + curY.toFixed(1) + "px) rotate(" + tilt.toFixed(1) + "deg) scale(" + (1 + 0.06 * bp).toFixed(3) + ")";

    requestAnimationFrame(anim);
  })();

  function firework(cx, cy, hue){
    for(var i=0;i<24;i++){
      (function(){
        var p = el('<div style="position:absolute;width:7px;height:7px;border-radius:50%;pointer-events:none;z-index:30"></div>');
        p.style.background = "hsl(" + Math.floor(hue + Math.random()*60) + ",100%,63%)";
        p.style.left = cx + "px"; p.style.top = cy + "px";
        stage.appendChild(p);
        var ang = Math.random() * Math.PI * 2, sp = 70 + Math.random() * 170;
        var vx = Math.cos(ang) * sp, vy = Math.sin(ang) * sp, st = Date.now();
        (function fly(){
          var e = (Date.now() - st) / 1000;
          if(e > 1.4){ p.remove(); return; }
          p.style.transform = "translate(" + (vx*e).toFixed(1) + "px," + (vy*e + 170*e*e).toFixed(1) + "px)";
          p.style.opacity = String(Math.max(0, 1 - e/1.4));
          requestAnimationFrame(fly);
        })();
      })();
    }
  }

  function endRound(){
    if(done) return;
    done = true;
    clearTimeout(idleGuard);
    if(stopT) stopT();
    setWarn("");
    stage.removeEventListener("pointerdown", onDown);
    stage.removeEventListener("pointermove", onMove);

    var win = (good / BEATS) >= 0.60;
    if(win){ api.addPts(50, null, null, null); SFX.win(); } else SFX.lose();

    var ov = el('<div style="position:absolute;left:0;right:0;top:0;bottom:0;background:rgba(5,0,26,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 20px;z-index:25;animation:zin .25s ease-out"></div>');
    var faces = el('<div style="font-size:2.5rem;letter-spacing:6px"></div>');
    faces.textContent = win ? "😃🤩🥳😄😍" : "😐😕🙁";
    if(win) faces.style.animation = "bob 1s ease-in-out infinite";
    ov.appendChild(faces);
    var t = el('<div style="font-family:\'Bebas Neue\';font-size:2.5rem;margin-top:10px"></div>');
    t.textContent = win ? T("shaker_win") : T("shaker_lose");
    t.style.color = win ? "var(--lime)" : "var(--danger)";
    ov.appendChild(t);
    var s = el('<div style="color:var(--soft);font-size:.95rem;margin-top:8px;line-height:1.45"></div>');
    s.textContent = win ? T("shaker_win_s")
                        : "Cocktail mélangé à " + Math.round(mix*100) + "% — il fallait aller jusqu’au bout.";
    ov.appendChild(s);
    stage.appendChild(ov);

    if(win){
      firework(W*0.28, H*0.34, 40);
      setTimeout(function(){ firework(W*0.72, H*0.28, 290); }, 260);
      setTimeout(function(){ firework(W*0.50, H*0.46, 160); }, 540);
      setTimeout(function(){ firework(W*0.34, H*0.24, 200); }, 860);
    }
    setTimeout(function(){ api.finish(); }, win ? 2800 : 2000);
  }
}

/* ── JEU 2 : LE SERVICE ── */
function runService(api){
  var stage = api.stage;
  /* tailles differentes : trois verres de meme taille sont durs a distinguer d'un coup d'oeil */
  var TYPES = [
    { id:"biere", ico:"🍺", nom:"Pression", sz:"3rem",   szc:"2.3rem" },
    { id:"cockt", ico:"🍹", nom:"Cocktail", sz:"2.8rem", szc:"2.1rem" },
    { id:"shot",  ico:"🥃", nom:"Shot",     sz:"1.9rem", szc:"1.4rem" }
  ];
  function typeDe(id){ for(var i=0;i<TYPES.length;i++) if(TYPES[i].id === id) return TYPES[i]; return TYPES[0]; }
  var FACES = ["😃","😎","🥳","😁","😄","🤩","😅","🧑"];
  var clients = [], done = false;
  var W = stage.clientWidth, H = stage.clientHeight;
  var BAR_Y = H * 0.60;

  // ── le comptoir : la barre qui separe la salle du bar ──
  stage.appendChild(el('<div style="position:absolute;left:0;right:0;top:8px;text-align:center;font-family:\'Bebas Neue\';font-size:1.4rem;letter-spacing:.1em;color:var(--cyan);z-index:3">' + esc(T("service_titre")) + '</div>'));
  var bar = el('<div style="position:absolute;left:0;right:0;height:16px;border-radius:8px;background:linear-gradient(180deg,#8a6a3f,#4a3320);box-shadow:0 6px 18px rgba(0,0,0,.5)"></div>');
  bar.style.top = BAR_Y + "px";
  stage.appendChild(bar);
  var lbl = el('<div style="position:absolute;left:10px;font-family:\'Bebas Neue\';font-size:.85rem;letter-spacing:.22em;color:rgba(255,255,255,.35)">LE BAR</div>');
  lbl.style.top = (BAR_Y + 22) + "px";
  stage.appendChild(lbl);

  // ── bouteilles, cote bar (sous la barre), GRANDES ──
  for(var i=0;i<TYPES.length;i++){
    (function(t, idx){
      var b = el('<div class="btl"></div>');
      b.innerHTML = '<div style="font-size:' + t.sz + ';line-height:1;height:3rem;display:flex;align-items:center;justify-content:center">' + t.ico + '</div>'
        + '<div style="font-family:\'Bebas Neue\';font-size:.8rem;letter-spacing:.06em;color:var(--dim);margin-top:2px">' + t.nom + '</div>';
      b.style.width = "88px"; b.style.height = "104px";
      b.style.flexDirection = "column";
      b.style.left = (W*(0.5 + (idx-1)*0.30) - 44) + "px";
      b.style.top  = (BAR_Y + 46) + "px";
      b.setAttribute("data-type", t.id);
      stage.appendChild(b);
    })(TYPES[i], i);
  }

  // ── clients, cote salle (au-dessus de la barre) ──
  function spawn(){
    if(done || clients.length >= 3) return;
    var slots = [0.18, 0.5, 0.82];
    var used = clients.map(function(c){ return c.slot; });
    var free = slots.filter(function(s){ return used.indexOf(s) === -1; });
    if(!free.length) return;
    var slot = rnd(free);
    var t = rnd(TYPES);
    var c = el('<div class="cli"><div class="face"></div><div class="want"></div><div class="pat"><i></i></div></div>');
    c.style.width = "96px";
    c.querySelector(".face").textContent = rnd(FACES);
    c.querySelector(".face").style.fontSize = "3.2rem";
    var w = c.querySelector(".want");
    w.textContent = t.ico;
    w.style.fontSize = t.szc; w.style.marginTop = "0";
    var p = c.querySelector(".pat");
    p.style.width = "74px"; p.style.height = "7px";
    c.style.left = (W*slot - 48) + "px";
    c.style.top = (BAR_Y - 172) + "px";
    stage.appendChild(c);
    SFX.pop();
    clients.push({ el:c, type:t.id, slot:slot, pat:1, gauge:c.querySelector(".pat>i") });
  }
  spawn(); spawn();
  var spawnT = setInterval(spawn, 1600);

  var patT = setInterval(function(){
    if(done) return;
    for(var i=clients.length-1;i>=0;i--){
      var c = clients[i];
      c.pat -= 0.017;
      if(c.gauge){
        c.gauge.style.width = Math.max(0, c.pat*100) + "%";
        c.gauge.style.background = c.pat > 0.5 ? "var(--ok)" : (c.pat > 0.25 ? "var(--or)" : "var(--danger)");
      }
      if(c.pat <= 0){
        var r = c.el.getBoundingClientRect(), sr = stage.getBoundingClientRect();
        api.addPts(-8, r.left - sr.left + 40, r.top - sr.top + 30, "parti !");
        SFX.leave();
        c.el.remove(); clients.splice(i,1); spawn();
      }
    }
  }, 100);

  function hitClient(cx, cy){
    for(var i=0;i<clients.length;i++){
      var r = clients[i].el.getBoundingClientRect();
      if(cx >= r.left-24 && cx <= r.right+24 && cy >= r.top-24 && cy <= r.bottom+24) return clients[i];
    }
    return null;
  }

  var drag = null;
  stage.addEventListener("pointerdown", function(ev){
    if(done) return;
    SFX.unlock();
    var b = ev.target.closest ? ev.target.closest(".btl") : null;
    if(!b) return;
    b.classList.add("grab");
    var f = el('<div class="fly"></div>');
    f.textContent = b.querySelector("div").textContent;
    f.style.fontSize = typeDe(b.getAttribute("data-type")).sz;
    var r = stage.getBoundingClientRect();
    f.style.left = (ev.clientX - r.left - 24) + "px";
    f.style.top  = (ev.clientY - r.top  - 30) + "px";
    stage.appendChild(f);
    drag = { btl:b, fly:f, type:b.getAttribute("data-type") };
  });
  stage.addEventListener("pointermove", function(ev){
    if(!drag) return;
    var r = stage.getBoundingClientRect();
    drag.fly.style.left = (ev.clientX - r.left - 24) + "px";
    drag.fly.style.top  = (ev.clientY - r.top  - 30) + "px";
    var hit = hitClient(ev.clientX, ev.clientY);
    for(var i=0;i<clients.length;i++) clients[i].el.classList.toggle("tgt", clients[i] === hit);
  });
  stage.addEventListener("pointerup", function(ev){
    if(!drag) return;
    var hit = hitClient(ev.clientX, ev.clientY);
    var r = stage.getBoundingClientRect();
    var x = ev.clientX - r.left, y = ev.clientY - r.top;
    if(hit){
      if(hit.type === drag.type){
        api.addPts(12, x, y, "SERVI !");
        SFX.ok();
        hit.el.remove();
        clients.splice(clients.indexOf(hit), 1);
        spawn();
      } else {
        api.addPts(-6, x, y, "pas ça");
        SFX.bad();
      }
    }
    drag.btl.classList.remove("grab");
    drag.fly.remove();
    for(var i=0;i<clients.length;i++) clients[i].el.classList.remove("tgt");
    drag = null;
  });

  api.setTimer(GAMES.service.dur, function(){
    done = true;
    clearInterval(spawnT); clearInterval(patT);
    api.finish();
  });
  var vigie = setInterval(function(){
    if(!document.body.contains(stage)){ done = true; clearInterval(spawnT); clearInterval(patT); clearInterval(vigie); }
  }, 500);
}

/* ── JEU 3 : LA COMMANDE ── (memoire + rendu de monnaie) */
function runCommande(api){
  var stage = api.stage;
  var CARTE = [
    { nom:"Pression",  ico:"🍺", prix:4 },
    { nom:"Cocktail",  ico:"🍹", prix:8 },
    { nom:"Soft",      ico:"🥤", prix:3 },
    { nom:"Café", ico:"☕",       prix:2 },
    { nom:"Planche",   ico:"🧀", prix:12 }
  ];
  var done = false, manche = 0, stopT = null;

  function fin(){ if(done) return; done = true; if(stopT) stopT(); api.finish(); }

  function manche_suivante(){
    if(done) return;
    manche++;
    if(manche > 3) return fin();

    // 1) on tire la commande
    var n = manche + 1;                       // 2, 3 puis 4 articles
    var cmd = [];
    for(var i=0;i<n;i++) cmd.push(rnd(CARTE));
    var total = cmd.reduce(function(a,c){ return a + c.prix; }, 0);

    // 2) MEMORISATION
    stage.innerHTML = "";
    var h = '<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center">'
      + '<div style="font-family:\'Bebas Neue\';font-size:1.2rem;letter-spacing:.14em;color:var(--cyan)">TABLÉE ' + manche + ' / 3 — MÉMORISE</div>'
      + '<div style="display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:18px">';
    for(var j=0;j<cmd.length;j++){
      h += '<div style="background:rgba(255,255,255,.06);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;min-width:96px">'
        + '<div style="font-size:2.8rem;line-height:1">' + cmd[j].ico + '</div>'
        + '<div style="font-family:\'Bebas Neue\';font-size:1rem;letter-spacing:.05em;margin-top:4px">' + cmd[j].nom + '</div></div>';
    }
    h += '</div><div id="cdown" style="font-family:\'Bebas Neue\';font-size:2.6rem;color:var(--lime);margin-top:22px">4</div></div>';
    stage.innerHTML = h;

    var t = 4;
    var iv = setInterval(function(){
      t--;
      var d = document.getElementById("cdown");
      if(d) d.textContent = t;
      if(t <= 0){ clearInterval(iv); phase_rappel(cmd, total); }
    }, 1000);
  }

  function phase_rappel(cmd, total){
    if(done) return;
    // quantites attendues par article
    var attendu = {};
    cmd.forEach(function(c){ attendu[c.nom] = (attendu[c.nom]||0) + 1; });
    var choisi = {};
    var h = '<div style="position:absolute;inset:0;padding:12px;overflow:auto">'
      + '<div style="font-family:\'Bebas Neue\';font-size:1.2rem;letter-spacing:.14em;color:var(--cyan);text-align:center">REFAIS LA COMMANDE</div>'
      + '<div class="dim" style="text-align:center;font-size:.8rem;margin-top:2px">Touche un article autant de fois qu’il a été commandé</div>'
      + '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px">';
    CARTE.forEach(function(c, k){
      h += '<div class="opt cmd-it" data-n="' + c.nom + '" style="text-align:center;margin-top:0;padding:8px 4px">'
        + '<div style="font-size:1.8rem;line-height:1">' + c.ico + '</div>'
        + '<div style="font-family:\'Bebas Neue\';font-size:.82rem;letter-spacing:.04em">' + c.nom + '</div>'
        + '<div style="color:var(--dim);font-size:.7rem">' + c.prix + ' €</div>'
        + '<div class="qte" style="font-family:\'Bebas Neue\';font-size:1.35rem;color:var(--lime);line-height:1.1">0</div></div>';
    });
    h += '</div><button class="btn" id="cmd-ok" style="margin-top:12px">' + esc(T("commande_btn")) + '</button></div>';
    stage.innerHTML = h;

    var its = stage.querySelectorAll(".cmd-it");
    for(var k=0;k<its.length;k++){
      its[k].onclick = function(){
        var nm = this.getAttribute("data-n");
        choisi[nm] = (choisi[nm]||0) + 1;
        this.querySelector(".qte").textContent = choisi[nm];
        this.classList.add("on");
      };
      its[k].oncontextmenu = function(e){ e.preventDefault(); };
    }
    document.getElementById("cmd-ok").onclick = function(){
      var ok = true;
      CARTE.forEach(function(c){
        if((attendu[c.nom]||0) !== (choisi[c.nom]||0)) ok = false;
      });
      if(ok) api.addPts(20, null, null, null);
      else   api.addPts(-5, null, null, null);
      phase_monnaie(total, ok);
    };
  }

  function phase_monnaie(total, memoOk){
    if(done) return;
    var billets = [5, 10, 20, 50];
    var donne = billets.filter(function(b){ return b > total; })[0] || (Math.ceil(total/10)*10 + 10);
    var rendu = donne - total;
    var PIECES = [1, 2, 5, 10, 20];
    var pris = [];
    var h = '<div style="position:absolute;inset:0;padding:12px;overflow:auto;text-align:center">'
      + '<div style="font-family:\'Bebas Neue\';font-size:1.2rem;letter-spacing:.14em;color:var(--cyan)">LA MONNAIE</div>'
      + '<div style="margin-top:12px;color:var(--soft)">Total : <b style="color:var(--tx)">' + total + ' €</b><br>Le client donne <b style="color:var(--or)">' + donne + ' €</b></div>'
      + '<div style="font-family:\'Bebas Neue\';font-size:1.1rem;letter-spacing:.1em;margin-top:14px;color:var(--dim)">' + esc(T("commande_titre")) + '</div>'
      + '<div id="mtot" style="font-family:\'Bebas Neue\';font-size:2.2rem;color:var(--lime);margin:4px 0">0 €</div>'
      + '<div style="display:flex;flex-wrap:wrap;gap:9px;justify-content:center">';
    PIECES.forEach(function(p){
      h += '<button class="opt mon" data-v="' + p + '" style="width:auto;min-width:64px;text-align:center;margin-top:0;padding:9px 10px"><b style="font-size:1.2rem">' + p + ' €</b></button>';
    });
    h += '</div><button class="btn sec mini" id="m-raz" style="margin-top:12px">Effacer</button>'
      + '<button class="btn" id="m-ok" style="margin-top:8px">JE RENDS</button></div>';
    stage.innerHTML = h;

    function maj(){
      var t = pris.reduce(function(a,b){ return a+b; }, 0);
      document.getElementById("mtot").textContent = t + " €";
      document.getElementById("mtot").style.color = t === rendu ? "var(--ok)" : "var(--lime)";
    }
    var ms = stage.querySelectorAll(".mon");
    for(var k=0;k<ms.length;k++) ms[k].onclick = function(){ pris.push(+this.getAttribute("data-v")); maj(); };
    document.getElementById("m-raz").onclick = function(){ pris = []; maj(); };
    document.getElementById("m-ok").onclick = function(){
      var t = pris.reduce(function(a,b){ return a+b; }, 0);
      if(t === rendu) api.addPts(25, null, null, null);
      else            api.addPts(-8, null, null, null);
      var msg = (t === rendu)
        ? '<div style="color:var(--ok);font-family:\'Bebas Neue\';font-size:2rem">JUSTE !</div>'
        : '<div style="color:var(--danger);font-family:\'Bebas Neue\';font-size:2rem">Il fallait rendre ' + rendu + ' €</div>';
      stage.innerHTML = '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center">'
        + '<div>' + msg + '<div class="dim" style="margin-top:8px">Mémoire : ' + (memoOk ? "OK" : "ratée") + '</div></div></div>';
      setTimeout(manche_suivante, 1200);
    };
  }

  stopT = api.setTimer(150, fin);
  manche_suivante();
}

/* ── JEU 4 : LE PLATEAU ── */
/* v2.5 : refonte. Un plateau chargé de verres pleins, un parcours qui serpente.
   Le joueur fait le tour le plus de fois possible en renversant le moins possible.
   Renverse quand il va trop vite ou quand il sort du chemin. Durée = GAMES.plateau.dur. */
function runPlateau(api){
  var stage = api.stage;
  var W = stage.clientWidth, H = stage.clientHeight;
  var done = false, holding = false;

  var NB_VERRES = 5;
  var TOL_PISTE = 26;      // px d'écart toléré avant de renverser
  var V_OK      = 12;      // px/frame au-delà desquels ça déborde
  var R_POINT   = 34;      // rayon de validation d'un point de passage

  /* ══════ LE PARCOURS ══════ */
  var xL = W*0.30, xR = W*0.70;
  var A = Math.min(W*0.16, 46);
  var yTop = 86, yBas = H - 42;
  var P = [];
  function seg(n, fn){ for(var i=0;i<n;i++) P.push(fn(i/n)); }
  seg(42, function(t){ return { x: xL + A*Math.sin(t*Math.PI*3), y: yTop + t*(yBas-yTop) }; });  // descente gauche
  seg(14, function(t){ return { x: xL + t*(xR-xL), y: yBas }; });                                 // bas
  seg(42, function(t){ return { x: xR + A*Math.sin(t*Math.PI*3), y: yBas - t*(yBas-yTop) }; });   // montée droite
  seg(14, function(t){ return { x: xR - t*(xR-xL), y: yTop }; });                                 // haut
  var N = P.length;
  var pstr = P.map(function(p){ return p.x.toFixed(1) + "," + p.y.toFixed(1); }).join(" ")
           + " " + P[0].x.toFixed(1) + "," + P[0].y.toFixed(1);

  stage.appendChild(el('<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" style="position:absolute;left:0;top:0;pointer-events:none">'
    + '<polyline points="' + pstr + '" fill="none" stroke="rgba(255,255,255,.085)" stroke-width="' + (TOL_PISTE*2) + '" stroke-linecap="round" stroke-linejoin="round"/>'
    + '<polyline points="' + pstr + '" fill="none" stroke="rgba(77,217,232,.32)" stroke-width="2" stroke-dasharray="7 9" stroke-linecap="round"/>'
    + '</svg>'));

  stage.appendChild(el('<div style="position:absolute;left:0;right:0;top:8px;text-align:center;font-family:\'Bebas Neue\';font-size:1.3rem;letter-spacing:.1em;color:var(--cyan);z-index:3">' + esc(T("plateau_t1")) + '</div>'));
  stage.appendChild(el('<div style="position:absolute;left:0;right:0;top:32px;text-align:center;font-family:\'Bebas Neue\';font-size:1.05rem;letter-spacing:.14em;color:var(--or);z-index:3">' + esc(T("plateau_t2")) + '</div>'));
  var infoEl = el('<div style="position:absolute;left:0;right:0;top:56px;text-align:center;color:var(--soft);font-size:.84rem;z-index:3"></div>');
  stage.appendChild(infoEl);

  /* cible : le prochain point de passage */
  var cible = el('<div style="position:absolute;width:30px;height:30px;margin-left:-15px;margin-top:-15px;border-radius:50%;border:2px solid var(--lime);opacity:.55;z-index:2"></div>');
  stage.appendChild(cible);

  /* ══════ LE PLATEAU ══════ */
  var TW = 96, TH = 46;
  var tray = el('<div style="position:absolute;left:0;top:0;width:' + TW + 'px;height:' + TH + 'px;margin-left:' + (-TW/2) + 'px;margin-top:' + (-TH/2) + 'px;transform-origin:50% 80%;will-change:transform;z-index:6"></div>');
  var verres = [];
  for(var i=0;i<NB_VERRES;i++){
    var g = el('<div style="position:absolute;bottom:9px;width:15px;height:26px;border-radius:2px 2px 5px 5px;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.07);overflow:hidden">'
      + '<div style="position:absolute;left:0;right:0;bottom:0;height:21px;background:linear-gradient(180deg,#ffd166,#ff8a3d)"></div></div>');
    g.style.left = (8 + i*17) + "px";
    tray.appendChild(g);
    verres.push({ el:g, liq:g.firstChild, n:1 });
  }
  tray.appendChild(el('<div style="position:absolute;left:0;right:0;bottom:0;height:9px;border-radius:5px;background:linear-gradient(180deg,#a8814f,#5b4026);box-shadow:0 4px 12px rgba(0,0,0,.5)"></div>'));
  stage.appendChild(tray);

  var tx = P[0].x, ty = P[0].y, px0 = tx, py0 = ty, vx = 0, vy = 0;
  var idx = 0, tours = 0;

  function place(){
    var tilt = Math.max(-24, Math.min(24, vx * 1.6));
    tray.style.transform = "translate(" + tx.toFixed(1) + "px," + ty.toFixed(1) + "px) rotate(" + tilt.toFixed(1) + "deg)";
  }
  function paint(){
    for(var i=0;i<verres.length;i++){
      var v = verres[i];
      v.liq.style.height = (21 * v.n).toFixed(1) + "px";
      v.liq.style.opacity = v.n > 0.02 ? "1" : "0";
    }
    var moy = moyenne();
    infoEl.textContent = "Tour " + (tours+1) + "  ·  liquide " + Math.round(moy*100) + "%";
  }
  function moyenne(){
    var s = 0; for(var i=0;i<verres.length;i++) s += verres[i].n;
    return s / verres.length;
  }
  place(); paint();

  var flash = el('<div style="position:absolute;left:0;right:0;top:50%;margin-top:-24px;text-align:center;font-family:\'Bebas Neue\';font-size:2.4rem;color:var(--lime);opacity:0;transition:opacity .2s;z-index:10"></div>');
  stage.appendChild(flash);
  function say(txt, col){
    flash.textContent = txt; flash.style.color = col || "var(--lime)"; flash.style.opacity = "1";
    setTimeout(function(){ flash.style.opacity = "0"; }, 620);
  }

  var startEl = el('<div style="position:absolute;left:0;right:0;top:0;bottom:0;background:rgba(5,0,26,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 24px;z-index:20"></div>');
  startEl.appendChild(el('<div style="font-size:2.6rem">🍸🍸🍸</div>'));
  startEl.appendChild(el('<div style="font-family:\'Bebas Neue\';font-size:2.2rem;color:var(--lime);margin-top:6px">LE PLATEAU</div>'));
  startEl.appendChild(el('<div style="color:var(--soft);font-size:.95rem;margin-top:8px;line-height:1.45">' + Tb("plateau_intro") + '</div>'));
  var sp2 = el('<div style="font-family:\'Bebas Neue\';font-size:1.5rem;color:#fff;margin-top:22px;animation:bob 1.1s ease-in-out infinite">' + esc(T("plateau_start")) + '</div>');
  startEl.appendChild(sp2);
  stage.appendChild(startEl);

  /* ══════ GOUTTES ══════ */
  function goutte(){
    var d = el('<div style="position:absolute;width:6px;height:9px;border-radius:50% 50% 60% 60%;background:#ff9a3d;opacity:.9;pointer-events:none;z-index:5"></div>');
    d.style.left = (tx - 8 + Math.random()*16) + "px";
    d.style.top  = (ty - 4) + "px";
    stage.appendChild(d);
    var st = Date.now(), sx = (Math.random()-0.5)*40;
    (function fall(){
      var e = (Date.now()-st)/1000;
      if(e > 0.7){ d.remove(); return; }
      d.style.transform = "translate(" + (sx*e).toFixed(1) + "px," + (180*e*e + 40*e).toFixed(1) + "px)";
      d.style.opacity = String(Math.max(0, 0.9 - e/0.7));
      requestAnimationFrame(fall);
    })();
  }

  /* ══════ ENTREE ══════ */
  var started = false, stopT = null;
  function begin(){
    if(started) return;
    started = true; SFX.unlock(); startEl.style.display = "none";
    stopT = api.setTimer(GAMES.plateau.dur, fin);
  }
  function pos(ev){ var r = stage.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; }
  function onDown(ev){
    begin(); holding = true;
    var q = pos(ev); tx = px0 = q.x; ty = py0 = q.y;
    if(stage.setPointerCapture && ev.pointerId != null){ try{ stage.setPointerCapture(ev.pointerId); }catch(e){} }
  }
  function onMove(ev){ if(!holding || done) return; var q = pos(ev); tx = q.x; ty = q.y; }
  function onUp(){ holding = false; }
  stage.addEventListener("pointerdown", onDown);
  stage.addEventListener("pointermove", onMove);
  stage.addEventListener("pointerup", onUp);
  stage.addEventListener("pointercancel", onUp);
  stage.addEventListener("pointerleave", onUp);

  var idleGuard = setTimeout(function(){ if(!started && !done){ done = true; api.finish(); } }, 20000);

  /* ══════ BOUCLE ══════ */
  var lastGoutte = 0;
  (function loop(){
    if(done) return;
    vx = tx - px0; vy = ty - py0; px0 = tx; py0 = ty;
    place();

    if(started && holding){
      /* écart au chemin : point le plus proche */
      var best = 1e9;
      for(var i=0;i<N;i++){
        var dx = P[i].x - tx, dy = P[i].y - ty, d2 = dx*dx + dy*dy;
        if(d2 < best) best = d2;
      }
      var dev = Math.sqrt(best);
      var sp = Math.sqrt(vx*vx + vy*vy);

      var perte = 0;
      if(sp  > V_OK)      perte += (sp - V_OK) * 0.0016;
      if(dev > TOL_PISTE) perte += (dev - TOL_PISTE) * 0.0012;
      if(perte > 0){
        for(var k=0;k<verres.length;k++) verres[k].n = Math.max(0, verres[k].n - perte);
        var now = Date.now();
        if(perte > 0.004 && now - lastGoutte > 110){ lastGoutte = now; goutte(); SFX.spill(); }
        paint();
      }

      /* progression sur le parcours */
      var guard = 0;
      while(guard++ < 6){
        var t = P[idx], ddx = t.x - tx, ddy = t.y - ty;
        if(ddx*ddx + ddy*ddy > R_POINT*R_POINT) break;
        idx++;
        if(idx >= N){
          idx = 0; tours++;
          var moy = moyenne();
          var pts = Math.round(70 * moy);
          api.addPts(pts, tx, ty, "+" + pts);
          SFX.ok();
          say("TOUR " + tours + " !");
          for(var k2=0;k2<verres.length;k2++) verres[k2].n = 1;   // on repose, on remplit
          paint();
        }
      }
      cible.style.left = P[idx].x + "px";
      cible.style.top  = P[idx].y + "px";
    }
    requestAnimationFrame(loop);
  })();

  function fin(){
    if(done) return;
    done = true;
    clearTimeout(idleGuard);
    if(stopT) stopT();
    stage.removeEventListener("pointerdown", onDown);
    stage.removeEventListener("pointermove", onMove);
    var moy = moyenne();
    var ov = el('<div style="position:absolute;left:0;right:0;top:0;bottom:0;background:rgba(5,0,26,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 20px;z-index:25;animation:zin .25s ease-out"></div>');
    ov.appendChild(el('<div style="font-size:2.4rem">' + (tours >= 2 ? "🍸✨" : "🍸") + '</div>'));
    var t2 = el('<div style="font-family:\'Bebas Neue\';font-size:2.4rem;color:var(--lime);margin-top:6px"></div>');
    t2.textContent = tours + (tours > 1 ? " TOURS" : " TOUR");
    ov.appendChild(t2);
    var s2 = el('<div style="color:var(--soft);font-size:.95rem;margin-top:8px"></div>');
    s2.textContent = tours ? "Dernier plateau à " + Math.round(moy*100) + "% de liquide."
                           : "Pas un tour complet. Le chemin, pas la ligne droite.";
    ov.appendChild(s2);
    stage.appendChild(ov);
    if(tours >= 2) SFX.win(); else SFX.lose();
    setTimeout(function(){ api.finish(); }, 1900);
  }
}

/* L'offre téléchargeable est un vrai PDF, mis en page à part et déposé à côté de
   index.html dans le dépôt. Le lien porte download ET target : si le navigateur
   honore download il enregistre le fichier, sinon il l'ouvre dans un onglet. */
var PDF_OFFRE = "offre-lumiia.pdf";
function telechargerOffre(){
  try {
    var a = document.createElement("a");
    a.href = PDF_OFFRE;
    a.download = "LUMIIA-offre-emploi.pdf";
    a.target = "_blank"; a.rel = "noopener";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ a.remove(); }, 500);

}

/* ══════════════════════════════════════
   CANDIDATURE — contact d'abord, puis étapes, tout sauvegardé
   ══════════════════════════════════════ */
var CAND = { id:null, data:{} };
var LSK = "lumiia_cand_v2";

function candLocalLoad(){
  try{
    var raw = localStorage.getItem(LSK);
    if(!raw) return false;
    var o = JSON.parse(raw);
    if(!o || !o.id) return false;
    if(Date.now() - (o.ts||0) > 1000*60*60*24*21) { localStorage.removeItem(LSK); return false; }
    CAND.id = o.id; CAND.data = o.data || {};
    return true;
  }catch(e){ return false; }
}
function candLocalSave(){
  try{ localStorage.setItem(LSK, JSON.stringify({ id:CAND.id, data:CAND.data, ts:Date.now() })); }catch(e){}
}
function candSave(patch, cb){
  Object.keys(patch||{}).forEach(function(k){ CAND.data[k] = patch[k]; });
  CAND.data.maj = Date.now();
  candLocalSave();
  if(!db){ if(cb) cb(); return; }
  if(!CAND.id){
    var r = db.ref(FB_PATH + "/candidats").push();
    CAND.id = r.key; candLocalSave();
    r.set(CAND.data).then(function(){ if(cb) cb(); }).catch(function(){ if(cb) cb(); });
  } else {
    db.ref(FB_PATH + "/candidats/" + CAND.id).update(CAND.data)
      .then(function(){ if(cb) cb(); }).catch(function(){ if(cb) cb(); });
  }
}
function bandeau(){ return '<div class="savebar">' + esc(T("bandeau")) + '</div>'; }
function jauge(n, total){
  var h = '<div class="steps">';
  for(var i=1;i<=total;i++) h += '<i class="' + (i<n ? "done" : (i===n ? "on" : "")) + '"></i>';
  return h + '</div>';
}

    var mail = ($("c-mail").value||"").trim();
    if(nom.length < 2){ toast("Il nous faut votre nom"); return; }
    if(tel.replace(/[^0-9]/g,"").length < 9){ toast("Un numéro valide, sinon on ne peut pas rappeler"); return; }

      statut:"en cours", etape:1, ts: CAND.data.ts || Date.now()
    }, screenEtape2);
  };
}

/* Photo : createImageBitmap redresse l'EXIF (sinon les photos prises de travers
   arrivent tournées de 90°, ce que le simple <img> + drawImage ne corrige pas). */
function brancherPhoto(idFile, idPick, idStatut, idPrev, idBox){
  $(idPick).onclick = function(){ $(idFile).click(); };
  $(idFile).onchange = function(){
    var f = this.files && this.files[0];
    if(!f) return;
    $(idStatut).textContent = "Traitement…";
    function dessine(src, w, hh){
      var W = 520, r = Math.min(1, W / w);
      var cv = document.createElement("canvas");
      cv.width = Math.round(w * r); cv.height = Math.round(hh * r);
      cv.getContext("2d").drawImage(src, 0, 0, cv.width, cv.height);
      var dat = cv.toDataURL("image/jpeg", 0.72);
      $(idPrev).innerHTML = '<img src="' + dat + '">';
      $(idStatut).textContent = "Photo enregistrée ✓";
      $(idBox).classList.add("ok");
      candSave({ photo:dat });
    }
    function secours(){
      var img = new Image(), rd = new FileReader();
      rd.onload = function(){ img.src = rd.result; };
      img.onload = function(){ dessine(img, img.width, img.height); };
      rd.readAsDataURL(f);
    }
    if(window.createImageBitmap){
      try {
        createImageBitmap(f, { imageOrientation: "from-image" })
          .then(function(bm){ dessine(bm, bm.width, bm.height); })
          .catch(secours);
        return;
      } catch(e){ secours(); return; }
    }
    secours();
  };
}

/* ══════════════════════════════════════
   ÉCRAN D'ENREGISTREMENT (plein écran)
   ══════════════════════════════════════ */
function screenRec(slot, video, question, titre, retour){
  var mot = video ? "VIDÉO" : "AUDIO";
  view('<div class="card">'
    + '<div class="stepno">' + esc(titre) + '</div>'
    + '<div class="q">' + esc(question || "") + '</div>'
    + '<div class="dim">' + Tb("rec_note", { n:REC_MAX }) + '</div>'
    + '<div class="media" id="r-box"><div id="r-st" class="dim">' + esc(T("rec_pret")) + '</div>'
    + '<div id="r-prev"></div></div>'
    + '<button class="btn" id="r-rec">' + esc(T("rec_btn")) + '</button>'
    + '<button class="btn" id="r-ok" disabled>' + esc(video ? T("rec_ok_video") : T("rec_ok_audio")) + '</button>'
    + '<button class="btn sec" id="r-back">' + esc(T("btn_retour")) + '</button>'
    + '</div>' + bandeau());

  var st = $("r-st"), prev = $("r-prev"), box = $("r-box");
  var stream = null, mr = null, iv = null, stopped = false, envoye = false;

  $("r-back").onclick = function(){ nettoie(); retour(); };
  $("r-ok").onclick   = function(){ nettoie(); retour(); };

  function nettoie(){
    if(iv) clearInterval(iv);
    try{ if(mr && mr.state === "recording") mr.stop(); }catch(e){}
    if(stream) stream.getTracks().forEach(function(t){ t.stop(); });
  }

  $("r-rec").onclick = function(){
    if(!navigator.mediaDevices || typeof MediaRecorder === "undefined"){
      toast("Votre navigateur ne permet pas l’enregistrement"); return;
    }
    this.disabled = true;
    st.textContent = "Autorisez le micro" + (video ? " et la caméra" : "") + "…";
    navigator.mediaDevices.getUserMedia(video ? { audio:true, video:{ facingMode:"user" } } : { audio:true })
    .then(function(s){
      stream = s;
      var mime = ["video/webm;codecs=vp8,opus","video/webm","video/mp4","audio/webm","audio/mp4"]
        .filter(function(m){ return (video ? m.indexOf("video")===0 : true) && MediaRecorder.isTypeSupported(m); })[0];
      mr = new MediaRecorder(stream, mime ? { mimeType:mime } : undefined);
      var chunks = [];
      mr.ondataavailable = function(e){ if(e.data && e.data.size) chunks.push(e.data); };

      prev.innerHTML = "";
      if(video){
        var live = document.createElement("video");
        live.autoplay = true; live.muted = true; live.playsInline = true; live.srcObject = stream;
        live.style.maxHeight = "240px"; prev.appendChild(live);
      }
      var n = REC_MAX;
      st.innerHTML = '<span class="rec">● REC</span> <span id="r-cd">' + n + '</span>s';
      iv = setInterval(function(){
        n--; var c = $("r-cd"); if(c) c.textContent = n;
        if(n <= 0) stop();
      }, 1000);
      var stopBtn = el('<button class="btn sec mini">■ STOP</button>');
      prev.appendChild(stopBtn);
      stopBtn.onclick = stop;

      function stop(){
        if(stopped) return; stopped = true;
        clearInterval(iv);
        try{ mr.stop(); }catch(e){}
        stream.getTracks().forEach(function(t){ t.stop(); });
      }

      mr.onstop = function(){
        var blob = new Blob(chunks, { type: mime || (video ? "video/webm" : "audio/webm") });
        st.textContent = "Envoi…";
        prev.innerHTML = "";
        var pv = document.createElement(video ? "video" : "audio");
        pv.src = URL.createObjectURL(blob); pv.controls = true; pv.playsInline = true;
        pv.style.maxHeight = "220px"; prev.appendChild(pv);
        uploadMedia(blob, slot + (video ? "-video" : "-audio"), function(ok, u){
          if(ok){
            envoye = true;
            box.classList.add("ok");
            st.textContent = (video ? "Vidéo envoyée ✓" : "Audio envoyé ✓");
            var patch = {}; patch[slot + "_url"] = u; patch[slot + "_type"] = video ? "video" : "audio";
            candSave(patch);
            $("r-ok").disabled = false;
            SFX.win();
          } else {
            st.textContent = "Envoi impossible — vous pouvez continuer sans.";
            $("r-ok").disabled = false;
          }
          var again = el('<button class="btn sec mini">↺ Recommencer</button>');
          prev.appendChild(again);
          again.onclick = function(){ nettoie(); screenRec(slot, video, question, titre, retour); };
        });
      };
      mr.start();
    })
    .catch(function(){
      st.textContent = "Accès refusé. Vous pouvez continuer sans.";
      $("r-rec").disabled = false;
      $("r-ok").disabled = false;
    });
  };
}

function uploadMedia(blob, kind, cb){
  if(!fbstore || !CAND.id){ cb(false); return; }
  var ext = (blob.type.indexOf("mp4") > -1) ? "mp4" : "webm";
  var ref = fbstore.ref(FB_PATH + "/media/" + CAND.id + "-" + kind + "." + ext);
  ref.put(blob).then(function(snap){
    return snap.ref.getDownloadURL();
  }).then(function(u){ cb(true, u); }).catch(function(){ cb(false); });
}
