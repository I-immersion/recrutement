/* ══════════════════════════════════════════════════════════════
   PARCOURS EXTRAS — v7.0
   ──────────────────────────────────────────────────────────────
   Une voie SEPAREE, courte, ouverte depuis un bouton du mail. Trois
   ecrans la ou la candidature salariee en compte sept : ces gens ont
   deja rempli le parcours complet, leur profil, leurs experiences,
   leur CV et leur photo sont deja dans la fiche. On ne redemande que
   ce qu'on ne sait pas encore.

   ON N'ENTRE ICI QUE PAR LE LIEN DU MAIL, qui porte l'identifiant de
   la fiche. Pas de parcours extra depuis zero : ce n'est pas une
   offre publique, c'est une proposition faite a des gens dont la
   candidature a deja ete lue.

   LE STATUT EST UNE PORTE, PAS UNE ETAPE. Un extra se facture ; il
   faut donc DEJA une structure. L'app le constate, elle n'invite
   personne a en creer une : orienter un candidat vers le statut
   d'independant puis le faire travailler sur ses creneaux, c'est
   exactement ce que l'URSSAF regarde en HCR. Qui repond non est
   remercie, sa reponse est enregistree, et on s'arrete la.

   Range dans candidats/<id>/extra — PAS dans un nouveau chemin
   Firebase : aucune regle a republier, et la fiche reste le seul
   endroit ou vit tout ce qui concerne une personne. L'onglet Extras
   de l'admin lit ce sous-objet, les listes de candidatures l'ignorent.
   ══════════════════════════════════════════════════════════════ */
var XT = { refs: [] };

function xtSave(patch, cb){
  var x = CAND.data.extra || {};
  Object.keys(patch || {}).forEach(function(k){ x[k] = patch[k]; });
  x.maj = Date.now();
  CAND.data.extra = x;
  candLocalSave();
  if(!db || !CAND.id){ if(cb) cb(); return; }
  db.ref(FB_PATH + "/candidats/" + CAND.id + "/extra").update(x)
    .then(function(){ if(cb) cb(); }).catch(function(){ if(cb) cb(); });
}

function xtCarte(n, titre, sous, contenu, btn){
  return '<div class="card">'
    + '<div class="stepno">EXTRAS \u00b7 ' + n + ' / 4</div>'
    + '<div class="q">' + titre + '</div>'
    + (sous ? '<div class="dim">' + sous + '</div>' : '')
    + contenu + btn + '</div>';
}

/* ── 1 / 3 — le statut ── */
function xtStatut(){
  var x = CAND.data.extra || {};
  var h = '<div class="chips" id="xt-st">'
    + '<div class="chip' + (x.statut === "oui" ? " on" : "") + '" data-v="oui">Oui, j\u2019ai d\u00e9j\u00e0 un statut</div>'
    + '<div class="chip' + (x.statut === "non" ? " on" : "") + '" data-v="non">Non, pas encore</div>'
    + '</div>'
    + '<div id="xt-siret" class="' + (x.statut === "oui" ? "" : "hidden") + '">'
    +   '<label class="f" style="margin-top:20px">Num\u00e9ro SIRET</label>'
    +   '<input id="xt-sir" inputmode="numeric" value="' + esc(x.siret || "") + '">'
    +   '<label class="f">Nom de votre structure ou nom propre</label>'
    +   '<input id="xt-soc" value="' + esc(x.societe || "") + '">'
    + '</div>';
  view(xtCarte(1, "VOUS FACTUREZ&nbsp;?",
    "Les extras se font en facturation, pas en bulletin de paie. Il faut donc d\u00e9j\u00e0 "
    + "un statut \u2014 micro-entreprise ou autre. On vous le demande d\u2019embl\u00e9e, "
    + "pour ne pas vous faire perdre votre temps.",
    h,
    '<button class="btn" id="xt-go">CONTINUER</button>'));
  /* UN SEUL gestionnaire par pastille. La version precedente appelait
     chipsExclusifs() puis reaffectait onclick juste apres : la seconde
     affectation ECRASAIT la premiere, plus aucune pastille ne s'allumait,
     le champ SIRET ne s'ouvrait jamais et CONTINUER refusait d'avancer
     — parcours bloque des le premier ecran.
     onclick n'est pas un point d'accroche empilable : deux fonctions qui le
     posent sur le meme element, c'est la derniere qui gagne, en silence. */
  var chips = document.querySelectorAll("#xt-st .chip");
  for(var i=0;i<chips.length;i++) chips[i].onclick = function(){
    for(var z=0;z<chips.length;z++) chips[z].classList.remove("on");
    this.classList.add("on");
    $("xt-siret").classList[this.getAttribute("data-v") === "oui" ? "remove" : "add"]("hidden");
  };
  $("xt-go").onclick = function(){
    var v = chipVal("xt-st");
    if(!v){ toast("Dites-nous o\u00f9 vous en \u00eates"); return; }
    if(v === "non"){ xtSave({ statut:"non" }, xtSansStatut); return; }
    /* Les deux sont exiges : sans SIRET ni nom, on ne peut pas recevoir une
       facture, donc on ne peut pas faire travailler la personne. Le refuser
       maintenant vaut mieux que le decouvrir le soir du service.
       Quatorze chiffres : c'est la longueur d'un SIRET, et la verifier ici evite
       une saisie de SIREN a neuf chiffres qu'on ne remarquerait qu'a la
       facturation. */
    var sir = ($("xt-sir").value || "").replace(/[^0-9]/g, "");
    var soc = ($("xt-soc").value || "").trim();
    if(!sir){ toast("Le num\u00e9ro SIRET est n\u00e9cessaire pour vous facturer"); return; }
    if(sir.length !== 14){ toast("Un SIRET compte 14 chiffres \u2014 il en manque " + Math.abs(14 - sir.length)); return; }
    if(!soc){ toast("Indiquez le nom de votre structure, ou votre nom propre"); return; }
    xtSave({ statut:"oui", siret:sir, societe:soc }, xtVous);
  };
}

/* Refuser proprement vaut mieux que laisser esperer. Et on ne conseille a
   personne de creer une structure pour nous : c'est une decision qui engage
   bien au-dela de LUMIIA, et ce serait exactement le geste qui transforme un
   extra en salarie deguise aux yeux d'un inspecteur. */
function xtSansStatut(){
  view('<div class="card center">'
    + '<div style="font-size:2.8rem">\ud83e\udd1d</div>'
    + '<div class="big" style="color:var(--lime)">MERCI D\u2019AVOIR<br>R\u00c9PONDU</div>'
    + '<div class="mut" style="margin-top:12px">Sans statut d\u00e9j\u00e0 en place, on ne peut pas travailler '
    + 'ensemble sur ce format-l\u00e0. Et on ne va pas vous pousser \u00e0 en cr\u00e9er un : \u00e7a vous engage '
    + 'bien au-del\u00e0 de nous, et \u00e7a ne se d\u00e9cide pas pour quelques soir\u00e9es.</div>'
    + '<div class="mut" style="margin-top:12px">On garde votre candidature. D\u00e8s qu\u2019un poste salari\u00e9 '
    + 'se lib\u00e8re, vous \u00eates sur la liste \u2014 et la porte du bar est ouverte en attendant.</div>'
    + '<button class="btn sec" id="xt-fin">Revenir \u00e0 l\u2019accueil</button></div>');
  $("xt-fin").onclick = function(){ window.location.search = ""; };
}

/* ── 3 / 4 — les references ── */
function xtLigneRef(i, r){
  r = r || {};
  return '<div class="xtref" data-i="' + i + '">'
    + (i === 0 ? '<div class="xtrn">R\u00e9f\u00e9rence 1 <span class="dim">(facultative)</span></div>' : '')
    + '<label class="f">\u00c9tablissement et ville</label>'
    + '<input class="xr-eta" value="' + esc(r.etab || "") + '">'
    + '<label class="f">Votre poste, et sur quelle p\u00e9riode</label>'
    + '<input class="xr-post" value="' + esc(r.poste || "") + '">'
    + '<label class="f">Qui peut parler de vous, et son num\u00e9ro</label>'
    + '<input class="xr-nom" value="' + esc(r.nom || "") + '">'
    + '<input class="xr-tel" type="tel" inputmode="tel" value="' + esc(r.tel || "") + '">'
    + '</div>';
}

function xtRefs(){
  var x = CAND.data.extra || {};
  var rs = x.refs || [];
  /* La premiere reference est ouverte, les deux autres repliees. Trois blocs
     identiques deplies d'un coup donnent l'impression qu'il faut tout remplir,
     alors qu'aucun n'est obligatoire. Une reference deja saisie s'ouvre d'office :
     on ne cache pas a quelqu'un ce qu'il a ecrit. */
  var h = xtLigneRef(0, rs[0]);
  for(var i=1;i<3;i++){
    var pleine = !!(rs[i] && (rs[i].etab || rs[i].nom || rs[i].tel));
    h += '<div class="xtacc' + (pleine ? ' ouvert' : '') + '" data-acc="' + i + '">'
      + '<button class="xtacct" data-ouvre="' + i + '">'
      +   '<span class="fl">' + (pleine ? '\u25be' : '\u25b8') + '</span> '
      +   'Ajouter une ' + (i === 1 ? 'deuxi\u00e8me' : 'troisi\u00e8me') + ' r\u00e9f\u00e9rence'
      + '</button>'
      + '<div class="xtaccin">' + xtLigneRef(i, rs[i]) + '</div>'
      + '</div>';
  }
  h += '<div class="chips" style="margin-top:18px"><div class="chip' + (x.refs_ok ? " on" : "") + '" id="xt-ok">'
    + 'Oui, vous pouvez les appeler</div></div>';
  view(xtCarte(3, "QUI PEUT DIRE<br>DU BIEN DE VOUS&nbsp;?",
    "Sur un extra, on n\u2019a pas trois semaines pour se rendre compte. Un \u00e9tablissement o\u00f9 vous avez "
    + "tenu un bar et quelqu\u2019un qu\u2019on peut appeler, c\u2019est ce qui remplace la p\u00e9riode d\u2019essai \u2014 "
    + "mais rien n\u2019est obligatoire, remplissez ce que vous avez.",
    h,
    '<button class="btn" id="xt-go">CONTINUER</button>'
    + '<button class="btn sec" id="xt-back">Retour</button>'));
  var accs = document.querySelectorAll(".xtacct");
  for(var a=0;a<accs.length;a++) accs[a].onclick = function(){
    var boite = this.parentNode;
    boite.classList.toggle("ouvert");
    this.querySelector(".fl").textContent = boite.classList.contains("ouvert") ? "\u25be" : "\u25b8";
  };
  $("xt-ok").onclick = function(){ this.classList.toggle("on"); };
  $("xt-back").onclick = xtVous;
  $("xt-go").onclick = function(){
    var out = [], bl = document.querySelectorAll(".xtref");
    for(var i=0;i<bl.length;i++){
      var b = bl[i];
      var o = { etab:(b.querySelector(".xr-eta").value || "").trim(),
                poste:(b.querySelector(".xr-post").value || "").trim(),
                nom:(b.querySelector(".xr-nom").value || "").trim(),
                tel:(b.querySelector(".xr-tel").value || "").trim() };
      if(o.etab || o.nom || o.tel) out.push(o);
    }
    /* Plus aucune reference n'est exigee : elles sont annoncees facultatives, un
       refus de passer les dementirait. Le parcours entier tient la meme ligne que
       le reste de l'app — on n'elimine personne sur un champ vide, on note ce
       qu'on a et on rappelle. */
    xtSave({ refs: out, refs_ok: $("xt-ok").classList.contains("on") }, xtDispos);
  };
}

/* ── 2 / 4 — parlez-nous de vous ──
   Place JUSTE APRES la porte du statut, avant les references : on demande a
   quelqu'un de se raconter pendant qu'il est encore en train de se dire oui,
   pas apres lui avoir fait remplir quatre champs de coordonnees d'anciens
   patrons. Les references demandent d'aller chercher des numeros ; ce n'est pas
   le moment de couper l'elan.
   Sur un extra on ne se rencontre pas avant le premier service : entendre une
   voix, c'est souvent ce qui decide. Facultatif — refuser d'enregistrer n'ecarte
   personne, ca reste la regle de toute l'app.
   L'enregistreur du parcours principal est reutilise tel quel : meme bouton,
   meme televersement, meme gestion du remplacement audio/video. */
var XT_QUESTION = "Qui \u00eates-vous, et o\u00f9 avez-vous fait votre exp\u00e9rience ? "
  + "Une \u00e0 deux minutes suffisent : les lieux, l'ambiance que vous aimez, "
  + "ce que vous aimez dans ce m\u00e9tier et ce que vous n'aimez pas.";

function xtVous(){
  var x = CAND.data.extra || {};
  var slot = SLOTS.xtra, fait = CAND.data[slot + "_url"], typ = CAND.data[slot + "_type"];
  /* Ecrire ou parler : chacun s'exprime mieux dans un registre. Imposer le micro
     ecarterait les timides, imposer le clavier ecarterait ceux qui racontent bien
     et ecrivent mal. On propose les deux et on RECOMMANDE l'enregistrement, sans
     l'exiger. */
  var h = '<label class="f" style="margin-top:16px">\u00c9crivez-le, si vous pr\u00e9f\u00e9rez</label>'
    + '<textarea id="xt-pres" rows="5">' + esc(x.presentation || "") + '</textarea>'
    + '<label class="f" style="margin-top:20px">Ajouter un audio ou une vid\u00e9o '
    +   '<span class="dim">\u2014 recommand\u00e9</span></label>'
    + '<div class="media' + (fait ? " ok" : "") + '">'
    + '<div class="dim">' + esc(XT_QUESTION) + '</div>'
    + '<button class="btn sec mini' + clsMedia(false, typ, fait) + '" id="xt-aud">'
    +   esc(libMedia(false, typ, fait)) + '</button>'
    + '<button class="btn sec mini' + clsMedia(true, typ, fait) + '" id="xt-vid">'
    +   esc(libMedia(true, typ, fait)) + '</button>'
    + (fait ? '<button class="btn sec mini sup" id="xt-sup">\ud83d\uddd1 Supprimer</button>' : '')
    + (fait ? '<div class="pmode">' + esc(noteMedia(typ)) + '</div>' : '')
    + (fait ? '<div class="pprev">' + (typ === "video"
        ? '<video src="' + esc(fait) + '" controls playsinline preload="none"></video>'
        : '<audio src="' + esc(fait) + '" controls preload="none"></audio>') + '</div>' : '')
    + '</div>';
  view(xtCarte(2, "PARLEZ-NOUS<br>DE VOUS",
    "Une minute de voix ou de vid\u00e9o en dit plus qu\u2019une page de CV. "
    + "C\u2019est facultatif, mais c\u2019est plus vivant. Lancez-vous&nbsp;!",
    h,
    '<button class="btn" id="xt-go">CONTINUER</button>'
    + '<button class="btn sec" id="xt-back">Retour</button>'));
  $("xt-aud").onclick = function(){
    xtEnregistrerPres(null);
    avantRemplacer(CAND.data[slot + "_url"], CAND.data[slot + "_type"], false, function(){
      screenRec(slot, false, XT_QUESTION, "EXTRAS \u00b7 2 / 4", xtVous);
    });
  };
  $("xt-vid").onclick = function(){
    xtEnregistrerPres(null);
    avantRemplacer(CAND.data[slot + "_url"], CAND.data[slot + "_type"], true, function(){
      screenRec(slot, true, XT_QUESTION, "EXTRAS \u00b7 2 / 4", xtVous);
    });
  };
  if($("xt-sup")) $("xt-sup").onclick = function(){
    var patch = {}; patch[slot + "_url"] = null; patch[slot + "_type"] = null; patch[slot + "_err"] = null;
    CAND.data[slot + "_url"] = null; CAND.data[slot + "_type"] = null; CAND.data[slot + "_err"] = null;
    candSave(patch, function(){ toast("Enregistrement supprim\u00e9"); xtVous(); });
  };
  $("xt-back").onclick = function(){ xtEnregistrerPres(xtStatut); };
  $("xt-go").onclick   = function(){ xtEnregistrerPres(xtRefs); };
}

/* Le texte est enregistre AVANT de quitter l'ecran, dans les deux sens : partir
   en arriere ne doit pas effacer ce qu'on vient d'ecrire. */
function xtEnregistrerPres(suite){
  var t = $("xt-pres") ? ($("xt-pres").value || "").trim() : "";
  xtSave({ presentation: t }, suite);
}

/* ── 4 / 4 — quand, et a quel point seul ── */
var XT_SOIRS = ["Vendredi soir","Samedi soir","Dimanche","En semaine si besoin","Soir\u00e9es priv\u00e9es"];
var XT_FREQ  = ["1 \u00e0 2 fois par mois","Presque chaque week-end","Au coup par coup"];
var XT_PREV  = ["Sur l'instant","La veille, \u00e7a me va","Deux ou trois jours","Une semaine"];
var XT_AUTO  = ["Je peux tenir un bar seul","\u00c0 deux, sans probl\u00e8me","Je d\u00e9bute sur ce format"];

function xtChips(id, liste, choisi, multi){
  var d = String(choisi || "").split("|");
  var h = '<div class="chips" id="' + id + '">';
  liste.forEach(function(v){
    h += '<div class="chip' + (d.indexOf(v) > -1 ? " on" : "") + '" data-v="' + esc(v) + '">' + esc(v) + '</div>';
  });
  return h + '</div>';
}
function xtVals(id){
  var v = [], on = document.querySelectorAll("#" + id + " .chip.on");
  for(var i=0;i<on.length;i++) v.push(on[i].getAttribute("data-v"));
  return v.join("|");
}

/* Meme grille que la derniere etape du parcours salarie : sept jours, trois
   moments, une case a cocher. Emmanuel la lit deja d'un coup d'oeil ailleurs
   dans l'app, autant garder le meme objet. */
function xtGrille(g, JRS, CRE){
  var h = '<table class="dispo"><tr><th></th>';
  CRE.forEach(function(c){ h += '<th>' + c + '</th>'; });
  h += '</tr>';
  JRS.forEach(function(j){
    h += '<tr><td class="dj">' + j + '</td>';
    CRE.forEach(function(c){
      var k = j + '-' + c;
      h += '<td><span class="cx' + (g.indexOf(k) > -1 ? ' on' : '') + '" data-k="' + k + '">\u2713</span></td>';
    });
    h += '</tr>';
  });
  return h + '</table>';
}

function xtDispos(){
  var x = CAND.data.extra || {};
  var g = x.grille || "";
  var CRE = ["Matin","Apr\u00e8s-midi","Soir"];
  var JRS = ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
  var h = '<label class="f">Vos jours de disponibilit\u00e9s pour des extras</label>'
    + xtChips("xt-soirs", XT_SOIRS, x.soirs)
    + '<label class="f" style="margin-top:18px">\u00c0 quel rythme&nbsp;?</label>' + xtChips("xt-freq", XT_FREQ, x.frequence)
    + '<label class="f" style="margin-top:18px">On vous pr\u00e9vient combien de temps avant&nbsp;?</label>' + xtChips("xt-prev", XT_PREV, x.prevenance)
    + '<label class="f" style="margin-top:18px">Derri\u00e8re le bar, vous en \u00eates o\u00f9&nbsp;?</label>' + xtChips("xt-auto", XT_AUTO, x.autonomie)
    /* La grille sert a UNE chose : savoir quand decrocher son telephone. Les
       pastilles au-dessus disent quand la personne peut TRAVAILLER, ce qui n'a
       rien a voir avec les moments ou elle peut PARLER. */
    + '<label class="f" style="margin-top:22px">Quand peut-on vous appeler pour en parler&nbsp;?</label>'
    + '<div class="dim">Cochez les moments o\u00f9 vous d\u00e9crochez volontiers.</div>'
    + xtGrille(g, JRS, CRE)
    + '<label class="f" style="margin-top:22px">Quelque chose \u00e0 ajouter&nbsp;?</label>'
    + '<textarea id="xt-mot" rows="3" placeholder="Facultatif">' + esc(x.mot || "") + '</textarea>';
  view(xtCarte(4, "QUAND EST-CE<br>QU\u2019ON VOUS APPELLE&nbsp;?",
    "Dernier \u00e9cran. On note vos disponibilit\u00e9s pour ne pas vous d\u00e9ranger un mardi \u00e0 14 h.",
    h,
    '<button class="btn" id="xt-go">JE VALIDE</button>'
    + '<button class="btn sec" id="xt-back">Retour</button>'));
  ["xt-soirs","xt-freq","xt-prev","xt-auto"].forEach(function(id){
    var cs = document.querySelectorAll("#" + id + " .chip");
    for(var i=0;i<cs.length;i++) cs[i].onclick = function(){
      /* soirs : plusieurs choix. Les trois autres : un seul. */
      if(this.parentNode.id !== "xt-soirs"){
        var f = this.parentNode.querySelectorAll(".chip");
        for(var j=0;j<f.length;j++) f[j].classList.remove("on");
      }
      this.classList.toggle("on");
    };
  });
  var cxs = document.querySelectorAll(".dispo .cx");
  for(var q=0;q<cxs.length;q++) cxs[q].onclick = function(){ this.classList.toggle("on"); };
  $("xt-back").onclick = xtRefs;
  $("xt-go").onclick = function(){
    var gr = [], on = document.querySelectorAll(".dispo .cx.on");
    for(var i=0;i<on.length;i++) gr.push(on[i].getAttribute("data-k"));
    xtSave({ soirs: xtVals("xt-soirs"), frequence: xtVals("xt-freq"),
             prevenance: xtVals("xt-prev"), autonomie: xtVals("xt-auto"),
             grille: gr.join("|"),
             mot: ($("xt-mot").value || "").trim(), etat: "complet",
             envoye: Date.now() }, xtFin);
  };
}

function xtFin(){
  var pre = (CAND.data.prenom || "").trim();
  view('<div class="card center">'
    + '<div style="font-size:3rem">\ud83c\udf7b</div>'
    + '<div class="big" style="color:var(--lime)">C\u2019EST NOT\u00c9<br>' + esc(pre ? pre.toUpperCase() : "") + '</div>'
    + '<div class="mut" style="margin-top:12px">On vous rappelle pour en parler de vive voix.</div>'
    + '<div class="mut" style="margin-top:12px">D\u2019ici l\u00e0, passez boire un verre. '
    + 'C\u2019est encore le meilleur moyen de voir si l\u2019endroit vous va.</div>'
    + '<button class="btn sec" id="xt-home">Revenir \u00e0 l\u2019accueil</button></div>');
  $("xt-home").onclick = function(){ window.location.search = ""; };
}

/* ══════════ VUE TV — classement projeté ══════════ */
function initTv(){
  if(!db){ $("lb").textContent = "Hors ligne"; return; }
  db.ref(FB_PATH + "/scores").on("value", function(snap){
    var v = snap.val() || {}, arr = [];
    for(var k in v){ if(v[k] && v[k].prenom) arr.push(v[k]); }
    arr.sort(function(a,b){ return (b.score||0) - (a.score||0); });
    arr = arr.slice(0, 12);
    var h = "";
    for(var i=0;i<arr.length;i++){
      h += '<div class="r">' + (i+1) + '</div><div class="p">' + esc(arr[i].prenom) + '</div><div class="s">' + (arr[i].score||0) + '</div>';
    }
    $("lb").innerHTML = h || '<div class="dim">Personne n\u2019a encore os\u00e9.</div>';
  });
}

/* ══════════ ADMIN ══════════ */
/* Le code d'acces n'est PAS ici : il vit sur le serveur, dans
   private/.recrutement_code. L'app se contente de l'envoyer au guichet,
   qui repond par un laissez-passer Firebase valable 1 h.
   Consequence : on change le code sans redeployer l'app, et lire ce
   fichier n'apprend rien a personne. NE PAS REINTRODUIRE DE CODE ICI. */
var ADM_PASS_URL  = "https://reservation.lumiia.fr/api/recrutement-pass.php";
/* Les codes du jury vivent sur le serveur, dans private/, et JAMAIS dans
   Firebase : /recrutement/config est en lecture publique, ils y seraient
   lisibles par n'importe qui. Ce guichet est la seule facon d'y toucher, et il
   exige un jeton d'envoi — que seul un admin recoit. */
var ADM_JURES_URL = "https://reservation.lumiia.fr/api/recrutement-jures.php";

/* ROLES — v6.0.
   Deux codes a 6 chiffres, deux roles. L'ADMIN a tout ; le JURE lit les
   candidatures, pose des notes et des commentaires, et rien d'autre.
   LA FRONTIERE N'EST PAS DANS CETTE PAGE. Elle est dans le jeton signe par le
   serveur : le jure porte la revendication « recrutement_jure », jamais
   « recrutement_admin », et ce sont les regles de la base qui refusent ensuite
   toute ecriture dans /recrutement/config. Masquer des onglets ne protege rien ;
   on les masque seulement pour ne pas proposer ce qui sera refuse.
   Le role est relu dans les revendications du jeton a chaque ouverture — jamais
   conserve dans le navigateur, ou il serait modifiable. */
var ROLE = "admin";
function estAdmin(){ return ROLE === "admin"; }

/* Le membre qui note. C'est une SIGNATURE, pas une authentification : a
   l'interieur du cercle des jures, rien n'empeche de choisir le nom d'un autre.
   La frontiere qui compte — ne pas pouvoir modifier les contenus — est ailleurs. */
var MEMBRE = "";
var MEMBRE_CLE = "lumiia_membre";
var MEMBRE_ADMIN = "emmanuel";

function equipeTriee(){
  var e = CFG.equipe || {}, L = [], vuAdmin = false;
  for(var k in e){
    if(!e[k] || !e[k].nom) continue;
    if(k === MEMBRE_ADMIN) vuAdmin = true;
    L.push({ id:k, nom:e[k].nom, order:e[k].order || 0 });
  }
  /* Emmanuel est membre du jury qu'on l'ait saisi ou non : ses notes existaient
     avant la liste, elles doivent avoir une colonne meme si la liste est vide. */
  if(!vuAdmin) L.push({ id:MEMBRE_ADMIN, nom:"Emmanuel", order:-1 });
  L.sort(function(a,b){ return (a.order - b.order) || a.nom.localeCompare(b.nom); });
  return L;
}
function membreNom(id){
  var e = (CFG.equipe || {})[id];
  if(e && e.nom) return e.nom;
  return (id === MEMBRE_ADMIN) ? "Emmanuel" : id;
}
/* Tant que ce drapeau est faux, chacun ne voit que ses propres notes.
   Il vit dans la config, que seul l'admin peut ecrire : un jure ne peut pas le
   retourner. A dire franchement : les notes des autres sont bien dans les donnees
   qu'il lit, c'est donc une garantie contre l'effet d'ancrage, pas un coffre. */
function avisOuverts(){ return !!CFG.avis_ouverts; }
function voitLesAutres(){ return estAdmin() || avisOuverts(); }

function initAdmin(){
  var gate = $("adm-gate"), champ = $("adm-code"), bouton = $("adm-code-go"), msg = $("adm-code-err");
  var enCours = false;

  function dire(txt, genre){
    msg.className = genre || "dim";
    msg.textContent = txt;
  }

  /* Firebase decide seul de ce qui est affiche : tant qu'une session est
     valide on est dans l'admin, des qu'elle expire on retombe sur le code. */
  auth.onAuthStateChanged(function(u){
    if(u){
      /* On lit le role DANS LE JETON, pas dans une variable posee a la connexion :
         apres un rechargement la session Firebase revient toute seule, sans repasser
         par le code, et il faut quand meme savoir a qui on a affaire. */
      u.getIdTokenResult().then(function(r){
        var cl = (r && r.claims) || {};
        ROLE = cl.recrutement_jure ? "jure" : "admin";
        /* Depuis la v6.2 chaque jure a SON code : le jeton dit qui il est.
           Une note n'est donc plus signee sur declaration mais par le code qui
           a ouvert la session. Le repli sur le choix manuel ne sert qu'aux
           sessions ouvertes avant cette version. */
        MEMBRE = cl.membre ? String(cl.membre) : "";
      }).catch(function(){ ROLE = "admin"; MEMBRE = ""; }).then(function(){
        if(!MEMBRE){ try { MEMBRE = localStorage.getItem(MEMBRE_CLE) || ""; } catch(e){} }
        if(estAdmin()) MEMBRE = MEMBRE_ADMIN;
        gate.classList.add("hidden");
        $("adm-body").classList.remove("hidden");
        admLoad();
      });
    } else {
      gate.classList.remove("hidden");
      $("adm-body").classList.add("hidden");
      champ.value = "";
    }
  });

  function ouvrir(){
    var code = (champ.value || "").replace(/[^0-9]/g, "");
    if(enCours) return;
    if(code.length < 6){ dire("Il faut les 6 chiffres.", "ko"); return; }

    enCours = true;
    bouton.disabled = true;
    dire("Ouverture\u2026");

    fetch(ADM_PASS_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code: code })
    })
    .then(function(r){ return r.json().then(function(j){ return { s:r.status, j:j }; }); })
    .then(function(res){
      if(res.j && res.j.ok && res.j.token){
        /* Le jeton autorise le guichet d'envoi pendant 8 h. On le garde pour
           la duree de l'onglet — jamais le code lui-meme, qui reste connu du
           seul serveur et des personnes qui le tapent. */
        poserJeton(res.j.jeton || "");
        ROLE = (res.j.role === "jure") ? "jure" : "admin";
        return auth.signInWithCustomToken(res.j.token).then(function(){ dire(""); });
      }
      champ.value = "";
      if(res.s === 429){
        var min = Math.ceil((res.j.attendre || 900) / 60);
        dire("Trop d'essais. R\u00e9essayez dans " + min + " min.", "wait");
      } else if(res.s === 401){
        var r2 = (res.j && typeof res.j.restants === "number") ? res.j.restants : null;
        dire("Code incorrect." + (r2 !== null ? " Encore " + r2 + " essai" + (r2 > 1 ? "s" : "") + "." : ""), "ko");
      } else {
        dire("Le serveur d'acc\u00e8s ne r\u00e9pond pas correctement.", "ko");
      }
    })
    .catch(function(){
      champ.value = "";
      dire("Pas de r\u00e9seau, ou serveur d'acc\u00e8s injoignable.", "ko");
    })
    .then(function(){ enCours = false; bouton.disabled = false; });
  }

  bouton.onclick = ouvrir;

  /* Sur iPhone le pave numerique n'a pas de touche Entree, et le premier
     appui sur un bouton sert souvent a fermer le clavier : le code part
     donc tout seul des que le 6e chiffre est saisi. */
  champ.oninput = function(){
    var v = (champ.value || "").replace(/[^0-9]/g, "");
    if(champ.value !== v) champ.value = v;
    if(v.length === 6) ouvrir();
  };
  champ.onkeydown = function(e){ if(e.key === "Enter") ouvrir(); };
  champ.focus();
}

/* ══════════════════════════════════════════════════════════════
   POTENTIEL — modèle de notation des candidatures
   ──────────────────────────────────────────────────────────────
   Principe : le potentiel n'est PAS le nombre de cases cochées.
   Chaque information vaut un nombre de points différent, et pour les
   expériences comme pour les savoir-faire on ne compte que les MEILLEURES
   (voir top_exp / top_sav) : cocher toute la liste ne rapporte donc rien
   de plus que cocher les trois bonnes.
   Le score n'élimine personne : il ORDONNE la pile. Le filtre reste humain.
   Tous les poids ci-dessous sont modifiables dans l'onglet « Potentiel ».
   ══════════════════════════════════════════════════════════════ */
var SCORING_DEF = {
  top_exp: 3,          /* nombre d'expériences retenues (les mieux notées) */
  top_sav: 4,          /* nombre de savoir-faire retenus */

  exp: {
    "Bar / service":6, "Serveur en salle":5, "Discothèque, club, soirée":5,
    "Accueil du public":5, "Animation / encadrement":5, "Jeux, escape game, bowling, karaoké":5,
    "Événementiel":4, "Snacking, fast-food, food-truck":4, "Barista, café, salon de thé":4,
    "Restauration / cuisine":3, "Caisse / encaissement":3, "Hôtellerie, réception":3,
    "Sport, loisirs, colonie de vacances":3, "Vente / commerce":2, "Scène, musique, spectacle":2,
    "Audiovisuel, son, lumière":2, "Bricolage, montage, chantier":2,
    "Ménage, entretien des locaux":1, "Sécurité, contrôle d’accès":1, "Aucune, mais très motivé":0
  },
  sav: {
    "Tirer une pression":4, "Faire un cocktail":4, "Expliquer une règle de jeu à un groupe":4,
    "Tenir une caisse":3, "Parler devant 30 personnes":3, "Réchauffer et dresser une assiette":3,
    "Réserver / gérer un planning":2, "Parler anglais":2, "Brancher une enceinte ou un micro":2,
    "Faire une photo ou une vidéo correcte":2, "Utiliser une visseuse":1, "Monter un meuble en kit":1
  },
  anc_metier: { "Jamais fait":0, "Moins d’1 an":2, "1 à 3 ans":5, "3 à 5 ans":7, "Plus de 5 ans":8 },
  anc:        { "Je débute":0, "Moins de 2 ans":1, "2 à 5 ans":2, "Plus de 5 ans":3 },
  permis:     { "Oui":10, "En cours":4, "Non":0 },
  transport:  { "Voiture":3, "Deux-roues":2, "Vélo / à pied":2, "Covoiturage à trouver":0 },

  /* quiz et mises en situation : un poids par réponse, dans l'ordre d'affichage */
  quiz: [[2,0,4,1],[0,3,3,4],[2,3,2,3],[0,2,4,3],[2,3,4,2],[2]],
  situ: [[2,4,1],[2,4,0],[1,3,4]],

  eng: {
    complete: 8,        /* candidature envoyée jusqu'au bout */
    pitch: 4,           /* par pitch enregistré */
    mot_media: 2,       /* dernier mot en audio ou vidéo */
    pourquoi: 3,        /* « pourquoi LUMIIA » vraiment rempli */
    portrait: 2,        /* « ce que les gens disent de vous » rempli */
    offre_mail: 1,      /* veut recevoir l'offre */
    jeu: 0              /* score des mini-jeux : volontairement à 0 */
  },
  jeu_ref: 400          /* score de jeu correspondant au maximum de points « jeu » */
};

function SC(){ return (CFG.scoring && CFG.scoring.top_exp) ? CFG.scoring : SCORING_DEF; }

/* Renvoie { total, axes, detail } — detail sert à expliquer la note ligne par ligne. */
function evalCandidat(c){
  var S2 = SC(), det = [], ax = { metier:0, terrain:0, posture:0, engagement:0, praticite:0 };
  function pt(axe, label, n){ if(!n) return; ax[axe] += n; det.push({ axe:axe, l:label, p:n }); }

  /* — métier — */
  var exps = (c.experiences||"").split("|").filter(Boolean)
    .map(function(x){ return { n:x, p:(S2.exp[x] || 0) }; })
    .sort(function(a,b){ return b.p - a.p; });
  exps.slice(0, S2.top_exp).forEach(function(e){ pt("metier", e.n, e.p); });
  if(exps.length > S2.top_exp) det.push({ axe:"metier", l:"(" + (exps.length - S2.top_exp) + " autre(s) expérience(s), non comptée(s))", p:0 });
  pt("metier", "Expérience dans le métier : " + (c.anciennete_metier||"—"), S2.anc_metier[c.anciennete_metier] || 0);
  pt("metier", "Ancienneté générale : " + (c.anciennete||"—"), S2.anc[c.anciennete] || 0);

  /* — terrain — */
  var savs = (c.savoirs||"").split("|").filter(Boolean)
    .map(function(x){ return { n:x, p:(S2.sav[x] || 0) }; })
    .sort(function(a,b){ return b.p - a.p; });
  savs.slice(0, S2.top_sav).forEach(function(e){ pt("terrain", e.n, e.p); });
  if(savs.length > S2.top_sav) det.push({ axe:"terrain", l:"(" + (savs.length - S2.top_sav) + " autre(s) savoir-faire, non compté(s))", p:0 });

  /* — posture — */
  (c.quiz || []).forEach(function(q, i){
    var g = (S2.quiz && S2.quiz[i]) || [];
    if(!q || !q.r) return;
    if(q.libre){ pt("posture", "Playlist renseignée", (q.r && q.r !== "Aucune idée") ? (g[0] || 0) : 0); return; }
    var qs = (CFG.quiz_nuit && CFG.quiz_nuit[i] && CFG.quiz_nuit[i].o) || [];
    var j = qs.indexOf(q.r);
    if(j > -1) pt("posture", "Q" + (i+1) + " — " + q.r, g[j] || 0);
  });
  var sit = (c.situations||"").split("|");
  sit.forEach(function(v, i){
    if(v === "" || v === undefined) return;
    var g = (S2.situ && S2.situ[i]) || [];
    var lib = (CFG.situations && CFG.situations[i] && CFG.situations[i].o && CFG.situations[i].o[Number(v)]) || "réponse";
    pt("posture", "Situation " + (i+1) + " — " + lib, g[Number(v)] || 0);
  });

  /* — engagement — */
  if(c.statut === "complet") pt("engagement", "Candidature terminée", S2.eng.complete);
  var np = 0;
  ["pitch1","pitch2","pitch3","pitch4"].forEach(function(k){ if(c[k + "_url"]) np++; });
  if(np) pt("engagement", np + " pitch" + (np>1?"s":"") + " enregistré" + (np>1?"s":""), np * S2.eng.pitch);
  if(c.motmedia_url) pt("engagement", "Dernier mot en audio ou vidéo", S2.eng.mot_media);
  if((c.pourquoi||"").trim().length >= 40) pt("engagement", "« Pourquoi LUMIIA » développé", S2.eng.pourquoi);
  if((c.portrait||"").trim().length >= 30) pt("engagement", "Portrait par les autres renseigné", S2.eng.portrait);
  if(c.offre_mail) pt("engagement", "Veut recevoir l’offre", S2.eng.offre_mail);
  if(S2.eng.jeu) pt("engagement", "Score du jeu", Math.round(Math.min(1, (c.score||0) / (S2.jeu_ref||400)) * S2.eng.jeu));

  /* — praticité — */
  pt("praticite", "Permis B : " + (c.permis||"—"), S2.permis[c.permis] || 0);
  pt("praticite", "Transport : " + (c.transport||"—"), S2.transport[c.transport] || 0);

  var brut = ax.metier + ax.terrain + ax.posture + ax.engagement + ax.praticite;
  return { total: Math.round(brut / maxPotentiel() * 100), brut:brut, axes:ax, detail:det };
}

/* Score maximum atteignable, pour ramener la note sur 100. */
var _maxCache = null, _maxSig = "";
function maxPotentiel(){
  var S2 = SC(), sig = JSON.stringify(S2).length + "|" + ((CFG.quiz_nuit||[]).length);
  if(_maxCache && _maxSig === sig) return _maxCache;
  function topN(o, n){
    return Object.keys(o||{}).map(function(k){ return o[k]; })
      .sort(function(a,b){ return b-a; }).slice(0, n)
      .reduce(function(a,b){ return a+b; }, 0);
  }
  function maxi(o){ var m = 0; for(var k in (o||{})) m = Math.max(m, o[k]); return m; }
  var m = topN(S2.exp, S2.top_exp) + topN(S2.sav, S2.top_sav)
    + maxi(S2.anc_metier) + maxi(S2.anc) + maxi(S2.permis) + maxi(S2.transport);
  (S2.quiz||[]).forEach(function(g){ m += Math.max.apply(null, g.concat([0])); });
  (S2.situ||[]).forEach(function(g){ m += Math.max.apply(null, g.concat([0])); });
  m += S2.eng.complete + S2.eng.pitch*4 + S2.eng.mot_media + S2.eng.pourquoi + S2.eng.portrait + S2.eng.offre_mail + S2.eng.jeu;
  _maxCache = Math.max(1, m); _maxSig = sig;
  return _maxCache;
}

/* Maximum théorique par axe, pour dessiner des barres comparables. */
function maxAxe(a){
  var S2 = SC();
  function topN(o, n){
    return Object.keys(o||{}).map(function(k){ return o[k]; })
      .sort(function(x,y){ return y-x; }).slice(0, n).reduce(function(x,y){ return x+y; }, 0);
  }
  function maxi(o){ var m = 0; for(var k in (o||{})) m = Math.max(m, o[k]); return m; }
  if(a === "metier")    return topN(S2.exp, S2.top_exp) + maxi(S2.anc_metier) + maxi(S2.anc);
  if(a === "terrain")   return topN(S2.sav, S2.top_sav);
  if(a === "praticite") return maxi(S2.permis) + maxi(S2.transport);
  if(a === "posture"){
    var m = 0;
    (S2.quiz||[]).forEach(function(g){ m += Math.max.apply(null, g.concat([0])); });
    (S2.situ||[]).forEach(function(g){ m += Math.max.apply(null, g.concat([0])); });
    return m;
  }
  var e = S2.eng;
  return e.complete + e.pitch*4 + e.mot_media + e.pourquoi + e.portrait + e.offre_mail + e.jeu;
}

function couleurPot(p){
  if(p >= 70) return "hot";
  if(p >= 45) return "wip";
  return "";
}

function admLoad(){
  document.body.classList.add("adm");
  loadCfg(function(){
    normaliserPrenomNom();
    admRender();
    db.ref(FB_PATH + "/candidats").on("value", function(s){
      LAST_CAND = s.val() || {};
      /* La fiche de test interne n'est pas une candidature : on la retire ici,
         une seule fois, plutot que dans chaque liste, chaque statistique et
         chaque export. */
      delete LAST_CAND[ADM_TEST_KEY];
      delete LAST_CAND[ADM_TEST_VIEUX];
      migrerEval();
      /* Les candidatures arrivent APRES le premier rendu. Cette liste ne citait
         que « candidats » et « suivi » : tout onglet ajoute ensuite restait fige
         sur l'etat vide du chargement. Invisible pour un admin, qui ouvre sur
         « candidats » — mais un JURE ouvre sur « Revue des reponses » et trouvait
         une page vide jusqu'a ce qu'il change d'onglet, sans rien pour le lui dire.

         AU PREMIER REMPLISSAGE SEULEMENT on redessine l'onglet actif, quel qu'il
         soit. Pas aux suivants : chaque etoile posee ecrit dans une fiche, donc
         rappelle cet ecouteur, et redessiner la Revue a ce moment-la arracherait
         le curseur du commentaire en cours de frappe. */
      if(!CAND_RECUS){ CAND_RECUS = true; admTab(); }
      else if(ADM_TAB === "candidats") admCandidats();
      else if(ADM_TAB === "suivi") tabSuivi();
    });
  });
}

/* ══════════════════════════════════════════════════════════════
   MESSAGES AUX CANDIDATS
   ──────────────────────────────────────────────────────────────
   Une bibliotheque de messages, ecrits ici, envoyes un par un depuis
   la fiche d'un candidat.

   L'app n'envoie au serveur QUE l'identifiant de la fiche et le nom du
   message. Ni l'adresse, ni le texte ne transitent par le navigateur :
   le serveur lit l'une dans la fiche, l'autre dans cette configuration.
   C'est ce qui rend le guichet inutilisable par un tiers — et il faut
   s'en souvenir, car la meme adresse expedie les billets de reservation.
   NE PAS ASSOUPLIR en passant destinataire ou contenu dans l'appel.

   Jamais d'envoi groupe : un message par personne, decide a chaque fois.
   Deux candidats ne doivent pas decouvrir l'adresse l'un de l'autre.
   ══════════════════════════════════════════════════════════════ */
var ADM_ENVOI_URL = "https://reservation.lumiia.fr/api/recrutement-envoi.php";

/* TEST INTERNE — v5.10.
   Le guichet d'envoi ne connait PAS de destinataire : il lit toujours l'adresse
   dans la fiche dont on lui donne l'identifiant. On ne l'assouplit pas pour
   autant. Le test passe donc par une FICHE DEDIEE, ecrite a la volee sous une
   cle fixe, et l'envoi emprunte exactement le meme chemin qu'un envoi reel :
   c'est ce qui en fait un test valable. Cette fiche est retiree de LAST_CAND au
   chargement (voir admLoad) : elle n'apparait donc dans aucune liste, aucun
   compte, aucun export. */
/* La cle a la FORME d'une cle Firebase — tiret initial, vingt signes — et ce
   n'est pas cosmetique : le guichet mail refuse tout identifiant qui n'y
   ressemble pas (« identifiant invalide »), et c'est lui qui sert les liens
   ?c= et ?x= recus par mail. Avec l'ancienne cle « _test_interne », le lien de
   test des extras tombait sur un refus muet du serveur.
   Ne pas la raccourcir ni retirer le tiret. */
var ADM_TEST_KEY    = "-TEST_interne_lumiia";
var ADM_TEST_VIEUX  = "_test_interne";   /* l'ancienne, a masquer aussi */
var ADM_TEST_PRENOM = "Emmanuel";
var ADM_TEST_NOM    = "Test";
var ADM_TEST_EMAIL  = "contact@lumiia.fr";

/* LE JETON D'ENVOI — v5.11.
   Il etait garde en sessionStorage, donc perdu des que l'onglet se fermait.
   Or la session Firebase, elle, persiste : on rouvrait l'admin sans qu'on nous
   redemande le code, donc sans jamais reobtenir de jeton, et tout envoi echouait
   sur « session expiree » avec pour seul remede une deconnexion qui n'existe
   nulle part dans l'app. Impasse complete.
   Le jeton est donc conserve avec SA PROPRE ECHEANCE, calee sur les 8 h du
   serveur : pas une seconde de plus que ce que le serveur accepte deja.
   Ce qui n'est TOUJOURS pas conserve, et ne doit jamais l'etre : le code a
   6 chiffres. Et le jeton ne donne rien de plus que ce que la session Firebase
   du meme navigateur donne deja — envoyer un message ecrit d'avance a une
   adresse deja inscrite dans une fiche. */
var JETON_CLE = "lumiia_jeton";
var JETON_DUREE = 8 * 3600 * 1000;

function poserJeton(j){
  if(!j) return;
  try { localStorage.setItem(JETON_CLE, JSON.stringify({ v:j, exp:Date.now() + JETON_DUREE })); } catch(e){}
  try { sessionStorage.setItem(JETON_CLE, j); } catch(e){}
}

function jetonEnvoi(){
  try {
    var b = localStorage.getItem(JETON_CLE);
    if(b){
      var o = JSON.parse(b);
      if(o && o.v && o.exp > Date.now()) return o.v;
      localStorage.removeItem(JETON_CLE);
    }
  } catch(e){}
  /* Repli sur l'ancien emplacement : un onglet ouvert avant cette version
     continue de fonctionner sans retaper quoi que ce soit. */
  try { return sessionStorage.getItem(JETON_CLE) || ""; } catch(e){ return ""; }
}

/* PRENOM + NOM — v5.12.
   Les trois messages de depart avaient ete ecrits en « Bonjour {prenom}, ».
   Laisser un bouton a cliquer pour corriger revenait a confier a l'utilisateur
   une migration de donnees : il ne l'a pas vu, et le premier vrai mail est parti
   sans le nom. La conversion se fait donc TOUTE SEULE au chargement de l'admin,
   une fois pour toutes, tracee par le drapeau config/nomcomplet_ok.
   Elle est bornee : elle ne touche QUE les {prenom} qui ne sont pas deja suivis
   de {nom}, et ne repassera jamais — si Emmanuel ecrit plus tard un message
   volontairement au seul prenom, il reste tel quel. */
function normaliserPrenomNom(){
  if(!db || !CFG || CFG.nomcomplet_ok) return;
  var m = CFG.messages || {}, o = {}, chg = 0, vide = true;
  for(var k in m){
    if(!m[k]) continue;
    vide = false;
    var av = String(m[k].corps || ""), ap = av.replace(RE_PRENOM_SEUL_G, "{prenom} {nom}");
    o[k] = m[k];
    if(ap !== av){ o[k].corps = ap; chg++; }
  }
  /* Tant qu'aucun message n'existe, on ne pose pas le drapeau : sinon les
     messages de depart crees plus tard echapperaient a la conversion. */
  if(vide) return;
  CFG.nomcomplet_ok = true;
  if(!chg){ db.ref(FB_PATH + "/config/nomcomplet_ok").set(true); return; }
  CFG.messages = o;
  cfgSave({ messages:o, nomcomplet_ok:true },
    chg + " message" + (chg > 1 ? "s" : "") + " au pr\u00e9nom + nom \u2713");
}

/* Les messages sont un objet indexe par cle ; on le rend trie pour l'affichage. */
function messagesTries(){
  var m = CFG.messages || {}, out = [];
  for(var k in m){ if(m[k] && m[k].titre) out.push({ k:k, m:m[k] }); }
  out.sort(function(a,b){ return (a.m.order||0) - (b.m.order||0) || String(a.m.titre).localeCompare(String(b.m.titre)); });
  return out;
}

/* Un {prenom} qui n'est PAS deja suivi de {nom}. Classe de caracteres et
   lookahead, aucun antislash inutile. */
var RE_PRENOM_SEUL   = /[{]prenom[}](?! [{]nom[}])/;
var RE_PRENOM_SEUL_G = /[{]prenom[}](?! [{]nom[}])/g;

function tabMessages(){
  var L = messagesTries();
  var h = '<div class="adm-sec"><h2>Messages aux candidats</h2>'
    + '<p class="aide">Les messages que vous pouvez envoyer depuis la fiche d\u2019un candidat. '
    + 'Le titre est ce que vous verrez dans la liste ; l\u2019objet et le texte sont ce que le candidat re\u00e7oit.<br>'
    + 'Dans le texte, <b>{prenom}</b>, <b>{nom}</b> et <b>{lien}</b> sont remplac\u00e9s \u00e0 l\u2019envoi '
    + '\u2014 et <b>{lien_extra}</b> ouvre le parcours court des extras, sur sa propre ligne '
    + 'il devient un bouton '
    + '\u2014 <b>{prenom} {nom}</b> ensemble donne la forme la plus formelle, celle utilis\u00e9e par d\u00e9faut '
    + '(<b>{lien}</b> = lien vers sa candidature, pour la reprendre ou la relire).<br>'
    + 'Un message doit \u00eatre enregistr\u00e9 ici pour pouvoir \u00eatre envoy\u00e9 : le serveur refuse d\u2019expédier '
    + 'un texte qu\u2019il ne conna\u00eet pas.</p>';

  if(!L.length){
    h += '<p class="aide">Aucun message pour le moment.</p>'
      + '<div class="adm-save"><button class="btn" id="msg-depart">AJOUTER 3 MESSAGES POUR COMMENCER</button></div>';
  }

  L.forEach(function(o, i){
    h += '<div class="qed" data-mk="' + esc(o.k) + '">'
      + '<label class="f">Titre — visible par vous seul</label>'
      + '<input type="text" class="m-titre" value="' + esc(o.m.titre || "") + '">'
      + '<label class="f" style="margin-top:10px">Objet du mail</label>'
      + '<input type="text" class="m-objet" value="' + esc(o.m.objet || "") + '">'
      + '<label class="f" style="margin-top:10px">Texte</label>'
      + '<textarea class="m-corps" rows="10">' + esc(o.m.corps || "") + '</textarea>'
      + '<div style="margin-top:10px"><button class="btn sec m-del" data-mk="' + esc(o.k) + '">Supprimer ce message</button></div>'
      + '</div>';
  });

  var nSeul = 0;
  L.forEach(function(o){ if(RE_PRENOM_SEUL.test(o.m.corps || "")) nSeul++; });

  h += '<div class="adm-save" style="gap:10px">'
    + (nSeul ? '<button class="btn sec" id="msg-nom">PR\u00c9NOM + NOM PARTOUT ('
        + nSeul + ')</button>' : '')
    + '<button class="btn sec" id="msg-new">NOUVEAU MESSAGE</button>'
    + '<button class="btn" id="msg-save">ENREGISTRER</button>'
    + '</div></div>';
  panneau(h);

  function recolter(){
    var o = {}, blocs = document.querySelectorAll("[data-mk]"), n = 0;
    for(var i=0;i<blocs.length;i++){
      var b = blocs[i];
      if(!b.querySelector(".m-titre")) continue;
      var t = (b.querySelector(".m-titre").value || "").trim();
      if(!t) continue;
      o[b.getAttribute("data-mk")] = {
        titre: t,
        objet: (b.querySelector(".m-objet").value || "").trim(),
        corps: b.querySelector(".m-corps").value || "",
        order: ++n
      };
    }
    return o;
  }
  function enregistrer(o, msg){
    CFG.messages = o;
    cfgSave({ messages:o }, msg || "Messages enregistrés ✓");
  }

  if($("msg-depart")) $("msg-depart").onclick = function(){
    var o = {};
    MSG_DEPART.forEach(function(m, i){
      o["m" + Date.now().toString(36) + i] = { titre:m.titre, objet:m.objet, corps:m.corps, order:i+1 };
    });
    enregistrer(o, "3 messages ajoutés ✓");
    setTimeout(tabMessages, 350);
  };
  $("msg-new").onclick = function(){
    var o = recolter();
    o["m" + Date.now().toString(36)] = { titre:"Nouveau message", objet:"", corps:"Bonjour {prenom} {nom},\n\n", order:999 };
    enregistrer(o, "Message ajouté ✓");
    setTimeout(tabMessages, 350);
  };
  $("msg-save").onclick = function(){ enregistrer(recolter()); };
  /* Bascule vers la forme formelle. Idempotente : la lookahead laisse tranquille
     un {prenom} deja suivi de {nom}, donc un second clic n'ajoute rien. */
  if($("msg-nom")) $("msg-nom").onclick = function(){
    var o = recolter();
    for(var k in o) o[k].corps = String(o[k].corps || "").replace(RE_PRENOM_SEUL_G, "{prenom} {nom}");
    enregistrer(o, "Pr\u00e9nom + nom appliqu\u00e9 \u2713");
    setTimeout(tabMessages, 350);
  };
  var dels = document.querySelectorAll(".m-del");
  for(var i=0;i<dels.length;i++) dels[i].onclick = function(){
    var k = this.getAttribute("data-mk");
    if(this.textContent.indexOf("Confirmer") === -1){
      this.textContent = "Confirmer la suppression";
      var b = this;
      setTimeout(function(){ b.textContent = "Supprimer ce message"; }, 5000);
      return;
    }
    var o = recolter(); delete o[k];
    enregistrer(o, "Message supprimé ✓");
    setTimeout(tabMessages, 350);
  };
}

/* ── bloc « envoyer un message », affiché dans la fiche ── */

  var h = '<div class="suivi">';

    return h + '<p class="aide">Aucun message n\u2019est encore écrit. Onglet <b>Messages</b> pour en créer.</p></div>';
  }
  h += '<label class="f">Message à envoyer</label>'
    + '<select id="env-cle" style="width:100%">';
  L.forEach(function(o){ h += '<option value="' + esc(o.k) + '">' + esc(o.m.titre) + '</option>'; });
  h += '</select>'
    + '<div class="dim" style="margin-top:8px">Destinataire : <b>' + esc(nomComplet(c)) + '</b>'
    + (c.email ? ' &nbsp;\u00b7&nbsp; <b>' + esc(c.email) + '</b>'
               : ' &nbsp;\u00b7&nbsp; <span style="color:#ff9c9c">aucune adresse sur cette fiche</span>')
    + '</div>'
    + '<div id="env-apercu" class="apercu"></div>'
    + '<div class="factions" style="margin-top:12px;border:none;padding-top:0;gap:10px">'
    + '<button class="btn" id="env-go"' + (c.email ? '' : ' disabled') + '>Envoyer</button>'
    + '<button class="btn sec" id="env-test">Envoyer un test interne</button>'
    + '</div>'
    + '<div class="dim" style="margin-top:8px">Le test part sur <b>' + esc(ADM_TEST_EMAIL) + '</b>, '
    + 'au nom de <b>' + esc(ADM_TEST_PRENOM + " " + ADM_TEST_NOM) + '</b>, par le m\u00eame chemin qu\u2019un envoi r\u00e9el. '
    + 'Le candidat ne re\u00e7oit rien et sa fiche n\u2019est pas touch\u00e9e.</div>'
    + '<div id="env-msg" class="svmsg hidden"></div>'
    + '<div id="env-code" class="hidden" style="margin-top:12px">'
    +   '<label class="f">Votre code \u00e0 6 chiffres</label>'
    +   '<div style="display:flex;gap:10px;align-items:center">'
    +     '<input id="env-code-in" type="tel" inputmode="numeric" maxlength="6" '
    +       'style="flex:1;padding:11px 12px;border-radius:8px;background:#211845;border:1px solid #4a3a72;'
    +       'color:#e6edf3;font-family:ui-monospace,Menlo,monospace;font-size:1.15rem;letter-spacing:.32em;text-align:center">'
    +     '<button class="btn sec" id="env-code-go">Valider</button>'
    +   '</div>'
    +   '<div class="dim" style="margin-top:6px">Le m\u00eame code que pour ouvrir l\u2019admin. '
    +   'Vous restez connect\u00e9, il n\u2019est pas conserv\u00e9.</div>'
    + '</div>'
    + '<div id="env-hist">' + envoisHtml(c) + '</div>';

function envoisHtml(c){
  var e = c.envois || {}, lignes = [];
  for(var k in e){
    if(!e[k]) continue;
    var m = (CFG.messages || {})[k];
    lignes.push({ t: (m && m.titre) ? m.titre : k, ts: e[k] });
  }
  if(!lignes.length) return "";
  lignes.sort(function(a,b){ return b.ts - a.ts; });
  var h = '<div class="pgrp" style="margin-top:18px">Déjà envoyé</div>';
  lignes.forEach(function(l){
    var d = new Date(l.ts || 0);
    h += '<div class="kv"><span class="kk">' + esc(l.t) + '</span><span class="kvv">'
      + d.toLocaleDateString("fr-FR") + " à " + d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})
      + '</span></div>';
  });
  return h;
}

function brancherEnvoi(c, racine){
  var bt = racine.querySelector("#env-go");
  if(!bt) return;
  var zone = racine.querySelector("#env-msg");
  var sel  = racine.querySelector("#env-cle");

  /* Quand le jeton manque ou a expire, on ne renvoie plus l'utilisateur vers une
     deconnexion qui n'existe pas : on redemande le code ICI, et on reprend
     l'action interrompue une fois le jeton obtenu. */
  var zoneCode = racine.querySelector("#env-code");
  var champC   = racine.querySelector("#env-code-in");
  var btC      = racine.querySelector("#env-code-go");
  var suiteCode = null;

  function demanderCode(suite){
    suiteCode = suite || null;
    if(!zoneCode){ message("Session d\u2019envoi expirée. Rechargez la page.", "ko"); return; }
    zoneCode.classList.remove("hidden");
    message("Session d\u2019envoi expirée. Retapez votre code ci-dessous, vous restez connecté.", "ko");
    try { champC.focus(); } catch(e){}
  }

  function validerCode(){
    var code = (champC.value || "").replace(/[^0-9]/g, "");
    if(code.length < 6){ message("Il faut les 6 chiffres.", "ko"); return; }
    btC.disabled = true;
    message("Vérification\u2026", "ok");
    fetch(ADM_PASS_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code: code })
    })
    .then(function(r){ return r.json().then(function(j){ return { s:r.status, j:j }; }); })
    .then(function(res){
      btC.disabled = false; champC.value = "";
      if(res.j && res.j.ok && res.j.jeton){
        poserJeton(res.j.jeton);
        zoneCode.classList.add("hidden");
        message("Session rouverte \u2713", "ok", true);
        var f = suiteCode; suiteCode = null;
        if(f) setTimeout(f, 60);
        return;
      }
      if(res.s === 429) message("Trop d\u2019essais. Réessayez dans "
        + Math.ceil(((res.j && res.j.attendre) || 900) / 60) + " min.", "ko");
      else if(res.s === 401) message("Code incorrect.", "ko");
      else message("Le serveur d\u2019accès ne répond pas correctement.", "ko");
    })
    .catch(function(){ btC.disabled = false; message("Serveur d\u2019accès injoignable.", "ko"); });
  }

  /* L'apercu est refait a chaque changement de message. Les variables sont
     remplacees ici COMME LE SERVEUR LE FERA, a une exception assumee : {lien}
     est fabrique par le serveur, on ne l'invente pas, on le signale. */
  var zoneAp = racine.querySelector("#env-apercu");

  function remplacer(t){
    var pr = String(c.prenom || "").trim(), no = String(c.nom || "").trim();
    var s = esc(String(t || ""));
    s = s.split("{prenom}").join(pr ? esc(pr) : '<span class="vide">pr\u00e9nom absent de la fiche</span>');
    s = s.split("{nom}").join(no ? esc(no) : '<span class="vide">nom absent de la fiche</span>');
    /* Le serveur ne pose plus une URL nue mais un BOUTON (envoi.php v1.2).
       L'apercu montrait « lien vers sa candidature » — une formule ecrite du point
       de vue du recruteur, dans un texte cense montrer ce que LE CANDIDAT recoit.
       On montre desormais le bouton tel qu'il partira. */
    /* {lien_extra} AVANT {lien} : la seconde chaine est contenue dans la
       premiere, l'ordre inverse laisserait un « _extra } » orphelin. Meme
       piege que cote serveur. */
    s = s.split("{lien_extra}").join('<span class="lienbtn cyan">LES EXTRAS, \u00c7A M\u2019INT\u00c9RESSE</span>');
    s = s.split("{lien}").join('<span class="lienbtn">REPRENDRE MA CANDIDATURE</span>');
    return s;
  }

  function rendreApercu(){
    if(!zoneAp) return;
    var m = (CFG.messages || {})[sel.value];
    if(!m){ zoneAp.innerHTML = ""; return; }
    zoneAp.innerHTML = '<div class="ap-objet">Objet : ' + remplacer(m.objet) + '</div>'
      + '<div class="ap-corps">' + remplacer(m.corps).replace(/\n/g, "<br>") + '</div>'
      + '<div class="ap-note">Le texte exact que recevra ' + esc(nomComplet(c))
      + '. Le bouton est fabriqu\u00e9 par le serveur au moment de l\u2019envoi, avec l\u2019adresse '
      + 'personnelle du destinataire.</div>';
  }

  sel.onchange = rendreApercu;
  rendreApercu();

  if(btC) btC.onclick = validerCode;
  if(champC){
    champC.oninput = function(){
      var v = (champC.value || "").replace(/[^0-9]/g, "");
      if(champC.value !== v) champC.value = v;
      if(v.length === 6) validerCode();
    };
    champC.onkeydown = function(e){ if(e.key === "Enter") validerCode(); };
  }

  function message(txt, genre, effacer){
    zone.className = "svmsg " + genre;
    zone.textContent = txt;
    if(effacer) setTimeout(function(){ if(zone.textContent === txt) zone.className = "svmsg hidden"; }, 3000);
  }

  function envoyer(forcer){
    var cle = sel.value;
    var jt  = jetonEnvoi();
    if(!jt){ demanderCode(function(){ envoyer(forcer); }); return; }
    bt.disabled = true;
    message("Envoi en cours\u2026", "ok");
    fetch(ADM_ENVOI_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ jeton: jt, id: c._k, cle: cle, forcer: forcer ? 1 : 0 })
    })
    .then(function(r){ return r.json().then(function(j){ return { s:r.status, j:j }; }); })
    .then(function(res){
      bt.disabled = false;
      if(res.j && res.j.ok){
        c.envois = c.envois || {};
        c.envois[cle] = res.j.date || Date.now();
        var box = racine.querySelector("#env-hist");
        if(box) box.innerHTML = envoisHtml(c);
        message("Message envoyé ✓", "ok", true);
        toast("Message envoyé ✓");
        return;
      }
      var e = res.j && res.j.err;
      if(e === "deja"){
        var d = new Date(res.j.date || 0);
        message("Ce message a déjà été envoyé le " + d.toLocaleDateString("fr-FR")
          + ". Cliquez à nouveau sur Envoyer pour l\u2019envoyer quand même.", "ko");
        bt.onclick = function(){ bt.onclick = function(){ envoyer(false); }; envoyer(true); };
      }
      else if(e === "message") message("Ce message n\u2019est pas enregistré : ouvrez l\u2019onglet Messages et cliquez ENREGISTRER.", "ko");
      else if(e === "auth")    demanderCode(function(){ envoyer(forcer); });
      else if(e === "email")   message("Cette candidature ne porte pas d\u2019adresse email exploitable.", "ko");
      else if(e === "rafale")  message("Trop rapide : attendez quelques secondes.", "ko");
      else if(e === "smtp")    message("Le serveur de mail a refusé : " + (res.j.detail || ""), "ko");
      else                     message("Échec de l\u2019envoi (" + (e || res.s) + ").", "ko");
    })
    .catch(function(){
      bt.disabled = false;
      message("Pas de réseau, ou guichet d\u2019envoi injoignable.", "ko");
    });
  }

  bt.onclick = function(){ envoyer(false); };

  /* ── ENVOI DE TEST ──────────────────────────────────────────────
     Chemin volontairement identique a l'envoi reel : meme guichet, meme
     jeton, meme substitution des variables cote serveur. Seule change la
     fiche visee, ecrite juste avant sous une cle fixe. Un test qui
     emprunterait une branche speciale du serveur ne prouverait rien.
     forcer:1 parce que la trace d'envoi s'accumule sur cette fiche et
     ferait refuser le deuxieme test du meme message. */
  var btT = racine.querySelector("#env-test");
  if(!btT) return;
  var btInit = bt.disabled;

  function lancerTest(){
    var cle = sel.value;
    var jt  = jetonEnvoi();
    if(!jt){ demanderCode(lancerTest); return; }
    if(!db){ message("Base indisponible : impossible d\u2019écrire la fiche de test.", "ko"); return; }
    btT.disabled = true; bt.disabled = true;
    message("Test en cours\u2026", "ok");
    db.ref(FB_PATH + "/candidats/" + ADM_TEST_KEY).update({
      prenom: ADM_TEST_PRENOM,
      nom:    ADM_TEST_NOM,
      email:  ADM_TEST_EMAIL,
      test:   true,
      maj:    Date.now()
    })
    .then(function(){
      return fetch(ADM_ENVOI_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ jeton: jt, id: ADM_TEST_KEY, cle: cle, forcer: 1 })
      });
    })
    .then(function(r){ return r.json().then(function(j){ return { s:r.status, j:j }; }); })
    .then(function(res){
      btT.disabled = false; bt.disabled = btInit;
      if(res.j && res.j.ok){
        var d = new Date(res.j.date || Date.now());
        message("Test envoyé à " + ADM_TEST_EMAIL + ", au nom de "
          + ADM_TEST_PRENOM + " " + ADM_TEST_NOM + ", à "
          + d.toLocaleTimeString("fr-FR", { hour:"2-digit", minute:"2-digit" })
          + ". Cette candidature n\u2019a rien reçu.", "ok");
        toast("Test envoyé ✓");
        return;
      }
      var e = res.j && res.j.err;
      if(e === "message")     message("Ce message n\u2019est pas enregistré : ouvrez l\u2019onglet Messages et cliquez ENREGISTRER.", "ko");
      else if(e === "auth")   demanderCode(lancerTest);
      else if(e === "email")  message("Le guichet n\u2019a pas trouvé d\u2019adresse sur la fiche de test.", "ko");
      else if(e === "rafale") message("Trop rapide : attendez 20 secondes avant de retester le même message.", "ko");
      else if(e === "smtp")   message("Le serveur de mail a refusé : " + (res.j.detail || ""), "ko");
      else                    message("Échec du test (" + (e || res.s) + ").", "ko");
    })
    .catch(function(err){
      btT.disabled = false; bt.disabled = btInit;
      message("Test impossible : " + ((err && err.message) ? err.message : "guichet injoignable"), "ko");
    });
  }

  btT.onclick = lancerTest;
}

  { k:"quiz",       n:"Quiz" },
  { k:"situations", n:"Mises en situation" },
  { k:"pitchs",     n:"Pitchs" },
  { k:"offre",      n:"Offre & postes" },
  { k:"listes",     n:"Listes déroulantes" },
  { k:"reglages",   n:"Réglages" }
];
var LAST_CAND = {}, ADM_FILTRE = "tous", ADM_TRI = "potentiel", ADM_Q = "";
/* Archives repliees par defaut : voir admCandidats. */
var ADM_ARCH = false;
/* Faux jusqu'a la premiere arrivee des candidatures. Voir admLoad. */
var CAND_RECUS = false;
function nb(x){ return String(x||"").split("|").filter(Boolean).length; }
/* Avant la v3.3 le champ nom contenait le nom complet : la concaténation reste juste. */
/* CE QU'ON LUI A ENVOYE — v7.1.
   La trace des envois existait deja, mais seulement au fond de la fiche, dans
   le bloc d'envoi. Or la question « est-ce que je lui ai repondu ? » se pose en
   parcourant la liste, pas en ouvrant vingt-six fiches. Le serveur ecrit
   candidats/<id>/envois/<cle> = horodatage apres chaque envoi reussi : on lit
   cette trace-la, pas une autre. */
function envoisDe(c){
  var e = (c && c.envois) || {}, L = [];
  for(var k in e){
    if(!e[k]) continue;
    var m = (CFG.messages || {})[k];
    L.push({ cle:k, titre:(m && m.titre) ? m.titre : k, ts:e[k] });
  }
  L.sort(function(a,b){ return b.ts - a.ts; });
  return L;
}

function envoisCell(c){
  var L = envoisDe(c);
  if(!L.length) return '<span class="dim">\u2014</span>';
  var h = '', d;
  L.slice(0, 2).forEach(function(o){
    d = new Date(o.ts);
    h += '<span class="pill2 msg" title="Envoy\u00e9 le ' + d.toLocaleDateString("fr-FR")
      + ' \u00e0 ' + d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}) + '">\u2709 '
      + esc(o.titre) + '</span> ';
  });
  if(L.length > 2) h += '<span class="dim">+' + (L.length - 2) + '</span>';
  d = new Date(L[0].ts);
  return h + '<br><span class="dim mono">' + d.toLocaleDateString("fr-FR") + '</span>';
}

function nomComplet(c){ return (((c.prenom||"") + " " + (c.nom||"")).trim()) || "—"; }

function cfgSave(patch, msg){
  if(!db){ toast("Base indisponible"); return; }
  patch.updatedAt = new Date().toISOString();
  db.ref(FB_PATH + "/config").update(patch)
    .then(function(){ toast(msg || "Enregistré ✓"); })
    .catch(function(e){ toast("Erreur : " + e.message); });
}

/* Un jure ne voit que ce qu'il peut reellement faire. Les autres onglets ne sont
   pas seulement inutiles pour lui : la base refuserait leurs enregistrements, et
   un bouton qui echoue vaut moins qu'un bouton absent.
   v6.6 : « Candidats » leur est rendu. Juger quelqu'un sur ses reponses sans
   pouvoir ouvrir son dossier quand on veut, c'est juger a l'aveugle — et la
   Revue n'offrait qu'un chemin detourne vers les fiches. Ils y lisent tout et
   n'y changent rien : la fiche leur retire deja le suivi, l'envoi et la
   suppression. */
function tabsVisibles(){
  if(estAdmin()) return ADM_TABS;
  return ADM_TABS.filter(function(o){
    return o.k === "candidats" || o.k === "revue" || o.k === "avis";

}

function admRender(){
  var vis = tabsVisibles();
  var dedans = false;
  vis.forEach(function(o){ if(o.k === ADM_TAB) dedans = true; });
  if(!dedans) ADM_TAB = vis[0].k;

  /* Un jure qui n'a pas dit qui il est ne peut rien signer : on lui demande
     avant tout le reste, pas au moment ou il clique une etoile. */
  if(!estAdmin() && !MEMBRE){ ecranQuiEtesVous(); return; }

  var t = '<div class="adm-tabs">';
  vis.forEach(function(o){
    t += '<button class="adm-tab' + (ADM_TAB === o.k ? " on" : "") + '" data-tab="' + o.k + '">' + esc(o.n) + '</button>';
  });
  t += '</div>'
    + (estAdmin() ? "" :
        '<div class="jurybar">Mode jury \u2014 vous notez sous le nom de <b>'
        + esc(membreNom(MEMBRE)) + '</b>.</div>')
    + '<div id="adm-tab"></div>';
  $("adm-body").innerHTML = t;
  var bs = document.querySelectorAll(".adm-tab");
  for(var i=0;i<bs.length;i++) bs[i].onclick = function(){ ADM_TAB = this.getAttribute("data-tab"); admRender(); };
  admTab();
}

function admTab(){
  var f = { candidats:tabCandidats, revue:tabRevue, avis:tabAvis, extras:tabExtras, suivi:tabSuivi, stats:tabStats, potentiel:tabPotentiel,
            messages:tabMessages,

            pitchs:tabPitchs, offre:tabOffre, listes:tabListes, reglages:tabReglages }[ADM_TAB];

function panneau(h){ $("adm-tab").innerHTML = h; }
function boutonSauver(id, libelle){

}

function ecranQuiEtesVous(){

/* ══════════════════════════════════════
   ONGLET REVUE — une question, tous les candidats
   ──────────────────────────────────────
   Le tableau comparatif range les gens ; celui-ci range les REPONSES. Lire dix
   fois la meme question a la suite, c'est la seule facon de voir laquelle sort
   du lot — en fiche par fiche, on compare de memoire, donc mal.
   Chaque reponse recoit une note sur cinq et un commentaire, ranges dans la
   fiche du candidat sous la cle « eval ».
   ══════════════════════════════════════ */
var REV_I = 0, REV_REFUSES = false;
/* « Écarté » et « Sans suite » sont les deux fins de non-recevoir. On ne les
   supprime pas — on les sort du champ de vision, et un bouton les rappelle. */
function revRefuse(c){
  var k = c.suivi_statut || "nouveau";
  return k === "ecarte" || k === "sans_suite";
}

function revQuestions(){
  var L = [];
  (CFG.quiz_nuit || []).forEach(function(q, i){
    L.push({ cle:"q" + i, groupe:"Quiz " + (i+1), t:q.q, lire:function(c){
      var r = (c.quiz || [])[i];
      return (r && r.r) ? String(r.r) : "";
    }});
  });
  (CFG.situations || []).forEach(function(s2, i){
    L.push({ cle:"s" + i, groupe:"Mise en situation " + (i+1), t:s2.q, lire:function(c){
      var v = (c.situations || "").split("|")[i];
      if(v === undefined || v === "") return "";
      return (s2.o && s2.o[Number(v)]) || "";
    }});
  });
  L.push({ cle:"pourquoi", groupe:"Texte libre", t:"Pourquoi LUMIIA ?",                         lire:function(c){ return c.pourquoi || ""; }});
  L.push({ cle:"portrait", groupe:"Texte libre", t:"Ce que les gens disent de lui ou d’elle",   lire:function(c){ return c.portrait || ""; }});
  L.push({ cle:"mot",      groupe:"Texte libre", t:"Un dernier mot",                            lire:function(c){ return c.mot || ""; }});
  ["pitch1","pitch2","pitch3","pitch4"].forEach(function(k, i){
    if(i >= (CFG.pitchs || []).length) return;   /* autant d'ecrans que de questions reglees */
    L.push({ cle:k, groupe:"Pitch " + (i+1), t:(CFG.pitchs || [])[i], media:k });
  });
  L.push({ cle:"motmedia", groupe:"Dernier mot", t:"Un dernier mot — enregistrement", media:"motmedia" });
  return L;
}

function etoilesHtml(k, n){
  var h = '<div class="etoiles" data-c="' + esc(k) + '" title="Cliquer la même étoile efface la note">';
  for(var i=1;i<=5;i++) h += '<span class="et' + (i <= (n||0) ? " on" : "") + '" data-n="' + i + '">★</span>';
  return h + '</div>';
}

/* IMPRESSION GENERALE — v6.4.
   La revue note les REPONSES, une par une. C'est precieux et c'est myope : on
   peut trouver chaque reponse correcte et ne pas avoir envie de travailler avec
   la personne, ou l'inverse. L'impression generale est le jugement sur
   QUELQU'UN, pose une fois, apres avoir lu tout le dossier.
   Rangee a part des notes de reponses : /candidats/<id>/impression/<membre>. */
function impressionTous(c){ return c.impression || {}; }
function impressionDe(c, id){ return impressionTous(c)[id] || {}; }

/* Moyenne des impressions, une personne = une voix (il n'y en a qu'une chacun,
   la question de la ponderation ne se pose donc pas ici). */
function impressionMoy(c){
  var e = impressionTous(c), t = 0, n = 0, vals = [];
  for(var id in e){ if(e[id] && e[id].n){ t += e[id].n; n++; vals.push(e[id].n); } }
  return n ? { moy: Math.round(t / n * 10) / 10, n: n, vals: vals } : null;
}

function impressionSave(idCand, patch){
  var c = LAST_CAND[idCand]; if(!c) return;
  if(!MEMBRE){ toast("Choisissez d\u2019abord votre nom"); return; }
  c.impression = c.impression || {};
  var cur = c.impression[MEMBRE] || {};
  if(patch.n   !== undefined) cur.n = patch.n;
  if(patch.txt !== undefined) cur.txt = patch.txt;
  cur.ts = Date.now();
  c.impression[MEMBRE] = cur;
  var p = {}; p["impression/" + MEMBRE] = cur;
  majCandidat(idCand, p).catch(function(e){ toast("Impression non enregistr\u00e9e : " + e.message); });
}

/* Le bloc de saisie, identique dans la fiche et dans le tableau de bord :
   une seule facon de le dessiner, une seule facon de le brancher. */
function blocImpression(c){
  var m = impressionDe(c, MEMBRE);
  return '<div class="impbloc">'
    + '<div class="impt">Votre impression g\u00e9n\u00e9rale sur ' + esc(nomComplet(c)) + '</div>'
    + '<div class="impl">' + etoilesHtml("imp:" + c._k, m.n)
    +   '<textarea class="imptxt" rows="2" data-c="' + esc(c._k) + '" '
    +     'placeholder="Ce que vous en pensez, en deux lignes\u2026">' + esc(m.txt || "") + '</textarea>'
    + '</div></div>';
}

/* Les etoiles portent la cle « imp:<fiche> » : c'est ce prefixe qui distingue
   une impression d'une note de reponse dans le meme gestionnaire de clic. */
function brancherImpression(racine){
  var ets = racine.querySelectorAll('.impbloc .etoiles .et');
  for(var i=0;i<ets.length;i++) ets[i].onclick = function(){
    var box = this.parentNode, cle = box.getAttribute("data-c"), n = +this.getAttribute("data-n");
    if(cle.indexOf("imp:") !== 0) return;
    if(n === box.querySelectorAll(".et.on").length) n = 0;   /* re-cliquer efface */
    var es = box.querySelectorAll(".et");
    for(var j=0;j<es.length;j++){ if(j < n) es[j].classList.add("on"); else es[j].classList.remove("on"); }
    impressionSave(cle.slice(4), { n:n });
  };
  var tas = racine.querySelectorAll(".imptxt");
  for(var t=0;t<tas.length;t++) (function(ta){
    var tmr = null;
    ta.oninput = function(){
      clearTimeout(tmr);
      tmr = setTimeout(function(){ impressionSave(ta.getAttribute("data-c"), { txt: ta.value }); }, 700);
    };
    ta.onblur = function(){ clearTimeout(tmr); impressionSave(ta.getAttribute("data-c"), { txt: ta.value }); };
  })(tas[t]);
}

/* Les avis d'un candidat sur une question : { <membre> : {n, txt, ts} }. */
function evalTous(c, cle){ return (c.eval || {})[cle] || {}; }
function evalDe(c, cle, id){ return evalTous(c, cle)[id] || {}; }

/* Moyenne d'une reponse, toutes voix confondues. */
function evalMoy(c, cle){
  var e = evalTous(c, cle), t = 0, n = 0;
  for(var id in e){ if(e[id] && e[id].n){ t += e[id].n; n++; } }
  return n ? { moy: Math.round(t / n * 10) / 10, n: n } : null;
}

function revSave(idCand, cle, patch){
  var c = LAST_CAND[idCand]; if(!c) return;
  if(!MEMBRE){ toast("Choisissez d\u2019abord votre nom"); return; }
  c.eval = c.eval || {};
  c.eval[cle] = c.eval[cle] || {};
  var cur = c.eval[cle][MEMBRE] || {};
  if(patch.n   !== undefined) cur.n = patch.n;
  if(patch.txt !== undefined) cur.txt = patch.txt;
  cur.ts = Date.now();
  c.eval[cle][MEMBRE] = cur;
  var p = {}; p["eval/" + cle + "/" + MEMBRE] = cur;
  majCandidat(idCand, p).catch(function(e){ toast("Note non enregistree : " + e.message); });
  var e = $("rev-etat");
  if(e){ e.textContent = "Enregistré ✓"; setTimeout(function(){ if(e) e.textContent = ""; }, 1500); }
}

/* Moyenne des notes de revue d'un candidat.
   UNE VOIX = UNE VOIX. On fait d'abord la moyenne de CHAQUE personne, puis la
   moyenne de ces moyennes. La moyenne brute de toutes les etoiles donnerait le
   dernier mot a celui qui a note le plus de reponses : quelqu'un qui note les
   douze questions peserait six fois plus que quelqu'un qui en note deux, sans
   que rien ne le dise. Ce n'est pas ce qu'on veut d'un avis d'equipe.
   n = le nombre de notes posees, il sert a dire sur quoi la moyenne repose. */
function revMoyenne(c){
  var par = {}, n = 0;
  for(var k in (c.eval || {})){
    var e = c.eval[k];
    for(var id in e){
      if(!e[id] || !e[id].n) continue;
      if(!par[id]) par[id] = { s:0, c:0 };
      par[id].s += e[id].n; par[id].c++; n++;
    }
  }
  var t = 0, v = 0;
  for(var id2 in par){ t += par[id2].s / par[id2].c; v++; }
  return v ? { moy: Math.round(t / v * 10) / 10, n: n, voix: v } : null;
}

/* MIGRATION v6.0 — les notes d'avant etaient anonymes : eval/<question> = {n,txt}.
   Elles deviennent eval/<question>/<membre> = {n,txt,ts}. Les anciennes sont
   toutes d'Emmanuel : elles lui sont attribuees, aucune n'est perdue.
   Reconnaissable sans ambiguite : l'ancienne forme porte n ou txt directement,
   la nouvelle ne contient que des sous-objets. Une seule fois, drapeau eval_v2. */
function migrerEval(){
  if(!estAdmin() || !db || CFG.eval_v2) return;
  var maj = {}, n = 0, vus = 0;
  for(var k in LAST_CAND){
    var e = LAST_CAND[k].eval; if(!e) continue;
    for(var q in e){
      var v = e[q]; if(!v) continue;
      vus++;
      if(typeof v.n === "number" || typeof v.txt === "string"){
        var nv = {};
        nv[MEMBRE_ADMIN] = { n: v.n || 0, txt: v.txt || "", ts: v.ts || Date.now() };
        maj[k + "/eval/" + q] = nv;
        LAST_CAND[k].eval[q] = nv;
        n++;
      }
    }
  }
  CFG.eval_v2 = true;
  if(!n){ db.ref(FB_PATH + "/config/eval_v2").set(true); return; }
  db.ref(FB_PATH + "/candidats").update(maj).then(function(){
    db.ref(FB_PATH + "/config/eval_v2").set(true);
    toast(n + " note" + (n > 1 ? "s" : "") + " report\u00e9e" + (n > 1 ? "s" : "") + " \u00e0 votre nom \u2713");
  }).catch(function(){ CFG.eval_v2 = false; });
}

function tabRevue(){
  var Q = revQuestions();
  if(!Q.length){ panneau('<div class="adm-sec"><p class="aide">Aucune question configurée.</p></div>'); return; }
  REV_I = Math.max(0, Math.min(Q.length - 1, REV_I));
  var q = Q[REV_I];

  var arr = [];
  for(var k in LAST_CAND){ var o = LAST_CAND[k]; o._k = k; arr.push(o); }
  arr.forEach(function(c){ c._ev = evalCandidat(c); });
  arr.sort(function(a, b){ return b._ev.total - a._ev.total; });

  var lignes = "", ecartees = "", nRep = 0, nEcart = 0, somme = 0, notees = 0, muets = [];
  arr.forEach(function(c){
    var rep = q.media ? (c[q.media + "_url"] || "") : q.lire(c);
    if(!rep){ muets.push(nomComplet(c)); return; }
    var refuse = revRefuse(c);
    if(refuse) nEcart++; else nRep++;
    var ev = evalDe(c, q.cle, MEMBRE);
    var moyR = evalMoy(c, q.cle);
    if(moyR && !refuse){ somme += moyR.moy; notees++; }
    var corps;
    if(q.media){
      corps = (c[q.media + "_type"] === "video")
        ? '<video src="' + esc(rep) + '" controls playsinline preload="none"></video>'
        : '<audio src="' + esc(rep) + '" controls preload="none"></audio>';
    } else {
      corps = '<div class="revrep">' + nl2br(rep) + '</div>';
    }
    var sv = suiviDe(c.suivi_statut);
    var autres = '';
    if(voitLesAutres()){
      var e2 = evalTous(c, q.cle), bouts = [];
      equipeTriee().forEach(function(m){
        if(m.id === MEMBRE) return;
        var a = e2[m.id]; if(!a || (!a.n && !a.txt)) return;
        bouts.push('<div class="avl"><b>' + esc(m.nom) + '</b> '
          + (a.n ? '<span class="avn">' + a.n + '/5</span>' : '<span class="dim">sans note</span>')
          + (a.txt ? '<div class="avt">' + esc(a.txt) + '</div>' : '') + '</div>');
      });
      if(bouts.length) autres = '<div class="avautres">' + bouts.join("") + '</div>';
    } else {
      var nA = 0, e3 = evalTous(c, q.cle);
      for(var idA in e3){ if(idA !== MEMBRE && e3[idA] && (e3[idA].n || e3[idA].txt)) nA++; }
      if(nA) autres = '<div class="avattente">' + nA + ' autre avis'
        + (nA > 1 ? ' d\u00e9pos\u00e9s' : ' d\u00e9pos\u00e9') + ', visible' + (nA > 1 ? 's' : '')
        + ' quand Emmanuel ouvrira les avis</div>';
    }
    var ligne = '<div class="revl' + (refuse ? ' off' : '') + '">'
      + '<div class="revqui">'
      +   (c.photo ? '<img class="vign" src="' + c.photo + '" data-nom="' + esc(nomComplet(c)) + '" alt="">' : '<span class="vign vide">—</span>')
      +   '<div><b>' + esc(nomComplet(c)) + '</b>'
      +   '<div style="margin-top:3px"><span class="pot ' + couleurPot(c._ev.total) + '">' + c._ev.total + '</span>'
      +   ' <span class="pill2 ' + sv.c + '">' + esc(sv.n) + '</span></div>'
      +   '<div style="margin-top:3px"><a class="lien" href="#" data-fiche="' + esc(c._k) + '">voir la fiche</a></div></div>'
      + '</div>'
      + '<div class="revcorps">' + corps + '</div>'
      + '<div class="revnote">' + etoilesHtml(c._k, ev.n)
      +   '<textarea class="revtxt" rows="2" data-c="' + esc(c._k) + '" placeholder="Votre commentaire…">' + esc(ev.txt || "") + '</textarea>'
      +   autres
      + '</div></div>';
    if(refuse) ecartees += ligne; else lignes += ligne;
  });
  if(!nRep) lignes = '<p class="aide">' + (nEcart ? 'Seuls des candidats écartés ont répondu à celle-ci.' : 'Personne n’a encore répondu à celle-ci.') + '</p>';

  var h = '<div class="adm-sec"><h2>Revue des réponses</h2>'
    + '<p class="aide">Une question à la fois, tous les candidats en face. Notez chaque réponse sur cinq '
    + 'et laissez un commentaire — tout est enregistré aussitôt sous votre nom. '
    + (voitLesAutres() ? 'Les avis des autres sont affichés sous le vôtre. '
        : 'Les avis des autres restent masqués tant qu’Emmanuel n’a pas ouvert la mise en commun. ')
    + 'Les <b>flèches gauche et droite</b> du clavier changent de question. '
    + 'Les candidats <b>écartés</b> ou <b>sans suite</b> sont retirés de la liste ; un bouton en bas les rappelle.</p>'
    + '<div class="revbar">'
    +   '<button class="btn sec mini" id="rev-prev">← Précédente</button>'
    +   '<span class="revpos">' + (REV_I + 1) + ' / ' + Q.length + ' · ' + esc(q.groupe) + '</span>'
    +   '<button class="btn sec mini" id="rev-next">Réponses suivantes →</button>'
    +   '<span class="revetat" id="rev-etat"></span>'
    + '</div>'
    + '<div class="revq">' + esc(q.t) + '</div>'
    + '<div class="revmeta">' + nRep + ' réponse' + (nRep > 1 ? 's' : '')
    +   (notees ? ' · ' + notees + ' notée' + (notees > 1 ? 's' : '') + ' · moyenne ' + (Math.round(somme / notees * 10) / 10) + ' / 5' : '')
    +   (nEcart ? ' · ' + nEcart + ' écarté' + (nEcart > 1 ? 's' : '') + ' masqué' + (nEcart > 1 ? 's' : '') : '')
    /* Dire QUI manque, sinon on compte les lignes et on croit a un bug. */
    +   (muets.length ? ' · <span class="revmuet">' + muets.length + ' sans réponse à celle-ci : '
          + esc(muets.slice(0, 3).join(", ")) + (muets.length > 3 ? ' et ' + (muets.length - 3) + ' autre' + (muets.length > 4 ? 's' : '') : '') + '</span>' : '')
    + '</div>'
    + '<div class="revliste">' + lignes + '</div>'
    + (nEcart ? '<div class="revfoot"><button class="btn sec mini" id="rev-ref">'
        + (REV_REFUSES ? 'Masquer' : 'Afficher') + ' les ' + nEcart + ' écarté' + (nEcart > 1 ? 's' : '')
        + '</button></div>' : '')

    (function(ta){

      if(ADM_TAB !== "revue" || document.querySelector(".fiche")) return;
      var el2 = ev.target, tag = ((el2 && el2.tagName) || "").toLowerCase();
