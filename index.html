<head>

<title>LUMIIA recrute</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --cosmos:#0b0520;--deep:#05001a;--panel:#140932;
  --cyan:#4dd9e8;--mag:#d946ef;--violet:#a855f7;--lime:#b8ff3c;--or:#ffd700;
  --danger:#ff4444;--ok:#4ade80;
  --tx:#f0e8f8;--soft:#c9c2e8;--dim:rgba(201,194,232,.45);
  --bd:rgba(255,255,255,.09);
}
html,body{height:100%;background:var(--deep);color:var(--tx);font-family:'Nunito',sans-serif;}
body{overflow-x:hidden;}
h1,h2,h3,.bebas{font-family:'Bebas Neue',sans-serif;letter-spacing:.06em;font-weight:400;}
.wrap{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:18px 18px 28px;}
.logo{height:30px;width:auto;max-width:180px;object-fit:contain;mix-blend-mode:screen;display:block;margin:0 auto 4px;}
.tag{text-align:center;font-size:.72rem;letter-spacing:.28em;color:var(--dim);text-transform:uppercase;margin-bottom:18px;}
.card{background:linear-gradient(160deg,rgba(20,9,50,.95),rgba(11,5,32,.95));border:1px solid var(--bd);border-radius:18px;padding:20px;}
.btn{display:block;width:100%;padding:16px 18px;border:none;border-radius:14px;font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:.1em;cursor:pointer;background:linear-gradient(90deg,var(--lime),#7ee81f);color:#08130a;margin-top:14px;}
.btn:active{transform:scale(.985);}
.btn.sec{background:transparent;border:1px solid var(--bd);color:var(--soft);font-size:1rem;font-family:'Nunito';letter-spacing:0;padding:12px;}
.btn:disabled{opacity:.4;}
.opt{display:block;width:100%;text-align:left;padding:15px 16px;margin-top:10px;border-radius:14px;border:1px solid var(--bd);background:rgba(255,255,255,.03);color:var(--tx);font-size:.98rem;line-height:1.35;font-family:'Nunito';cursor:pointer;}
.opt.on{border-color:var(--lime);background:rgba(184,255,60,.12);}
.q{font-size:1.5rem;line-height:1.15;margin:6px 0 4px;}
.step{font-size:.7rem;letter-spacing:.25em;color:var(--cyan);text-transform:uppercase;}
.big{font-family:'Bebas Neue',sans-serif;font-size:3.4rem;line-height:.95;letter-spacing:.02em;}
.mut{color:var(--soft);font-size:.92rem;line-height:1.45;}
.dim{color:var(--dim);font-size:.8rem;line-height:1.4;}
input,select,textarea{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--bd);background:rgba(255,255,255,.04);color:var(--tx);font-family:'Nunito';font-size:1rem;margin-top:8px;}
label.f{display:block;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-top:14px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.chip{padding:9px 14px;border-radius:999px;border:1px solid var(--bd);background:rgba(255,255,255,.03);color:var(--soft);font-size:.88rem;cursor:pointer;}
.chip.on{border-color:var(--lime);color:var(--lime);background:rgba(184,255,60,.1);}
.center{text-align:center;}
.spacer{flex:1;}
/* ── JEU ── */
#stage{position:relative;width:100%;height:62vh;min-height:380px;border-radius:18px;border:1px solid var(--bd);background:radial-gradient(120% 80% at 50% 0%,rgba(168,85,247,.16),transparent 60%),var(--panel);overflow:hidden;touch-action:none;user-select:none;}
.hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.hud .t{font-family:'Bebas Neue';font-size:1.6rem;color:var(--cyan);}
.hud .s{font-family:'Bebas Neue';font-size:1.6rem;color:var(--lime);}
.bar{height:5px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden;margin-bottom:12px;}
.bar>i{display:block;height:100%;background:var(--cyan);width:100%;}
.cli{position:absolute;width:64px;text-align:center;transition:opacity .2s;}
.cli .face{font-size:2.1rem;line-height:1;}
.cli .want{font-size:1.15rem;margin-top:-2px;}
.cli .pat{height:4px;width:46px;margin:4px auto 0;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden;}
.cli .pat>i{display:block;height:100%;background:var(--ok);width:100%;}
.cli.tgt{filter:drop-shadow(0 0 10px var(--lime));}
.btl{position:absolute;width:56px;height:76px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.9rem;background:rgba(255,255,255,.06);border:1px solid var(--bd);}
.btl.grab{border-color:var(--lime);background:rgba(184,255,60,.14);z-index:20;}
.fly{position:absolute;font-size:2rem;pointer-events:none;z-index:30;}
.pop{position:absolute;font-family:'Bebas Neue';font-size:1.3rem;pointer-events:none;z-index:40;animation:up .7s ease-out forwards;}
@keyframes up{to{transform:translateY(-38px);opacity:0;}}
.beat{position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:3px solid var(--mag);}
.tile{position:absolute;width:calc(50% - 14px);border-radius:14px;border:1px solid var(--bd);background:rgba(255,255,255,.04);padding:12px 8px;text-align:center;cursor:pointer;}
.tile.on{border-color:var(--lime);background:rgba(184,255,60,.12);}
.tile.ko{border-color:var(--danger);}
.tile .fc{font-size:2rem;}
.tile .nm{font-family:'Bebas Neue';font-size:1.25rem;letter-spacing:.05em;margin-top:2px;}
.tray{position:absolute;width:120px;height:22px;border-radius:6px;background:linear-gradient(180deg,#c9c2e8,#6b6390);}
.glass{position:absolute;width:16px;height:26px;border-radius:3px 3px 6px 6px;background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(77,217,232,.55));}
/* ── TV ── */
#tv{display:none;min-height:100dvh;padding:34px 40px;}
#tv h1{font-size:clamp(2rem,5vw,4rem);color:var(--lime);}
.lb{display:grid;grid-template-columns:auto 1fr auto;gap:10px 18px;margin-top:22px;font-size:clamp(1rem,2.4vw,1.7rem);align-items:center;}
.lb .r{font-family:'Bebas Neue';color:var(--cyan);}
.lb .p{font-family:'Bebas Neue';letter-spacing:.06em;}
.lb .s{font-family:'Bebas Neue';color:var(--lime);}
/* ── ADMIN ── */
#admin{display:none;padding:20px;max-width:1000px;margin:0 auto;}
#admin table{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:10px;}
#admin th,#admin td{border-bottom:1px solid var(--bd);padding:7px 8px;text-align:left;vertical-align:top;}
#admin th{color:var(--cyan);font-family:'Bebas Neue';letter-spacing:.08em;font-size:1rem;}
.adm-sec{margin-top:26px;}
.adm-sec>h2{color:var(--lime);font-size:1.5rem;}
.qed{border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:10px;}
.row2{display:flex;gap:10px;}
.hidden{display:none!important;}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--lime);color:var(--lime);padding:11px 18px;border-radius:99px;font-size:.9rem;z-index:999;}
</style>
</head>

function $(id){ return document.getElementById(id); }
function el(h){ var d=document.createElement("div"); d.innerHTML=h.trim(); return d.firstChild; }
function view(h){ $("view").innerHTML = h; window.scrollTo(0,0); }
function toast(m){ var t=el('<div class="toast"></div>'); t.textContent=m; document.body.appendChild(t); setTimeout(function(){t.remove();},2200); }
function rnd(a){ return a[Math.floor(Math.random()*a.length)]; }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function nl2br(s){ return esc(s).replace(/\n/g,"<br>"); }

}

function screenGame(){

    + '<div class="bar"><i id="h-bar"></i></div>'

  function addPts(n, x, y, txt){
    pts += n;

      var p = el('<div class="pop"></div>');

      setTimeout(function(){ p.remove(); }, 700);
    }
  }
  function finish(){
    S.score += pts;
    S.games.push({ jeu: g.key, points: pts });
    S.gi++;
    setTimeout(screenGameIntro, 350);
  }
  var api = { stage: stage, addPts: addPts, finish: finish, setTimer: setTimer };
  if(g.key === "shaker")  runShaker(api);
  if(g.key === "service") runService(api);
  if(g.key === "prenoms") runPrenoms(api);
  if(g.key === "plateau") runPlateau(api);
}

function setTimer(sec, onEnd){
  var bar = $("h-bar"); var t0 = Date.now(); var stop = false;
  (function tick(){
    if(stop) return;
    var e = (Date.now()-t0)/1000;
    var r = Math.max(0, 1 - e/sec);
    if(bar) bar.style.width = (r*100)+"%";
    if(r <= 0){ onEnd(); return; }
    requestAnimationFrame(tick);
  })();
  return function(){ stop = true; };
}

/* ── JEU 1 : SHAKER ── */
function runShaker(api){
  var stage = api.stage;
  var circle = el('<div class="beat"></div>');
  var hint = el('<div style="position:absolute;left:0;right:0;bottom:22px;text-align:center;color:var(--dim);font-size:.85rem">Tape sur le rythme</div>');
  stage.appendChild(circle); stage.appendChild(hint);
  var period = 545, t0 = Date.now() + 900, done = false;
  var stopT = api.setTimer(GAMES.shaker.dur + 1, function(){ if(!done){ done = true; api.finish(); } });
  (function anim(){
    if(done) return;
    var e = Date.now() - t0;
    var ph = ((e % period) + period) % period / period;
    var sc = 1 + 0.42 * Math.max(0, 1 - ph*2.4);
    circle.style.transform = "scale(" + sc.toFixed(3) + ")";
    circle.style.borderColor = ph < 0.14 ? "var(--lime)" : "var(--mag)";
    requestAnimationFrame(anim);
  })();
  stage.addEventListener("pointerdown", function(ev){
    if(done) return;
    var e = Date.now() - t0;
    if(e < -200) return;
    var off = ((e % period) + period) % period;
    if(off > period/2) off -= period;
    var a = Math.abs(off);
    var r = stage.getBoundingClientRect();
    var x = ev.clientX - r.left, y = ev.clientY - r.top;
    if(a < 90)       api.addPts(15, x, y, "PILE !");
    else if(a < 165) api.addPts(7,  x, y, "+7");
    else             api.addPts(-3, x, y, "rat\u00e9");
  });
}

/* ── JEU 2 : LE SERVICE ── */
function runService(api){
  var stage = api.stage;
  var TYPES = [
    { id:"biere",  ico:"\uD83C\uDF7A" },
    { id:"cockt",  ico:"\uD83C\uDF79" },
    { id:"shot",   ico:"\uD83E\uDD43" }
  ];
  var FACES = ["\uD83D\uDE03","\uD83D\uDE0E","\uD83E\uDD73","\uD83D\uDE01","\uD83D\uDE04","\uD83E\uDD29"];
  var clients = [], done = false;
  var W = stage.clientWidth, H = stage.clientHeight;

  var sep = el('<div style="position:absolute;left:8%;right:8%;top:58%;height:1px;background:rgba(255,255,255,.08)"></div>');
  stage.appendChild(sep);

  for(var i=0;i<TYPES.length;i++){
    (function(t, idx){
      var b = el('<div class="btl"></div>');
      b.textContent = t.ico;
      b.style.left = (W*(0.16 + idx*0.28) - 28) + "px";
      b.style.top  = (H*0.74) + "px";
      b.setAttribute("data-type", t.id);
      stage.appendChild(b);
    })(TYPES[i], i);
  }

  function spawn(){
    if(done || clients.length >= 3) return;
    var slots = [0.2, 0.5, 0.8];
    var used = clients.map(function(c){ return c.slot; });
    var free = slots.filter(function(s){ return used.indexOf(s) === -1; });
    if(!free.length) return;
    var slot = rnd(free);
    var t = rnd(TYPES);
    var c = el('<div class="cli"><div class="face"></div><div class="want"></div><div class="pat"><i></i></div></div>');
    c.querySelector(".face").textContent = rnd(FACES);
    c.querySelector(".want").textContent = t.ico;
    c.style.left = (W*slot - 32) + "px";
    c.style.top = (H*0.09) + "px";
    stage.appendChild(c);
    var o = { el:c, type:t.id, slot:slot, pat:1, gauge:c.querySelector(".pat>i") };
    clients.push(o);
  }
  spawn(); spawn();
  var spawnT = setInterval(spawn, 1600);

  var patT = setInterval(function(){
    if(done) return;
    for(var i=clients.length-1;i>=0;i--){
      var c = clients[i];
      c.pat -= 0.017;
      if(c.gauge){
        c.gauge.style.width = Math.max(0, c.pat*100) + "%";
        c.gauge.style.background = c.pat > 0.5 ? "var(--ok)" : (c.pat > 0.25 ? "var(--or)" : "var(--danger)");
      }
      if(c.pat <= 0){
        var r = c.el.getBoundingClientRect(), sr = stage.getBoundingClientRect();
        api.addPts(-8, r.left - sr.left + 30, r.top - sr.top + 20, "parti !");
        c.el.remove(); clients.splice(i,1); spawn();
      }
    }
  }, 100);

  var drag = null;
  stage.addEventListener("pointerdown", function(ev){
    if(done) return;
    var b = ev.target.closest ? ev.target.closest(".btl") : null;
    if(!b) return;
    b.classList.add("grab");
    var f = el('<div class="fly"></div>');
    f.textContent = b.textContent;
    stage.appendChild(f);
    drag = { src:b, fly:f, type:b.getAttribute("data-type") };
    move(ev);
    stage.setPointerCapture && stage.setPointerCapture(ev.pointerId);
  });
  function move(ev){
    if(!drag) return;
    var r = stage.getBoundingClientRect();
    drag.fly.style.left = (ev.clientX - r.left - 16) + "px";
    drag.fly.style.top  = (ev.clientY - r.top  - 20) + "px";
    var hit = hitClient(ev.clientX, ev.clientY);
    for(var i=0;i<clients.length;i++) clients[i].el.classList.toggle("tgt", clients[i] === hit);
  }
  stage.addEventListener("pointermove", move);
  function hitClient(x, y){
    for(var i=0;i<clients.length;i++){
      var r = clients[i].el.getBoundingClientRect();
      if(x > r.left-18 && x < r.right+18 && y > r.top-18 && y < r.bottom+18) return clients[i];
    }
    return null;
  }
  stage.addEventListener("pointerup", function(ev){
    if(!drag) return;
    var hit = hitClient(ev.clientX, ev.clientY);
    var sr = stage.getBoundingClientRect();
    var x = ev.clientX - sr.left, y = ev.clientY - sr.top;
    if(hit){
      if(hit.type === drag.type){
        api.addPts(25, x, y, "+25");
        hit.el.remove();
        clients.splice(clients.indexOf(hit),1);
        spawn();
      } else {
        api.addPts(-6, x, y, "pas \u00e7a");
        hit.pat = Math.max(0.05, hit.pat - 0.22);
      }
    }
    drag.fly.remove(); drag.src.classList.remove("grab");
    for(var i=0;i<clients.length;i++) clients[i].el.classList.remove("tgt");
    drag = null;
  });

  api.setTimer(GAMES.service.dur, function(){
    done = true; clearInterval(spawnT); clearInterval(patT); api.finish();
  });
}

/* ── JEU 3 : LES PRENOMS ── */
function runPrenoms(api){
  var stage = api.stage;
  var NOMS = ["L\u00e9a","Karim","Chlo\u00e9","Mehdi","Anna","Tom","Ines","Hugo","Sarah","Yanis","Manon","Nino"];
  var FACES = ["\uD83D\uDC69","\uD83D\uDC68","\uD83D\uDC71\u200D\u2640\uFE0F","\uD83E\uDDD4","\uD83D\uDC69\u200D\uD83E\uDDB0","\uD83D\uDC74","\uD83D\uDC69\u200D\uD83E\uDDB1","\uD83E\uDDD1"];
  var noms = shuffle(NOMS).slice(0,5), faces = shuffle(FACES).slice(0,5);
  var people = noms.map(function(n,i){ return { nom:n, face:faces[i] }; });
  var qi = 0, order = shuffle(people.slice());

  function place(showName){
    stage.innerHTML = "";
    var lay = [[6,6],[52,6],[6,36],[52,36],[29,66]];
    for(var i=0;i<people.length;i++){
      (function(p, i){
        var t = el('<div class="tile"><div class="fc"></div><div class="nm"></div></div>');
        t.querySelector(".fc").textContent = p.face;
        t.querySelector(".nm").textContent = showName ? p.nom : "?";
        t.style.left = lay[i][0] + "%"; t.style.top = lay[i][1] + "%";
        t.setAttribute("data-n", p.nom);
        stage.appendChild(t);
      })(people[i], i);
    }
  }
  function memo(){
    place(true);
    var hint = el('<div style="position:absolute;left:0;right:0;bottom:6px;text-align:center;color:var(--cyan);font-size:.9rem">M\u00e9morise\u2026</div>');
    stage.appendChild(hint);
    var stop = api.setTimer(5, function(){ people = shuffle(people); ask(); });
  }
  function ask(){
    if(qi >= order.length){ api.finish(); return; }
    var hb = $("h-bar"); if(hb) hb.style.width = "100%";
    place(false);
    var cible = order[qi];
    var lbl = el('<div style="position:absolute;left:0;right:0;bottom:4px;text-align:center"></div>');
    lbl.innerHTML = '<span class="dim">Qui est</span> <span class="bebas" style="font-size:1.5rem;color:var(--lime)">' + esc(cible.nom) + '</span> <span class="dim">?</span>';
    stage.appendChild(lbl);
    var tiles = stage.querySelectorAll(".tile");
    for(var k=0;k<tiles.length;k++){
      tiles[k].onclick = function(){
        var ok = this.getAttribute("data-n") === cible.nom;
        this.classList.add(ok ? "on" : "ko");
        this.querySelector(".nm").textContent = this.getAttribute("data-n");
        var r = this.getBoundingClientRect(), sr = stage.getBoundingClientRect();
        api.addPts(ok ? 30 : -5, r.left - sr.left + 30, r.top - sr.top + 20, ok ? "+30" : "non");
        for(var z=0;z<tiles.length;z++) tiles[z].onclick = null;
        qi++;
        setTimeout(ask, 520);
      };
    }
  }
  memo();
}

/* ── JEU 4 : LE PLATEAU ── */
function runPlateau(api){
  var stage = api.stage;
  var W = stage.clientWidth, H = stage.clientHeight;
  var tray = el('<div class="tray"></div>');
  tray.style.top = (H - 46) + "px";
  stage.appendChild(tray);
  var tx = W/2, done = false, glasses = [], tilt = 0, useTilt = false;

  function drawTray(){ tray.style.left = (tx - 60) + "px"; }
  drawTray();

  function onOri(e){
    if(e.gamma == null) return;
    useTilt = true;
    tilt = Math.max(-30, Math.min(30, e.gamma));
  }
  if(window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === "function"){
    DeviceOrientationEvent.requestPermission().then(function(r){
      if(r === "granted") window.addEventListener("deviceorientation", onOri);
    }).catch(function(){});
  } else if(window.DeviceOrientationEvent){
    window.addEventListener("deviceorientation", onOri);
  }
  stage.addEventListener("pointerdown", pmove);
  stage.addEventListener("pointermove", pmove);
  function pmove(ev){
    var r = stage.getBoundingClientRect();
    tx = ev.clientX - r.left; useTilt = false; drawTray();
  }

  var spawnT = setInterval(function(){
    if(done) return;
    var g = el('<div class="glass"></div>');
    var gx = 20 + Math.random() * (W - 40);
    g.style.left = (gx - 8) + "px"; g.style.top = "-30px";
    stage.appendChild(g);
    glasses.push({ el:g, x:gx, y:-30, v:1.9 + Math.random()*1.5 });
  }, 780);

  (function loop(){
    if(done) return;
    if(useTilt){ tx += tilt * 0.55; }
    tx = Math.max(60, Math.min(W-60, tx));
    drawTray();
    for(var i=glasses.length-1;i>=0;i--){
      var g = glasses[i];
      g.y += g.v; g.v += 0.05;
      g.el.style.top = g.y + "px";
      if(g.y > H - 62 && g.y < H - 30 && Math.abs(g.x - tx) < 62){
        api.addPts(15, g.x, g.y, "+15");
        g.el.remove(); glasses.splice(i,1);
      } else if(g.y > H + 20){
        g.el.remove(); glasses.splice(i,1);
      }
    }
    requestAnimationFrame(loop);
  })();

  api.setTimer(GAMES.plateau.dur, function(){
    done = true; clearInterval(spawnT);
    window.removeEventListener("deviceorientation", onOri);
    api.finish();
  });
}

/* ══════════ ECRAN 3 — score + classement ══════════ */
function screenScore(){
  var s = S.score;
  var mot = s >= 320 ? "On te veut." : (s >= 200 ? "Tr\u00e8s bon r\u00e9flexe." : (s >= 110 ? "\u00c7a se travaille." : "Bon\u2026 t\u2019as le sourire ?"));
  view('<div class="card center">'
    + '<div class="step">Ton score</div>'
    + '<div class="big" style="font-size:5rem;color:var(--lime)">' + s + '</div>'
    + '<div class="mut">' + mot + '</div>'
    + '<label class="f" style="text-align:left">Ton pr\u00e9nom pour le classement du bar</label>'
    + '<input id="sc-pre" maxlength="14" placeholder="Pr\u00e9nom" autocomplete="given-name">'
    + '<button class="btn" id="sc-ok">JE VALIDE</button>'
    + '<button class="btn sec" id="sc-skip">Passer</button>'
    + '</div>');
  $("sc-ok").onclick = function(){
    var p = ($("sc-pre").value || "").trim();
    if(p.length < 2){ toast("Ton pr\u00e9nom, deux lettres minimum"); return; }
    S.prenom = p;
    if(db){
      db.ref(FB_PATH + "/scores").push({
        prenom: p, score: S.score, parcours: S.parcours, ts: Date.now()
      }).catch(function(){});
    }
    screenOffre();
  };
  $("sc-skip").onclick = screenOffre;
}

/* ══════════ ECRAN 4 — l'offre ══════════ */
function screenOffre(){
  var o = S.parcours === "nuit" ? CFG.offre_nuit : CFG.offre_jour;
  view('<div class="card">'
    + '<div class="step">Le poste</div>'
    + '<div class="big" style="color:var(--lime);font-size:2.6rem">' + esc(o.titre) + '</div>'
    + '<div class="mut" style="margin-top:12px">' + nl2br(o.texte) + '</div>'
    + '<button class="btn" id="o-yes">\u00c7A M\u2019INT\u00c9RESSE, RAPPELEZ-MOI</button>'
    + '<button class="btn sec" id="o-no">Non merci, je jouais juste</button>'
    + '</div>');
  $("o-yes").onclick = screenForm;
  $("o-no").onclick = function(){ screenFin(false); };
}

/* ══════════ ECRAN 5 — coordonnées ══════════ */
function screenForm(){
  var nuit = S.parcours === "nuit";
  var dispos = nuit
    ? ["Jeudi soir","Vendredi soir","Samedi soir","Mercredi \u2192 dimanche (35h)","Je peux finir \u00e0 3h du matin"]
    : ["Temps plein","Temps partiel","Ponctuel / chantiers"];
  var h = '<div class="card">'
    + '<div class="step">Derni\u00e8re \u00e9tape</div>'
    + '<div class="q">On t\u2019appelle.</div>'
    + '<div class="dim">C\u2019est nous qui reprenons contact. Pas de CV \u00e0 envoyer.</div>'
    + '<label class="f">Pr\u00e9nom et nom</label><input id="f-nom" value="' + esc(S.prenom) + '" autocomplete="name">'
    + '<label class="f">T\u00e9l\u00e9phone</label><input id="f-tel" type="tel" inputmode="tel" autocomplete="tel" placeholder="06\u2026">'
    + '<label class="f">Email (facultatif)</label><input id="f-mail" type="email" autocomplete="email">'
    + '<label class="f">Tes dispos</label><div class="chips" id="f-dispos">';
  for(var i=0;i<dispos.length;i++) h += '<div class="chip" data-v="' + esc(dispos[i]) + '">' + esc(dispos[i]) + '</div>';
  h += '</div><label class="f">Permis B</label><div class="chips" id="f-permis">'
    + '<div class="chip" data-v="Oui">Oui</div><div class="chip" data-v="En cours">En cours</div><div class="chip" data-v="Non">Non</div>';
  h += '</div>'
    + '<label class="f">Un mot pour nous (facultatif)</label><textarea id="f-mot" rows="3"></textarea>'
    + '<button class="btn" id="f-go">ENVOYER</button>'
    + '</div>';
  view(h);
  var chips = document.querySelectorAll("#f-dispos .chip");
  for(var k=0;k<chips.length;k++) chips[k].onclick = function(){ this.classList.toggle("on"); };
  var pchips = document.querySelectorAll("#f-permis .chip");
  for(var k2=0;k2<pchips.length;k2++) pchips[k2].onclick = function(){
    for(var z=0;z<pchips.length;z++) pchips[z].classList.remove("on");
    this.classList.add("on");
  };
  $("f-go").onclick = function(){
    var nom = ($("f-nom").value||"").trim();
    var tel = ($("f-tel").value||"").trim();
    if(nom.length < 2){ toast("Il nous faut ton nom"); return; }
    if(tel.replace(/[^0-9]/g,"").length < 9){ toast("Un num\u00e9ro valide, sinon on ne peut pas rappeler"); return; }
    var d = [];
    var cs = document.querySelectorAll("#f-dispos .chip.on");
    for(var j=0;j<cs.length;j++) d.push(cs[j].getAttribute("data-v"));
    var rec = {
      parcours: S.parcours, nom: nom, tel: tel,
      email: ($("f-mail").value||"").trim(),
      dispos: d.join(", "),
      permis: (document.querySelector("#f-permis .chip.on")||{getAttribute:function(){return "";}}).getAttribute("data-v") || "",
      mot: ($("f-mot").value||"").trim(),
      score: S.score, quiz: S.quiz, jeux: S.games,
      ts: Date.now(), statut: "nouveau"
    };
    this.disabled = true;
    if(db){
      db.ref(FB_PATH + "/candidats").push(rec)
        .then(function(){ screenFin(true); })
        .catch(function(){ toast("Souci r\u00e9seau \u2014 viens nous voir au bar !"); });
    } else { screenFin(true); }
  };
}

/* ══════════ ECRAN 6 — fin ══════════ */
function screenFin(candidat){
  var h = '<div class="card center">';
  if(candidat){
    h += '<div style="font-size:3.2rem">\uD83C\uDF89</div>'
      + '<div class="big" style="color:var(--lime)">C\u2019EST DANS<br>LA BO\u00ceTE.</div>'
      + '<div class="mut" style="margin-top:12px">On te rappelle. En attendant : montre cet \u00e9cran au bar, on veut voir ta t\u00eate.</div>';
  } else {
    h += '<div style="font-size:3.2rem">\uD83D\uDC4B</div>'
      + '<div class="big" style="color:var(--lime)">MERCI D\u2019\u00caTRE<br>PASS\u00c9 JOUER.</div>'
      + '<div class="mut" style="margin-top:12px">Ton score est au mur. Si tu connais quelqu\u2019un qui cherche du taf\u2026 tu sais quoi faire.</div>';
  }
  if(S.parcours === "nuit" && S.score){
    h += '<div style="margin-top:16px"><span class="dim">Score</span> <span class="big" style="font-size:2.4rem;color:var(--cyan)">' + S.score + '</span></div>';
  }
  h += '<button class="btn sec" id="fin-re">Rejouer</button></div>';
  view(h);
  $("fin-re").onclick = function(){ S.qi=0; S.quiz=[]; S.score=0; S.games=[]; screenIntro(); };
}

/* ══════════ VUE TV — classement projeté ══════════ */
function initTv(){
  if(!db){ $("lb").textContent = "Hors ligne"; return; }
  db.ref(FB_PATH + "/scores").on("value", function(snap){
    var v = snap.val() || {}, arr = [];
    for(var k in v){ if(v[k] && v[k].prenom) arr.push(v[k]); }
    arr.sort(function(a,b){ return (b.score||0) - (a.score||0); });
    arr = arr.slice(0, 12);
    var h = "";
    for(var i=0;i<arr.length;i++){
      h += '<div class="r">' + (i+1) + '</div><div class="p">' + esc(arr[i].prenom) + '</div><div class="s">' + (arr[i].score||0) + '</div>';
    }
    $("lb").innerHTML = h || '<div class="dim">Personne n\u2019a encore os\u00e9.</div>';
  });
}

/* ══════════ ADMIN ══════════ */
function initAdmin(){
  $("adm-go").onclick = function(){
    var m = $("adm-mail").value.trim(), p = $("adm-pass").value;
    auth.signInWithEmailAndPassword(m, p).catch(function(e){ $("adm-err").textContent = e.message; });
  };
  auth.onAuthStateChanged(function(u){
    if(u){ $("adm-login").classList.add("hidden"); $("adm-body").classList.remove("hidden"); admLoad(); }
    else { $("adm-login").classList.remove("hidden"); $("adm-body").classList.add("hidden"); }
  });
}

function admLoad(){
  loadCfg(function(){
    admRender();
    db.ref(FB_PATH + "/candidats").on("value", function(s){ admCandidats(s.val() || {}); });
    db.ref(FB_PATH + "/scores").on("value", function(s){ admScores(s.val() || {}); });
  });
}

function admQuizEditor(key, titre){
  var qs = CFG[key] || [];
  var h = '<div class="adm-sec"><h2>' + titre + '</h2>';
  for(var i=0;i<qs.length;i++){
    h += '<div class="qed"><label class="f">Question ' + (i+1) + '</label>'
      + '<input data-k="' + key + '" data-i="' + i + '" data-f="q" value="' + esc(qs[i].q) + '">';
    for(var j=0;j<qs[i].o.length;j++){
      h += '<input data-k="' + key + '" data-i="' + i + '" data-f="o" data-j="' + j + '" value="' + esc(qs[i].o[j]) + '">';
    }
    h += '</div>';
  }
  h += '</div>';
  return h;
}

function admRender(){
  var h = '<div class="adm-sec"><h2>Offres</h2>'
    + '<label class="f">Titre \u2014 parcours NUIT</label><input id="a-on-t" value="' + esc(CFG.offre_nuit.titre) + '">'
    + '<label class="f">Texte \u2014 parcours NUIT</label><textarea id="a-on-x" rows="6">' + esc(CFG.offre_nuit.texte) + '</textarea>'
    + (JOUR_ACTIF ? ('<label class="f">Titre \u2014 parcours JOUR</label><input id="a-oj-t" value="' + esc(CFG.offre_jour.titre) + '">'
    + '<label class="f">Texte \u2014 parcours JOUR</label><textarea id="a-oj-x" rows="6">' + esc(CFG.offre_jour.texte) + '</textarea>') : '<div class="dim" style="margin-top:10px">Parcours JOUR (atelier / travaux) d\u00e9sactiv\u00e9. Ses contenus sont conserv\u00e9s : repasser JOUR_ACTIF a true dans le code le r\u00e9active.</div>')
    + '</div>'
    + '<div class="adm-sec"><h2>Mini-jeux actifs</h2><div class="chips" id="a-games">';
  var gk = ["shaker","service","prenoms","plateau"];
  for(var i=0;i<gk.length;i++){
    h += '<div class="chip' + (CFG.games[gk[i]] ? ' on' : '') + '" data-g="' + gk[i] + '">' + GAMES[gk[i]].ico + ' ' + GAMES[gk[i]].nom + '</div>';
  }
  h += '</div><div class="dim" style="margin-top:8px">Le parcours enchaine Shaker, Service, puis un des deux autres au hasard.</div></div>'
    + admQuizEditor("quiz_nuit", "Quiz \u2014 parcours NUIT")
    + (JOUR_ACTIF ? admQuizEditor("quiz_jour", "Quiz \u2014 parcours JOUR") : "")
    + '<button class="btn" id="a-save" style="max-width:320px">ENREGISTRER</button>'
    + '<div class="adm-sec"><h2>Candidats</h2><button class="btn sec" id="a-csv" style="max-width:220px">Export CSV</button><div id="a-cand"></div></div>'
    + '<div class="adm-sec"><h2>Classement</h2><div id="a-sc"></div></div>'
    + '<div class="adm-sec"><h2>Liens</h2><div class="mut" id="a-links"></div></div>';
  $("adm-body").innerHTML = h;

  var base = window.location.origin + window.location.pathname;
  $("a-links").innerHTML = "Lien public (QR des affiches) : <b>https://www.lumiia.fr/link</b><br>App directe : <b>" + base + "?nuit</b><br>\u00c9cran du bar : <b>" + base + "?tv</b>" + (JOUR_ACTIF ? "<br>Affiche JOUR : <b>" + base + "?jour</b>" : "");

  var chips = document.querySelectorAll("#a-games .chip");
  for(var k=0;k<chips.length;k++) chips[k].onclick = function(){ this.classList.toggle("on"); };

  $("a-save").onclick = function(){
    CFG.offre_nuit = { titre: $("a-on-t").value, texte: $("a-on-x").value };
    CFG.offre_jour = { titre: $("a-oj-t").value, texte: $("a-oj-x").value };
    var gs = {};
    var cs = document.querySelectorAll("#a-games .chip");
    for(var i=0;i<cs.length;i++) gs[cs[i].getAttribute("data-g")] = cs[i].classList.contains("on");
    CFG.games = gs;
    var ins = $("adm-body").querySelectorAll("input[data-k]");
    for(var n=0;n<ins.length;n++){
      var el2 = ins[n], kk = el2.getAttribute("data-k"), ii = +el2.getAttribute("data-i");
      if(el2.getAttribute("data-f") === "q") CFG[kk][ii].q = el2.value;
      else CFG[kk][ii].o[+el2.getAttribute("data-j")] = el2.value;
    }
    db.ref(FB_PATH + "/config").set({
      quiz_nuit: CFG.quiz_nuit, quiz_jour: CFG.quiz_jour,
      offre_nuit: CFG.offre_nuit, offre_jour: CFG.offre_jour,
      games: CFG.games, updatedAt: new Date().toISOString()
    }).then(function(){ toast("Enregistr\u00e9"); }).catch(function(e){ toast("Erreur : " + e.message); });
  };
  $("a-csv").onclick = admCsv;
}

var LAST_CAND = {};
function admCandidats(v){
  LAST_CAND = v;
  var arr = [];
  for(var k in v){ var o = v[k]; o._k = k; arr.push(o); }
  arr.sort(function(a,b){ return (b.ts||0) - (a.ts||0); });
  var h = '<table><tr><th>Date</th><th>Parcours</th><th>Nom</th><th>T\u00e9l</th><th>Dispos</th><th>Permis</th><th>Score</th><th>Mot</th></tr>';
  for(var i=0;i<arr.length;i++){
    var c = arr[i], d = new Date(c.ts||0);
    h += '<tr><td>' + d.toLocaleDateString("fr-FR") + ' ' + d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}) + '</td>'
      + '<td>' + esc(c.parcours) + '</td><td><b>' + esc(c.nom) + '</b><br><span class="dim">' + esc(c.email||"") + '</span></td>'
      + '<td>' + esc(c.tel) + '</td><td>' + esc(c.dispos||"") + '</td><td>' + esc(c.permis||"") + '</td><td>' + (c.score||0) + '</td><td>' + esc(c.mot||"") + '</td></tr>';
  }
  h += '</table>';
  if(!arr.length) h = '<div class="dim">Aucune candidature pour l\u2019instant.</div>';
  $("a-cand").innerHTML = h;
}

function admScores(v){
  var arr = [];
  for(var k in v){ var o = v[k]; o._k = k; arr.push(o); }
  arr.sort(function(a,b){ return (b.score||0) - (a.score||0); });
  var h = '<table><tr><th>#</th><th>Pr\u00e9nom</th><th>Score</th><th>Date</th><th></th></tr>';
  for(var i=0;i<Math.min(arr.length,40);i++){
    var s = arr[i];
    h += '<tr><td>' + (i+1) + '</td><td>' + esc(s.prenom) + '</td><td>' + (s.score||0) + '</td><td>'
      + new Date(s.ts||0).toLocaleDateString("fr-FR") + '</td><td><button class="chip" data-del="' + s._k + '">suppr</button></td></tr>';
  }
  h += '</table>';
  $("a-sc").innerHTML = arr.length ? h : '<div class="dim">Aucun score.</div>';
  var dels = $("a-sc").querySelectorAll("[data-del]");
  for(var n=0;n<dels.length;n++){
    dels[n].onclick = function(){ db.ref(FB_PATH + "/scores/" + this.getAttribute("data-del")).remove(); };
  }
}

function admCsv(){
  var rows = [["date","parcours","nom","tel","email","dispos","permis","score","mot","quiz"]];
  for(var k in LAST_CAND){
    var c = LAST_CAND[k];
    var q = (c.quiz||[]).map(function(x){ return x.q + " >> " + x.r; }).join(" | ");
    rows.push([ new Date(c.ts||0).toLocaleString("fr-FR"), c.parcours||"", c.nom||"", c.tel||"", c.email||"", c.dispos||"", c.permis||"", c.score||0, (c.mot||"").replace(/\n/g," "), q ]);
  }
  var csv = rows.map(function(r){
    return r.map(function(f){ return '"' + String(f).replace(/"/g,'""') + '"'; }).join(";");
  }).join("\n");
  var blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "lumiia-candidats.csv";
  a.click();
}

/* ══════════ GO ══════════ */
route();
</script>
</body>
</html>
