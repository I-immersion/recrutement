      if(ev.key === "ArrowLeft"  && $("rev-prev")){ ev.preventDefault(); $("rev-prev").click(); }
    });
  }
}

/* ══════════════════════════════════════════════════════════════
   ONGLET AVIS DE L'EQUIPE — le tableau de bord
   ──────────────────────────────────────────────────────────────
   La moyenne seule ecrase l'essentiel : trois personnes a 4 et une a 1,
   ca fait 3,25 comme quatre personnes tiedes, et ce n'est pas du tout la
   meme situation. On affiche donc l'ECART entre la voix la plus haute et
   la plus basse, et on peut trier par lui : c'est la que la discussion
   vaut le coup. On affiche aussi qui n'a pas encore vote — sans ca on lit
   un consensus la ou il manque la moitie des voix.
   ══════════════════════════════════════════════════════════════ */
var AVIS_TRI = "impression", AVIS_SEL = "";

function avisSynth(c, eq, Q){
  var par = {}, tout = [];
  Q.forEach(function(q){
    var e = evalTous(c, q.cle);
    for(var id in e){
      var v = e[id];
      if(v && v.n){
        if(!par[id]) par[id] = { s:0, n:0 };
        par[id].s += v.n; par[id].n++;
        tout.push(v.n);
      }
    }
  });
  var moy = {}, vals = [], votants = 0;
  for(var id2 in par){
    if(!par[id2].n) continue;
    moy[id2] = Math.round(par[id2].s / par[id2].n * 10) / 10;
    vals.push(moy[id2]); votants++;
  }
  /* La moyenne generale est la moyenne DES MOYENNES : chaque personne compte
     pour une, quel que soit le nombre de reponses qu'elle a notees. */
  var som = 0;
  vals.forEach(function(x){ som += x; });

  /* L'ECART mesure le desaccord. Il porte sur l'IMPRESSION GENERALE des que deux
     personnes en ont donne une : c'est le jugement sur la personne qui merite
     d'etre discute, pas la note d'une reponse isolee. Tant qu'il n'y en a pas
     assez, il retombe sur les moyennes de reponses plutot que de n'afficher
     rien. */
  var imp  = impressionMoy(c);
  var base = (imp && imp.vals.length > 1) ? imp.vals : vals;

  /* L'impression de CHAQUE personne, pour sa colonne. Une colonne qui ne
     montrerait que sa moyenne de reponses resterait vide chez quelqu'un qui a
     donne son avis sur la personne sans noter chaque reponse — or c'est
     exactement ce qu'on lui permet de faire. */
  var impPar = {}, exprime = {};
  var ei = impressionTous(c);
  for(var i3 in ei){
    if(!ei[i3]) continue;
    if(ei[i3].n){ impPar[i3] = ei[i3].n; exprime[i3] = true; }
    else if(ei[i3].txt){ exprime[i3] = true; }
  }
  for(var i4 in moy) exprime[i4] = true;
  var nExpr = 0;
  for(var i5 in exprime) nExpr++;

  return {
    impPar: impPar,
    exprimes: nExpr,
    moy: moy,
    globale: vals.length ? Math.round(som / vals.length * 10) / 10 : null,
    imp: imp ? imp.moy : null,
    impN: imp ? imp.n : 0,
    surImp: !!(imp && imp.vals.length > 1),
    ecart: (base.length > 1) ? Math.round((Math.max.apply(null, base) - Math.min.apply(null, base)) * 10) / 10 : 0,
    ecartN: base.length,
    votants: votants,
    manquants: eq.length - nExpr,
    nNotes: tout.length
  };
}

/* Le detail : tous les avis d'un candidat, question par question, cote a cote. */
function avisDetail(c, eq, Q){
  /* « voir la fiche complete » etait un lien discret en bout de ligne : personne
     ne le trouvait. C'est pourtant le geste le plus frequent depuis ce tableau. */
  var h = '<div class="avdet"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">'
    + '<b style="font-size:1.05rem">' + esc(nomComplet(c)) + '</b>'
    + '<button class="btn sec" data-fiche="' + esc(c._k) + '">OUVRIR LA FICHE</button></div>';

  if(estAdmin()){
    h += '<div class="chips" style="margin-top:10px">'
      + '<div class="chip" data-avc="' + esc(c._k) + '" data-avsv="retenu">Retenu</div>'
      + '<div class="chip" data-avc="' + esc(c._k) + '" data-avsv="rdv">RDV \u00e0 fixer</div>'
      + '<div class="chip" data-avc="' + esc(c._k) + '" data-avsv="ecarte">\u00c9cart\u00e9</div>'
      + '</div>';
  }

  h += blocImpression(c);

  var impA = [];
  eq.forEach(function(m){
    if(m.id === MEMBRE) return;
    if(!voitLesAutres()) return;
    var a = impressionDe(c, m.id); if(!a.n && !a.txt) return;
    impA.push('<div class="avl"><b>' + esc(m.nom) + '</b> '
      + (a.n ? '<span class="avn">' + a.n + '/5</span>' : '<span class="dim">sans note</span>')
      + (a.txt ? '<div class="avt">' + esc(a.txt) + '</div>' : '') + '</div>');
  });
  if(impA.length){
    h += '<div class="avdq" style="margin-top:14px"><div class="avdqt">Impressions g\u00e9n\u00e9rales des autres</div>'
       + impA.join("") + '</div>';
  }

  if(!voitLesAutres()){
    h += '<p class="aide" style="margin-top:12px">Les avis des autres s\u2019afficheront ici '
       + 'quand Emmanuel aura ouvert la mise en commun.</p>';
  }

  var vide = true;
  h += '<div style="margin-top:12px">';
  Q.forEach(function(q){
    var e = evalTous(c, q.cle), bouts = [];
    eq.forEach(function(m){
      if(!voitLesAutres() && m.id !== MEMBRE) return;
      var a = e[m.id]; if(!a || (!a.n && !a.txt)) return;
      bouts.push('<div class="avl"><b>' + esc(m.nom) + '</b> '
        + (a.n ? '<span class="avn">' + a.n + '/5</span>' : '<span class="dim">sans note</span>')
        + (a.txt ? '<div class="avt">' + esc(a.txt) + '</div>' : '') + '</div>');
    });
    if(!bouts.length) return;
    vide = false;
    h += '<div class="avdq"><div class="avdqt">' + esc(q.t) + '</div>' + bouts.join("") + '</div>';
  });
  if(vide) h += '<p class="aide">Aucun avis d\u00e9pos\u00e9 sur ce candidat pour le moment.</p>';
  return h + '</div></div>';
}

/* L'equipe : la liste des personnes autorisees a signer un avis. Le code jury,
   lui, se change sur le serveur — il n'apparait nulle part dans cette page. */
/* Chaque personne a SON code. C'est ce qui permet a l'app de savoir qui note
   sans le lui demander — et donc a une note d'etre signee par le code qui a
   ouvert la session, non par un nom choisi dans une liste.
   Les codes ne sont NI dans cette page NI dans Firebase : ils sont lus et
   ecrits sur le serveur a chaque fois, par un guichet qui exige le jeton
   d'admin. Un champ vide retire simplement l'acces de cette personne. */
var JURY_CODES = null;   /* null = pas encore charge */
var JURY_ETAT  = "";

function blocEquipe(){
  var L = equipeTriee();
  var h = '<div class="adm-sec" style="margin-top:16px"><h2>L\u2019\u00e9quipe qui note</h2>'
    + '<p class="aide">Un code \u00e0 6 chiffres par personne, que vous choisissez et pouvez '
    + 'changer quand vous voulez. Vous leur donnez l\u2019adresse de l\u2019admin et leur code : '
    + 'l\u2019app les reconna\u00eet toute seule. Elles peuvent noter et commenter ; la base leur '
    + 'refuse toute modification des textes, du quiz et des messages.</p>';
  L.forEach(function(m){
    var admin = (m.id === MEMBRE_ADMIN);
    var code  = (JURY_CODES && JURY_CODES[m.id]) ? JURY_CODES[m.id] : "";
    h += '<div class="txrow" data-eq="' + esc(m.id) + '" style="display:flex;gap:10px;align-items:center;margin-top:8px">'
      + '<input class="eq-nom" value="' + esc(m.nom) + '" placeholder="Pr\u00e9nom" style="flex:1;margin:0">'
      + (admin
          ? '<span class="dim" style="white-space:nowrap">votre code admin</span>'
          : '<input class="eq-code" type="tel" inputmode="numeric" maxlength="6" '
            + 'value="' + esc(code) + '" placeholder="\u2014\u2014\u2014\u2014\u2014\u2014" '
            + (JURY_CODES ? '' : 'disabled ') + '>'
            + '<button class="btn sec mini eq-tirer" data-eq="' + esc(m.id) + '" title="Tirer un code au hasard">\ud83c\udfb2</button>'
            + '<button class="btn sec mini eq-del" data-eq="' + esc(m.id) + '">Retirer</button>')
      + '</div>';
  });
  h += '<div class="eq-etat' + (JURY_ETAT.indexOf("\u2713") > -1 ? ' ok' : (JURY_ETAT ? ' ko' : '')) + '" id="eq-etat">'
    + esc(JURY_ETAT || (JURY_CODES ? "" : "Lecture des codes sur le serveur\u2026")) + '</div>';
  /* Le guichet des codes exige le jeton d'admin, qui dure 8 h. Passe ce delai,
     on redemande le code ICI plutot que d'envoyer Emmanuel ouvrir une fiche au
     hasard pour retrouver le seul champ qui savait le redemander. */
  if(!jetonEnvoi()){
    h += '<div style="margin-top:10px;display:flex;gap:10px;align-items:center">'
      + '<input id="eq-jeton" type="tel" inputmode="numeric" maxlength="6" '
      +   'placeholder="votre code admin" class="eq-code" style="width:150px!important">'
      + '<button class="btn sec mini" id="eq-jeton-go">Rouvrir la session</button>'
      + '</div>';
  }
  return h + '<div class="adm-save" style="gap:10px">'
    + '<button class="btn sec" id="eq-new">AJOUTER UNE PERSONNE</button>'
    + '<button class="btn" id="eq-save">ENREGISTRER L\u2019\u00c9QUIPE</button>'
    + '</div></div>';
}

/* Lecture des codes, une fois par ouverture de l'onglet. */
function chargerCodes(apres){
  var jt = jetonEnvoi();
  if(!jt){ JURY_CODES = {}; JURY_ETAT = "Session expir\u00e9e : rouvrez une fiche et retapez votre code pour g\u00e9rer les acc\u00e8s."; apres(); return; }
  fetch(ADM_JURES_URL, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ jeton: jt, action: "lire" })
  })
  .then(function(r){ return r.json(); })
  .then(function(j){
    JURY_CODES = (j && j.ok && j.codes) ? j.codes : {};
    JURY_ETAT  = (j && j.ok) ? "" : "Codes illisibles : " + ((j && j.err) || "guichet") + ".";
    apres();
  })
  .catch(function(){ JURY_CODES = {}; JURY_ETAT = "Guichet des codes injoignable."; apres(); });
}

function brancherEquipe(){
  if(!$("eq-save")) return;

  function lignes(){ return document.querySelectorAll("#adm-tab [data-eq].txrow"); }

  function recolter(){
    var o = {}, n = 0, rs = lignes();
    for(var i=0;i<rs.length;i++){
      var nom = (rs[i].querySelector(".eq-nom").value || "").trim();
      if(!nom) continue;
      o[rs[i].getAttribute("data-eq")] = { nom: nom, order: ++n };
    }
    return o;
  }
  function recolterCodes(){
    var o = {}, rs = lignes();
    for(var i=0;i<rs.length;i++){
      var ch = rs[i].querySelector(".eq-code");
      if(!ch) continue;
      o[rs[i].getAttribute("data-eq")] = (ch.value || "").replace(/[^0-9]/g, "");
    }
    return o;
  }
  function etat(txt, ok){
    JURY_ETAT = txt;
    var e = $("eq-etat");
    if(e){ e.textContent = txt; e.className = "eq-etat" + (ok ? " ok" : (txt ? " ko" : "")); }
  }
  function enregistrer(o, msg){
    CFG.equipe = o;
    cfgSave({ equipe:o }, msg || "\u00c9quipe enregistr\u00e9e \u2713");
  }

  /* Les noms vont dans Firebase, les codes sur le serveur. Deux destinations,
     un seul bouton : on n'annonce le succes que lorsque les DEUX ont repondu. */
  function toutEnregistrer(apres){
    /* GARDE-FOU. Tant que les codes n'ont pas ete LUS, les champs sont vides —
       les envoyer effacerait tous les acces d'un coup, sans que rien ne le
       signale. On n'ecrit jamais une liste qu'on n'a pas d'abord relue. */
    if(JURY_CODES === null){
      etat("Les codes sont encore en cours de lecture \u2014 attendez une seconde et r\u00e9essayez.", false);
      return;
    }
    var noms  = recolter();
    var codes = recolterCodes();
    for(var id in codes){
      if(codes[id] && codes[id].length !== 6){
        etat("Le code de " + membreNom(id) + " doit faire 6 chiffres, ou rester vide.", false);
        return;
      }
    }
    enregistrer(noms);
    var jt = jetonEnvoi();
    if(!jt){ etat("Noms enregistr\u00e9s, mais session expir\u00e9e : les codes n\u2019ont pas \u00e9t\u00e9 envoy\u00e9s.", false); return; }
    etat("Enregistrement des codes\u2026", false);
    fetch(ADM_JURES_URL, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ jeton: jt, action: "ecrire", codes: codes })
    })
    .then(function(r){ return r.json(); })
    .then(function(j){
      if(j && j.ok){
        JURY_CODES = codes;
        etat(j.n + " acc\u00e8s actif" + (j.n > 1 ? "s" : "") + " \u2713", true);
        if(apres) setTimeout(apres, 300);
        return;
      }
      var e = j && j.err, qui = (j && j.membre) ? membreNom(j.membre) : "";
      if(e === "meme_que_admin") etat("Le code de " + qui + " est votre code admin : il lui donnerait tous les droits. Refus\u00e9.", false);
      else if(e === "doublon")   etat("Deux personnes ont le m\u00eame code (" + qui + ") : on ne pourrait plus les distinguer.", false);
      else if(e === "format")    etat("Le code de " + qui + " doit faire exactement 6 chiffres.", false);
      else if(e === "auth")      etat("Session expir\u00e9e : rouvrez une fiche et retapez votre code.", false);
      else                       etat("Codes non enregistr\u00e9s (" + (e || "guichet") + ").", false);
    })
    .catch(function(){ etat("Guichet des codes injoignable : les noms sont enregistr\u00e9s, pas les codes.", false); });
  }

  $("eq-save").onclick = function(){ toutEnregistrer(null); };

  $("eq-new").onclick = function(){
    var o = recolter();
    JURY_CODES = recolterCodes();
    o["m" + Date.now().toString(36)] = { nom:"Nouveau", order:999 };
    enregistrer(o, "Personne ajout\u00e9e \u2713");
    setTimeout(tabAvis, 350);
  };

  var ts = document.querySelectorAll(".eq-tirer");
  for(var t=0;t<ts.length;t++) ts[t].onclick = function(){
    /* Un code tire au hasard vaut mieux qu'une date de naissance : c'est la
       limite d'essais du serveur qui protege, mais autant ne pas l'aider. */
    var r = new Uint32Array(1);
    if(window.crypto && crypto.getRandomValues) crypto.getRandomValues(r);
    else r[0] = Math.floor(Math.random() * 4294967296);
    var code = String(100000 + (r[0] % 900000));
    var l = this.parentNode.querySelector(".eq-code");
    if(l){ l.value = code; l.focus(); }
    etat("Code tir\u00e9 \u2014 cliquez ENREGISTRER pour le rendre actif.", false);
  };

  if($("eq-jeton-go")) $("eq-jeton-go").onclick = function(){
    var code = ($("eq-jeton").value || "").replace(/[^0-9]/g, "");
    if(code.length < 6){ etat("Il faut les 6 chiffres.", false); return; }
    this.disabled = true;
    etat("V\u00e9rification\u2026", false);
    fetch(ADM_PASS_URL, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code: code })
    })
    .then(function(r){ return r.json().then(function(j){ return { s:r.status, j:j }; }); })
    .then(function(res){
      if(res.j && res.j.ok && res.j.jeton){
        poserJeton(res.j.jeton);
        JURY_CODES = null; JURY_ETAT = "";
        tabAvis();
        return;
      }
      if(res.s === 429) etat("Trop d\u2019essais. R\u00e9essayez dans "
        + Math.ceil(((res.j && res.j.attendre) || 900) / 60) + " min.", false);
      else if(res.s === 401) etat("Code incorrect.", false);
      else etat("Le serveur d\u2019acc\u00e8s ne r\u00e9pond pas correctement.", false);
      var b = $("eq-jeton-go"); if(b) b.disabled = false;
    })
    .catch(function(){
      etat("Serveur d\u2019acc\u00e8s injoignable.", false);
      var b = $("eq-jeton-go"); if(b) b.disabled = false;
    });
  };

  var ds = document.querySelectorAll(".eq-del");
  for(var d=0;d<ds.length;d++) ds[d].onclick = function(){
    /* Retirer quelqu'un de la liste ne supprime PAS ses notes : elles restent
       dans les fiches, et sa colonne reapparaitrait si on le remettait. Son
       code, lui, dispara\u00eet — il ne doit plus pouvoir entrer. */
    var id = this.getAttribute("data-eq");
    var o = recolter(); delete o[id];
    enregistrer(o, "Personne retir\u00e9e \u2713");
    /* Meme garde : sans lecture prealable on ne renvoie pas la liste des codes,
       on se contente de retirer la personne de l'affichage. */
    if(JURY_CODES === null){ setTimeout(tabAvis, 350); return; }
    var cs = recolterCodes(); cs[id] = "";
    var jt = jetonEnvoi();
    if(jt) fetch(ADM_JURES_URL, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ jeton: jt, action: "ecrire", codes: cs })
    }).catch(function(){});
    JURY_CODES = cs;
    setTimeout(tabAvis, 350);
  };
}

/* ══════════════════════════════════════════════════════════════
   ONGLET EXTRAS
   ──────────────────────────────────────────────────────────────
   Une liste a part, volontairement. Un extra n'est pas un candidat au
   sens des postes salaries : ni le meme cadre, ni le meme engagement,
   ni les memes questions. Les melanger dans la liste des candidatures
   ferait perdre cette distinction — et c'est precisement celle qu'il
   faut pouvoir montrer si on la demande un jour.
   Les donnees vivent dans candidats/<id>/extra : le dossier de la
   personne reste entier, seule la LECTURE est separee.
   ══════════════════════════════════════════════════════════════ */
function extrasListe(){
  var L = [];
  for(var k in LAST_CAND){
    var c = LAST_CAND[k];
    if(!c || !c.extra) continue;
    c._k = k; L.push(c);
  }
  L.sort(function(a,b){ return (b.extra.maj || 0) - (a.extra.maj || 0); });
  return L;
}

function blocEssaiExtra(){
  /* GitHub Pages sert la page avec max-age=600 : pendant dix minutes le
     navigateur ressert sa copie sans rien demander au serveur. Un lien de test
     fixe rouvrait donc la VERSION PRECEDENTE de l'app, et on croyait la
     correction non deployee. Le parametre qui change a chaque affichage force
     une page neuve. Inutile pour les vrais candidats — ils cliquent des jours
     plus tard — mais indispensable quand on teste juste apres une livraison. */
  var url = location.origin + location.pathname + "?x=" + ADM_TEST_KEY
          + "&n=" + Date.now().toString(36);
  var h = '<div class="essai"><div class="essait">\ud83e\uddea Essayer le parcours extras</div>'
    + '<div class="dim">Ce lien ouvre les trois \u00e9crans sur la <b>fiche de test</b>, '
    + 'jamais sur un vrai candidat. Vos r\u00e9ponses d\u2019essai s\u2019affichent ci-dessous. '
    + 'Il change \u00e0 chaque affichage : c\u2019est ce qui \u00e9vite de rouvrir une version '
    + 'en cache juste apr\u00e8s une mise \u00e0 jour.</div>'
    + '<div style="margin-top:10px"><a class="lien" href="' + esc(url) + '" target="_blank" rel="noopener">'
    +   esc(url) + '</a></div>';
  var x = (XT_ESSAI && XT_ESSAI.extra) ? XT_ESSAI.extra : null;
  if(!x){
    return h + '<div class="dim" style="margin-top:10px">Aucun essai enregistr\u00e9 pour le moment.</div></div>';
  }
  var rs = x.refs || [];
  h += '<div class="xtg" style="margin-top:12px">'
    + kv("Statut", x.statut === "oui" ? "d\u00e9clar\u00e9 en place" : "d\u00e9clar\u00e9 absent")
    + kv("SIRET", x.siret ? esc(x.siret) : '<span class="dim">\u2014</span>')
    + kv("Moments", x.soirs ? esc(String(x.soirs).split("|").join(", ")) : '<span class="dim">\u2014</span>')
    + kv("Rythme", x.frequence ? esc(x.frequence) : '<span class="dim">\u2014</span>')
    + kv("Pr\u00e9venance", x.prevenance ? esc(x.prevenance) : '<span class="dim">\u2014</span>')
    + kv("Derri\u00e8re le bar", x.autonomie ? esc(x.autonomie) : '<span class="dim">\u2014</span>')
    + kv("R\u00e9f\u00e9rences", rs.length + " saisie" + (rs.length > 1 ? "s" : ""))
    + (x.mot ? kv("Mot", esc(x.mot)) : "")
    + '</div>'
    + '<button class="btn sec mini" id="xt-eff" style="margin-top:12px">Effacer cet essai</button>';
  return h + '</div>';
}

function brancherEssaiExtra(){
  if(!$("xt-eff")) return;

    if(!db) return;

      .catch(function(e){ toast("Non effac\u00e9 : " + e.message); });

}

/* Recherche : on aplatit TOUT le contenu textuel de la fiche, accents et casse
   neutralisés, et chaque mot tapé doit être présent (ET, pas OU). */
function aplat(x){
  return String(x == null ? "" : x)
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toLowerCase();
}
function meule(c){
  if(c._meule) return c._meule;
  var p = [c.prenom, c.nom, c.tel, c.email, c.anciennete, c.anciennete_metier, c.permis, c.transport,
           c.postes_vises, c.postes_codes, c.cv_nom,
           c.experiences, c.savoirs, c.pourquoi, c.portrait, c.mot, c.grille, c.statut,
           suiviDe(c.suivi_statut).n, c.relance_date, c.rdv_date];
  (c.quiz || []).forEach(function(q){ if(q){ p.push(q.q); p.push(q.r); } });
  (CFG.situations || []).forEach(function(s2, i){
    var v = (c.situations||"").split("|")[i];
    if(v !== undefined && v !== "" && s2.o) p.push(s2.o[Number(v)]);
  });
  histTab(c).forEach(function(e){ p.push(e && e.txt); });
  c._meule = aplat(p.filter(Boolean).join(" § "));
  return c._meule;
}

/* ══════════════════════════════════════════════════════════════
   SUIVI DES CANDIDATURES — appels, rendez-vous, historique
   ──────────────────────────────────────────────────────────────
   Le suivi vit ICI, à côté de la candidature qu'il commente : une seule
   source de vérité. Ce qui part vers Workspace, c'est une TÂCHE (rappeler
   untel, rendez-vous mardi 14 h), déposée dans /workspace_inbox et intégrée
   d'un clic — pas une copie de la fiche.
   ══════════════════════════════════════════════════════════════ */
var SUIVI = [
  { k:"nouveau",   n:"À traiter",     c:"" },
  { k:"a_rappeler",n:"À rappeler",    c:"wip" },
  { k:"appele",    n:"Appelé",        c:"" },
  { k:"rdv",       n:"RDV fixé",      c:"hot" },
  { k:"rencontre", n:"Rencontré",     c:"hot" },
  { k:"retenu",    n:"Retenu",        c:"hot" },
  { k:"sans_suite",n:"Sans suite",    c:"no" },
  { k:"ecarte",    n:"Écarté",        c:"no" }
];
function suiviDe(k){
  for(var i=0;i<SUIVI.length;i++) if(SUIVI[i].k === (k || "nouveau")) return SUIVI[i];
  return SUIVI[0];
}
function jourFR(d){
  if(!d) return "";
  var p = String(d).split("-");
  return p.length === 3 ? (p[2] + "/" + p[1]) : d;
}
function aujourdhui(){
  var d = new Date();
  return d.getFullYear() + "-" + ("0"+(d.getMonth()+1)).slice(-2) + "-" + ("0"+d.getDate()).slice(-2);
}
/* Agrandissement d'une photo. Un voile par-dessus tout, l'image au maximum de
   la place disponible, et on ferme au clic ou par Echap — comme la fiche. */
function photoPleinEcran(src, legende){
  if(!src) return;
  var o = el('<div class="photoz"><img alt=""><div class="pzl"></div></div>');
  o.querySelector("img").src = src;
  var l = o.querySelector(".pzl");
  if(legende) l.textContent = legende; else l.parentNode.removeChild(l);
  function ferme(){
    if(o.parentNode) o.parentNode.removeChild(o);
    document.removeEventListener("keydown", auClavier);
  }
  function auClavier(ev){ if(ev.key === "Escape") ferme(); }
  o.onclick = ferme;
  document.addEventListener("keydown", auClavier);
  document.body.appendChild(o);
}

function majCandidat(id, patch){
  if(!db) return Promise.reject(new Error("base de donnees indisponible"));
  if(!id)  return Promise.reject(new Error("fiche sans identifiant"));
  patch.suivi_maj = Date.now();
  return db.ref(FB_PATH + "/candidats/" + id).update(patch);
}

/* Firebase rend un TABLEAU quand les index sont 0,1,2... sans trou, et un
   OBJET des qu'il en manque un. Le meme champ revient donc sous deux formes
   selon l'historique de la fiche ; sans cette normalisation, un .forEach sur
   la seconde forme casse l'affichage de toute la fiche. */
function histTab(c){
  var h = (c && c.suivi_hist) || [];
  if(Array.isArray(h)) return h.filter(Boolean);
  var out = [];
  Object.keys(h).sort(function(a,b){ return Number(a) - Number(b); })
    .forEach(function(k){ if(h[k]) out.push(h[k]); });
  return out;
}

/* ══════════════════════════════════════════════════════════════
   BLOC SUIVI — tout s'enregistre au geste, rien n'attend un bouton
   ──────────────────────────────────────────────────────────────
   Jusqu'a la v5.7, cliquer une pastille ne faisait que la colorer : il
   fallait ensuite valider par un bouton. La pastille changeant d'aspect
   immediatement, l'interface donnait l'impression d'avoir enregistre —
   et rien ne partait. Aucune fiche n'a jamais porte de statut.
   Un statut se CHOISIT, il ne se valide pas : le clic EST l'action.
   Idem pour les dates. Seul le compte rendu garde un bouton, parce qu'on
   ecrit un texte et qu'on decide quand il part.
   L'affichage ne change qu'apres accord de la base ; en cas d'echec il
   revient a son etat d'avant et le message reste a l'ecran.
   ══════════════════════════════════════════════════════════════ */
function histHtml(c){
  var hist = histTab(c).slice().reverse();
  if(!hist.length) return "";
  var h = '<div class="pgrp" style="margin-top:18px">Historique</div>';
  hist.forEach(function(e){
    var d = new Date(e.ts || 0);
    h += '<div class="qa"><div class="qq">' + d.toLocaleDateString("fr-FR") + " à "
      + d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})
      + (e.st ? ' · ' + esc(suiviDe(e.st).n) : '') + '</div>'
      + (e.txt ? '<div class="ra" style="font-weight:400">' + nl2br(e.txt) + '</div>' : '') + '</div>';
  });
  return h;
}

    + '<div class="chips" id="sv-st">';
  SUIVI.forEach(function(s2){

/* ── branchements du bloc suivi (appelé après insertion dans le DOM) ── */
function brancherSuivi(c, racine){
  /* Le bloc de suivi n'est pas affiche aux jures (v6.0). Sans cette sortie,
     la suite dereferencait #sv-save qui n'existe pas, l'exception coupait
     admFiche AVANT le branchement du bouton Fermer et de la touche Echap :
     la fiche s'ouvrait et ne se refermait plus. Meme faute que d'oublier de
     debrancher le cablage quand on retire l'appareil. */
  if(!racine.querySelector("#sv-save")) return;
  var zone = racine.querySelector("#sv-err");
  var ch   = racine.querySelectorAll("#sv-st .chip");
  var occupe = false;

  function message(txt, genre, effacer){
    if(!zone) return;
    zone.className = "svmsg " + genre;
    zone.textContent = txt;
    if(effacer) setTimeout(function(){
      if(zone && zone.textContent === txt) zone.className = "svmsg hidden";
    }, 2500);
  }
  function peindre(k){
    for(var z=0;z<ch.length;z++) ch[z].classList.toggle("on", ch[z].getAttribute("data-sv") === k);
  }
  function rafraichirHist(){
    var box = racine.querySelector("#sv-hist");
    if(box) box.innerHTML = histHtml(c);
  }

  /* La fiche en memoire n'est modifiee qu'une fois la base d'accord. En cas
     d'echec, « retour » remet l'affichage exactement comme avant le geste. */
  function ecrire(patch, retour, texteOk){
    occupe = true;
    return majCandidat(c._k, patch).then(function(){
      Object.keys(patch).forEach(function(k){ c[k] = patch[k]; });
      message(texteOk, "ok", true);
      rafraichirHist();
      return true;
    }).catch(function(e){
      if(retour) retour();
      message("NON ENREGISTRÉ — " + ((e && e.message) ? e.message : e), "ko");
      return false;
    }).then(function(ok){ occupe = false; return ok; });
  }

  /* STATUT — le clic enregistre. */
  for(var i=0;i<ch.length;i++) ch[i].onclick = function(){
    if(occupe) return;
    var k = this.getAttribute("data-sv");
    if(!k) return;
    var ancien = c.suivi_statut || "nouveau";
    if(k === ancien) return;
    peindre(k);
    message("Enregistrement\u2026", "ok");
    var hist = histTab(c).slice();
    hist.push({ ts: Date.now(), st: k, txt: "" });
    ecrire({ suivi_statut: k, suivi_hist: hist },
           function(){ peindre(ancien); },
           "Statut enregistré ✓");
  };

  /* DATES ET HEURE — enregistrees des qu'elles changent. */
  [["#sv-rel","relance_date"],["#sv-rdvd","rdv_date"],["#sv-rdvh","rdv_heure"]].forEach(function(p){
    var champ = racine.querySelector(p[0]);
    if(!champ) return;
    champ.onchange = function(){
      if(occupe) return;
      var ancien = c[p[1]] || "";
      var patch = {}; patch[p[1]] = champ.value || "";
      ecrire(patch, function(){ champ.value = ancien; }, "Enregistré ✓");
    };
  });

  /* COMPTE RENDU — la seule chose qui garde un bouton. */
  var bt = racine.querySelector("#sv-save");
  bt.onclick = function(){
    if(occupe) return;
    var champ = racine.querySelector("#sv-note");
    var txt = (champ.value || "").trim();
    if(!txt){ message("Le compte rendu est vide : rien à ajouter.", "ko"); return; }
    bt.disabled = true;
    var hist = histTab(c).slice();
    hist.push({ ts: Date.now(), st: c.suivi_statut || "nouveau", txt: txt });
    ecrire({ suivi_hist: hist }, null, "Compte rendu ajouté ✓").then(function(ok){
      bt.disabled = false;
      if(ok) champ.value = "";
    });
  };

  racine.querySelector("#sv-ws").onclick = function(){
    var d = racine.querySelector("#sv-rdvd").value || racine.querySelector("#sv-rel").value;
    if(!d){ toast("Mettez d’abord une date de rendez-vous ou de rappel"); return; }
    var rdv = !!racine.querySelector("#sv-rdvd").value;
    var nom = ((c.prenom||"") + " " + (c.nom||"")).trim() || "candidat";
    envoyerWorkspace({
      kind: "task",
      label: (rdv ? "Rendez-vous recrutement — " : "Rappeler ") + nom,
      content: "Candidature LUMIIA · potentiel " + evalCandidat(c).total + "/100"
        + (c.tel ? "\nTél : " + c.tel : "") + (c.email ? "\nEmail : " + c.email : "")
        + "\nSuivi : " + suiviDe(choisi).n
        + (function(){ var h = histTab(c); return h.length ? "\nDernier échange : " + (h[h.length-1].txt || "—") : ""; })(),
      link: window.location.origin + window.location.pathname + "?admin",
      due: d,
      dueTime: rdv ? (racine.querySelector("#sv-rdvh").value || null) : null,
      prio: "normal"
    });
  };
}

function envoyerWorkspace(item){
  if(!db){ toast("Base indisponible"); return; }
  db.ref("workspace_inbox").push(item)
    .then(function(){ toast("Déposé dans Workspace — à intégrer d’un clic"); })
    .catch(function(e){ toast("Échec : " + e.message); });
}

/* ══════════ ONGLET SUIVI & RENDEZ-VOUS ══════════ */
function tabSuivi(){
  var arr = [];
  for(var k in LAST_CAND){ var o = LAST_CAND[k]; o._k = k; arr.push(o); }
  if(!arr.length){ panneau('<div class="adm-sec"><h2>Suivi</h2><p class="aide">Aucune candidature.</p></div>'); return; }
  var auj = aujourdhui();

  function ligne(c, dateAff, heure){
    var ev = evalCandidat(c), st = suiviDe(c.suivi_statut);
    var nom = ((c.prenom||"") + " " + (c.nom||"")).trim() || "—";
    var _h = histTab(c), dernier = _h.length ? (_h[_h.length-1].txt || "") : "";
    return '<tr data-k="' + c._k + '">'
      + '<td class="potc"><span class="pot ' + couleurPot(ev.total) + '">' + ev.total + '</span></td>'
      + '<td><b>' + esc(nom) + '</b><br><span class="dim mono">' + esc(c.tel||"") + '</span></td>'
      + '<td><span class="pill2 ' + st.c + '">' + esc(st.n) + '</span></td>'
      + '<td class="mono">' + esc(jourFR(dateAff)) + (heure ? ' · ' + esc(heure) : '') + '</td>'
      + '<td class="dim">' + esc((dernier||"").slice(0,90)) + '</td></tr>';
  }
  function table(titre, aide, lignes, vide){
    if(!lignes) return '<div class="adm-sec"><h2>' + esc(titre) + '</h2><p class="aide">' + esc(vide) + '</p></div>';
    return '<div class="adm-sec"><h2>' + esc(titre) + '</h2><p class="aide">' + aide + '</p>'
      + '<div class="adm-scroll"><table class="cmp"><thead><tr><th>Pot.</th><th>Candidat</th><th>Suivi</th><th>Quand</th><th>Dernier échange</th></tr></thead>'
      + '<tbody>' + lignes + '</tbody></table></div></div>';
  }

  var retard = "", aFaire = "", rdv = "", nR = 0, nF = 0, nV = 0;
  arr.slice().sort(function(a,b){ return (a.relance_date||"9") < (b.relance_date||"9") ? -1 : 1; }).forEach(function(c){
    if(!c.relance_date) return;
    if(["retenu","ecarte","sans_suite"].indexOf(c.suivi_statut) > -1) return;
    if(c.relance_date < auj){ retard += ligne(c, c.relance_date); nR++; }
    else { aFaire += ligne(c, c.relance_date); nF++; }
  });
  arr.slice().sort(function(a,b){ return (a.rdv_date||"9") < (b.rdv_date||"9") ? -1 : 1; }).forEach(function(c){
    if(!c.rdv_date) return;
    rdv += ligne(c, c.rdv_date, c.rdv_heure); nV++;
  });

  /* à traiter : jamais ouverts, les meilleurs d'abord */
  var neufs = arr.filter(function(c){ return !c.suivi_statut || c.suivi_statut === "nouveau"; });
  neufs.forEach(function(c){ c._ev = evalCandidat(c); });
  neufs.sort(function(a,b){ return b._ev.total - a._ev.total; });
  var nh = "";
  neufs.slice(0, 15).forEach(function(c){ nh += ligne(c, ""); });

  var h = '<div class="adm-sec"><h2>Où en est le recrutement</h2><div class="stats">'
    + '<div class="stat"><div class="sv">' + nR + '</div><div class="sl">rappels en retard</div></div>'
    + '<div class="stat"><div class="sv">' + nF + '</div><div class="sl">rappels à venir</div></div>'
    + '<div class="stat"><div class="sv">' + nV + '</div><div class="sl">rendez-vous programmés</div></div>'
    + '<div class="stat"><div class="sv">' + neufs.length + '</div><div class="sl">jamais ouverts</div></div>'
    + '</div></div>'
    + table("En retard", "Ces rappels étaient prévus avant aujourd’hui.", retard, "Rien en retard.")
    + table("Rappels à venir", "Par date de prochaine action.", aFaire, "Aucun rappel programmé.")
    + table("Rendez-vous", "Les rencontres fixées, dans l’ordre.", rdv, "Aucun rendez-vous fixé.")
    + table("À traiter en priorité", "Candidatures jamais ouvertes, les meilleurs potentiels en premier.", nh, "Tout a été traité.");

  panneau(h);
  var trs = document.querySelectorAll("#adm-tab tr[data-k]");
  for(var i=0;i<trs.length;i++) trs[i].onclick = function(){ admFiche(LAST_CAND[this.getAttribute("data-k")]); };
}

/* ══════════ ONGLET STATISTIQUES ══════════ */
function tabStats(){
  var arr = [];
  for(var k in LAST_CAND){ var o = LAST_CAND[k]; o._k = k; arr.push(o); }
  if(!arr.length){ panneau('<div class="adm-sec"><h2>Statistiques</h2><p class="aide">Aucune candidature pour le moment.</p></div>'); return; }

  var complets = arr.filter(function(c){ return c.statut === "complet"; });
  var pots = arr.map(function(c){ return evalCandidat(c).total; }).sort(function(a,b){ return a-b; });
  var moy = Math.round(pots.reduce(function(a,b){ return a+b; },0) / pots.length);
  var med = pots[Math.floor(pots.length/2)];
  var avecMedia = arr.filter(function(c){ return c.pitch1_url || c.pitch2_url || c.pitch3_url || c.pitch4_url || c.motmedia_url; }).length;
  var veutOffre = arr.filter(function(c){ return c.offre_mail; }).length;

  function tuile(v, l, sub){
    return '<div class="stat"><div class="sv">' + v + '</div><div class="sl">' + esc(l) + '</div>'
      + (sub ? '<div class="ss">' + esc(sub) + '</div>' : '') + '</div>';
  }
  var h = '<div class="adm-sec"><h2>Vue d’ensemble</h2>'
    + '<p class="aide">Cet onglet <b>observe</b>, il ne règle rien. Tout ce qui s’y affiche est en lecture seule : '
    + 'ce sont les candidatures reçues, comptées. Pour modifier la valeur des critères, c’est l’onglet '
    + '<b>Potentiel</b>.</p><div class="stats">'
    + tuile(arr.length, "candidatures")
    + tuile(complets.length, "terminées", Math.round(complets.length/arr.length*100) + " % du total")
    + tuile(arr.length - complets.length, "abandons en route")
    + tuile(moy, "potentiel moyen", "médiane " + med)
    + tuile(avecMedia, "avec un enregistrement")
    + tuile(veutOffre, "veulent l’offre par mail")
    + '</div></div>';

  /* — entonnoir : où les gens s'arrêtent — */
  var LBL = ["Contact","Parcours","Savoir-faire","Situations","Vous","Pitchs","Rappel"];
  var atteint = [0,0,0,0,0,0,0];
  arr.forEach(function(c){
    var e = Math.max(1, Math.min(7, c.etape || 1));
    for(var i=0;i<e;i++) atteint[i]++;
  });
  h += '<div class="adm-sec"><h2>Où les candidats s’arrêtent</h2>'
    + '<p class="aide">Nombre de candidats ayant atteint chaque étape. La colonne rouge indique combien '
    + 'se sont arrêtés là. Une chute marquée signale une étape à alléger.</p>';
  LBL.forEach(function(l, i){
    var pc = Math.round(atteint[i] / arr.length * 100);
    var perdu = i > 0 ? atteint[i-1] - atteint[i] : 0;
    h += '<div class="brow"><span class="bl">' + (i+1) + '. ' + esc(l) + '</span>'
      + '<span class="bb"><i style="width:' + pc + '%"></i></span>'
      + '<span class="bn">' + atteint[i] + '</span>'
      + '<span class="bp">' + (perdu ? "− " + perdu : "") + '</span></div>';
  });
  h += '</div>';

  /* — répartition des potentiels — */
  var tr = [0,0,0,0,0], TRL = ["0 – 19","20 – 39","40 – 59","60 – 79","80 – 100"];
  pots.forEach(function(p){ tr[Math.min(4, Math.floor(p/20))]++; });
  h += '<div class="adm-sec"><h2>Répartition des potentiels</h2>'
    + '<p class="aide">Combien de candidatures dans chaque tranche de note. Une pile concentrée en bas '
    + 'signale un barème trop sévère, une pile concentrée en haut un barème qui ne trie plus rien.</p>';
  var maxTr = Math.max.apply(null, tr) || 1;
  TRL.forEach(function(l, i){
    h += '<div class="brow"><span class="bl">' + l + '</span>'
      + '<span class="bb"><i style="width:' + Math.round(tr[i]/maxTr*100) + '%"></i></span>'
      + '<span class="bn">' + tr[i] + '</span><span class="bp"></span></div>';
  });
  h += '</div>';

  /* — palmarès des réponses — */
  function palmares(titre, cle, sep, poids){
    var cpt = {};
    arr.forEach(function(c){
      (c[cle]||"").split(sep).filter(Boolean).forEach(function(x){ cpt[x] = (cpt[x]||0) + 1; });
    });
    var l = Object.keys(cpt).map(function(k){ return { k:k, n:cpt[k] }; })
      .sort(function(a,b){ return b.n - a.n; }).slice(0, 10);
    if(!l.length) return "";
    var mx = l[0].n;
    var o = '<div class="adm-sec"><h2>' + esc(titre) + '</h2>'
      + '<p class="aide">Nombre de candidats ayant coché chaque ligne, sur ' + arr.length + ' candidature'
      + (arr.length > 1 ? 's' : '') + '.'
      + (poids ? ' La pastille grise rappelle la valeur du critère, réglée dans l’onglet Potentiel — '
        + 'un critère très coché mais peu valorisé ne trie rien.' : '') + '</p>'
      + '<div class="brow bhead"><span class="bl">Critère' + (poids ? ' · valeur' : '') + '</span>'
      + '<span class="bb"></span><span class="bn">Candidats</span><span class="bp"></span></div>';
    l.forEach(function(x){
      o += '<div class="brow"><span class="bl">' + esc(x.k)
        + (poids ? ' <span class="cpt">vaut ' + (poids[x.k]||0) + '</span>' : '') + '</span>'
        + '<span class="bb"><i style="width:' + Math.round(x.n/mx*100) + '%"></i></span>'
        + '<span class="bn">' + x.n + '</span><span class="bp"></span></div>';
    });
    return o + '</div>';
  }
  var S2 = SC();
  h += palmares("Expériences les plus déclarées", "experiences", "|", S2.exp);
  h += palmares("Savoir-faire les plus cochés", "savoirs", "|", S2.sav);
  h += palmares("Créneaux de rappel les plus demandés", "grille", "|", null);

  /* — permis — */
  var pm = { "Oui":0, "En cours":0, "Non":0, "—":0 };
  arr.forEach(function(c){ pm[c.permis || "—"] = (pm[c.permis || "—"] || 0) + 1; });
  h += '<div class="adm-sec"><h2>Permis B</h2><div class="stats">'
    + tuile(pm["Oui"], "oui") + tuile(pm["En cours"], "en cours")
    + tuile(pm["Non"], "non") + tuile(pm["—"], "non renseigné")
    + '</div></div>';

  panneau(h);
}

/* ══════════ ONGLET POTENTIEL (les poids) ══════════ */
/* Un champ nombre encadré de deux boutons : au doigt, on ne vise pas les flèches
   minuscules du navigateur, et on voit tout de suite que la valeur se règle. */
function molette(champ){
  return '<span class="mol"><button type="button" class="mm" data-pas="-1">−</button>'
    + champ + '<button type="button" class="mm" data-pas="1">+</button></span>';
}
function brancherMolettes(){
  var bs = document.querySelectorAll("#adm-tab .mm");
  for(var i=0;i<bs.length;i++) bs[i].onclick = function(){
    var pas = +this.getAttribute("data-pas");
    var inp = pas < 0 ? this.nextElementSibling : this.previousElementSibling;
    if(!inp) return;
    var mx = +inp.getAttribute("max") || 20;
    inp.value = Math.max(0, Math.min(mx, (+inp.value || 0) + pas));
  };
}
function tabPotentiel(){
  var S2 = JSON.parse(JSON.stringify(SC()));
  var h = '<div class="adm-sec"><h2>Comment le potentiel est calculé</h2>'

    + 'sont comptés : cocher toute la liste ne rapporte rien de plus que cocher les bonnes cases. '
    + 'Le total est ramené sur 100. <b>Ce score n’élimine personne</b> — il range la pile, la décision reste la vôtre.</p>'
    + '<div class="fgrid">'
    + '<div class="txrow"><label class="f">Expériences comptées</label><input type="number" min="1" max="8" data-sc="top_exp" value="' + S2.top_exp + '"></div>'
    + '<div class="txrow"><label class="f">Savoir-faire comptés</label><input type="number" min="1" max="12" data-sc="top_sav" value="' + S2.top_sav + '"></div>'
    + '</div></div>';

  function bloc(titre, aide, obj, prefixe){
    var o = '<div class="adm-sec"><h2>' + esc(titre) + '</h2>'
      + (aide ? '<p class="aide">' + aide + '</p>' : '') + '<div class="pgrid">';
    Object.keys(obj).forEach(function(k){
      o += '<div class="prow"><span class="pl">' + esc(k) + '</span>' + molette(

/* ── TABLEAU COMPARATIF ── */
function admCandidats(){
  if(!$("a-cand")) return;
  var arr = [];
  for(var k in LAST_CAND){ var o = LAST_CAND[k]; o._k = k; arr.push(o); }
  if(ADM_FILTRE.indexOf("sv:") === 0){
    var sv = ADM_FILTRE.slice(3);
    arr = arr.filter(function(c){ return (c.suivi_statut || "nouveau") === sv; });
  } else if(ADM_FILTRE !== "tous"){
    arr = arr.filter(function(c){ return (c.statut||"") === ADM_FILTRE; });
  }
  var mots = aplat(ADM_Q).split(/\s+/).filter(Boolean);
  if(mots.length){
    arr = arr.filter(function(c){
      var m = meule(c);
      for(var i=0;i<mots.length;i++) if(m.indexOf(mots[i]) === -1) return false;
      return true;
    });
  }
  arr.forEach(function(c){ c._ev = evalCandidat(c); });
  arr.sort(function(a,b){
    if(ADM_TRI === "potentiel") return b._ev.total - a._ev.total;
    if(ADM_TRI === "score") return (b.score||0) - (a.score||0);
    if(ADM_TRI === "savoirs") return nb(b.savoirs) - nb(a.savoirs);
    if(ADM_TRI === "exp") return nb(b.experiences) - nb(a.experiences);
    return (b.maj||b.ts||0) - (a.maj||a.ts||0);
  });
  if(!arr.length){ $("a-cand").innerHTML = '<p class="aide">Aucune candidature ne correspond' + (ADM_Q ? ' à « ' + esc(ADM_Q) + ' »' : ' à ce filtre') + '.</p>'; return; }

  var maxSc = 1; arr.forEach(function(c){ maxSc = Math.max(maxSc, c.score||0); });
  var nSav = (CFG.savoirs||[]).length || 12;
  var nExpT = (CFG.experiences||[]).length || 20;

  /* ARCHIVES. Les ecartes et les sans-suite ne disparaissent pas, ils descendent :
     un dossier ferme reste consultable, mais il n'a plus a occuper le regard
     au-dessus des gens qu'on est en train de traiter. Meme regle que dans la
     Revue, qui les retire deja de la pile.
     Deux exceptions : quand on filtre explicitement sur l'un de ces statuts, et
     quand une recherche est en cours — chercher quelqu'un et ne pas le trouver
     parce qu'il etait dans un bloc replie, c'est un piege. */
  var ARCH = ["ecarte","sans_suite"];
  var separer = !(ADM_FILTRE === "sv:ecarte" || ADM_FILTRE === "sv:sans_suite");
  var actifs = arr, archives = [];
  if(separer){
    actifs = [];
    arr.forEach(function(c){
      (ARCH.indexOf(c.suivi_statut || "nouveau") > -1 ? archives : actifs).push(c);
    });
  }

  function tableCand(liste){
    var h = '<table class="cmp"><thead><tr>'
    + '<th data-tri="potentiel">Potentiel ↕</th><th>Profil</th>'
    + '<th>Statut</th><th>Suivi</th><th>Messages envoy\u00e9s</th><th>Prochaine action</th>'
    + '<th>Candidat</th><th>Contact</th>'
    + '<th data-tri="exp">Expérience ↕</th><th data-tri="savoirs">Savoir-faire ↕</th>'
    + '<th>Poste</th><th>Situations</th><th>Rappel</th><th>Permis</th><th>Enreg.</th><th>Offre&nbsp;mail</th>'
    + '<th data-tri="score">Jeu ↕</th><th data-tri="ts">Mise à jour ↕</th></tr></thead><tbody>';
    liste.forEach(function(c){
    var complet = (c.statut === "complet");
    var e = nb(c.experiences), sv = nb(c.savoirs);
    var sit = (c.situations||"").split("|").filter(function(x){ return x !== ""; });
    var cre = (c.grille||"").split("|").filter(Boolean);
    var pvis = (c.postes_codes||"").split("|").filter(Boolean);
    var soirs = cre.filter(function(x){ return x.indexOf("Soir") > -1; }).length;
    var nMed = ["pitch1","pitch2","pitch3","pitch4","motmedia","media"].filter(function(s2){ return c[s2 + "_url"]; }).length;
    var d = new Date(c.maj || c.ts || 0);
    var ev = c._ev, AX = ["metier","terrain","posture","engagement","praticite"];
    var mini = '';
    AX.forEach(function(a){
      var v = Math.min(100, Math.round(ev.axes[a] / Math.max(1, maxAxe(a)) * 100));
      mini += '<span class="ax" title="' + a + '"><i style="height:' + Math.max(6, v) + '%"></i></span>';
    });
    h += '<tr data-k="' + c._k + '">'
      + '<td class="potc"><span class="pot ' + couleurPot(ev.total) + '">' + ev.total + '</span></td>'
      + '<td><span class="axes">' + mini + '</span></td>'
      + '<td><span class="pill2 ' + (complet ? "hot" : "wip") + '">' + (complet ? "complète" : ("étape " + (c.etape||1))) + '</span></td>'
      + '<td><span class="pill2 ' + suiviDe(c.suivi_statut).c + '">' + esc(suiviDe(c.suivi_statut).n) + '</span></td>'
      + '<td>' + envoisCell(c) + '</td>'
      + '<td class="mono">' + (c.rdv_date ? '<b>RDV ' + esc(jourFR(c.rdv_date)) + (c.rdv_heure ? " " + esc(c.rdv_heure) : "") + '</b>'
          : (c.relance_date ? esc(jourFR(c.relance_date)) : '<span class="dim">—</span>')) + '</td>'
      + '<td><div class="qui">'
      +   (c.photo ? '<img class="vign" src="' + c.photo + '" data-nom="' + esc(nomComplet(c)) + '" alt="">' : '<span class="vign vide">—</span>')
      +   '<span><b>' + esc(nomComplet(c)) + '</b><br><span class="dim">' + esc(c.anciennete_metier||c.anciennete||"") + '</span>'
      +   (c.cv_url ? '<br><a class="lien" href="' + esc(c.cv_url) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">📎 CV</a>' : '')
      +   '</span></div></td>'
      + '<td><span class="mono">' + esc(c.tel||"—") + '</span><br><span class="dim">' + esc(c.email||"") + '</span></td>'
      + '<td><div class="cbar"><i style="width:' + Math.round(e/nExpT*100) + '%"></i></div><span class="dim">' + e + ' / ' + nExpT + '</span></td>'
      + '<td><div class="cbar"><i style="width:' + Math.round(sv/nSav*100) + '%"></i></div><span class="dim">' + sv + ' / ' + nSav + '</span></td>'
      + '<td>' + (pvis.length ? pvis.map(function(x){ return '<span class="pill2 hot">' + esc(x) + '</span>'; }).join(" ") : '<span class="dim">—</span>') + '</td>'
      + '<td>' + (sit.length ? sit.map(function(x){ return '<span class="pill2">' + "ABCDEFGH".charAt(Number(x)) + '</span>'; }).join(" ") : '<span class="dim">—</span>') + '</td>'
      + '<td>' + (cre.length ? ('<b>' + cre.length + '</b> créneaux<br><span class="dim">dont ' + soirs + ' soirs</span>') : '<span class="dim">—</span>') + '</td>'
      + '<td><span class="pill2 ' + (c.permis === "Oui" ? "hot" : (c.permis === "Non" ? "no" : "wip")) + '">' + esc(c.permis||"—") + '</span></td>'
      + '<td>' + (nMed ? '<b>' + nMed + '</b>' : '<span class="dim">—</span>') + '</td>'
      + '<td>' + (c.offre_mail ? '<span class="pill2 hot">oui</span>' : '<span class="dim">—</span>') + '</td>'
      + '<td><div class="cbar"><i style="width:' + Math.round((c.score||0)/maxSc*100) + '%"></i></div><span class="dim">' + (c.score||0) + '</span></td>'
      + '<td class="dim mono">' + d.toLocaleDateString("fr-FR") + '<br>' + d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}) + '</td></tr>';
    });
    return h + '</tbody></table>';
  }

  var h = (actifs.length ? tableCand(actifs)
    : '<p class="aide">Aucune candidature active' + (archives.length ? ' \u2014 tout est en archives.' : '.') + '</p>')
    + '<p class="aide">Tri\u00e9 par potentiel d\u00e9croissant. Les cinq barres donnent le profil : '
    + 'm\u00e9tier, terrain, posture, engagement, praticit\u00e9. Le potentiel n\u2019\u00e9limine personne, il range la pile \u2014 '
    + 'les poids se r\u00e8glent dans l\u2019onglet Potentiel. Cliquez une ligne pour ouvrir la fiche compl\u00e8te. '
    + 'La photo n\u2019appara\u00eet pas dans ce tableau : elle sert \u00e0 reconna\u00eetre la personne le jour de l\u2019entretien, pas \u00e0 comparer.</p>';

  if(archives.length){
    var ouvert = ADM_ARCH || !!ADM_Q;
    h += '<div class="archbloc">'
      + '<button class="archbtn" id="a-arch">' + (ouvert ? "\u25be" : "\u25b8") + ' Archives \u00b7 '
      +   archives.length + ' dossier' + (archives.length > 1 ? 's' : '') + ' \u00e9cart\u00e9'
      +   (archives.length > 1 ? 's' : '') + ' ou sans suite'
      +   (ADM_Q ? ' <span class="dim">(ouvert : recherche en cours)</span>' : '')
      + '</button>'
      + (ouvert ? '<div class="archin">' + tableCand(archives) + '</div>' : '')
      + '</div>';
  }

  $("a-cand").innerHTML = h;

  var trs = $("a-cand").querySelectorAll("tr[data-k]");
  for(var i=0;i<trs.length;i++) trs[i].onclick = function(){ admFiche(LAST_CAND[this.getAttribute("data-k")]); };
  if($("a-arch")) $("a-arch").onclick = function(){ ADM_ARCH = !ADM_ARCH; admCandidats(); };
  var ths = $("a-cand").querySelectorAll("th[data-tri]");
  for(var j=0;j<ths.length;j++) ths[j].onclick = function(){ ADM_TRI = this.getAttribute("data-tri"); admCandidats(); };
  brancherPhotosZoom($("a-cand"));
}

/* ══════════════════════════════════════
   FICHE CANDIDAT — panneau opaque, tout est affiché
   ══════════════════════════════════════ */
function admFiche(c){
  if(!c) return;

  function esc2(v){ return esc(v == null ? "" : v); }
  function dt(ms){
    if(!ms) return "—";
    var d = new Date(ms);
    return d.toLocaleDateString("fr-FR") + " à " + d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
  }
  function pills(v, cls){
    var a = (v||"").split("|").filter(Boolean);
    if(!a.length) return '<span class="dim">—</span>';
    return a.map(function(x){ return '<span class="pill2 ' + (cls||"") + '">' + esc(x) + '</span>'; }).join(" ");
  }
  function boite(titre, contenu, cls){
    return '<div class="fbox' + (cls ? " " + cls : "") + '"><div class="stepno">'
      + titre + '</div>' + contenu + '</div>';
  }
  /* Une liste de cases cochees ne dit que la moitie de l'histoire. Voir en face
     ce qui n'a PAS ete coche evite de croire qu'une competence manque alors
     qu'elle n'a jamais ete proposee — et fait ressortir les vrais trous. */
  function pillsComp(v, ref, cls){
    var pris = (v || "").split("|").filter(Boolean);
    var tout = (ref || []).slice();
    var abs = tout.filter(function(x){ return pris.indexOf(x) === -1; });
    var h = pris.length
      ? pris.map(function(x){ return '<span class="pill2 ' + (cls||"") + '">' + esc(x) + '</span>'; }).join(" ")
      : '<span class="dim">rien de coché</span>';
    if(abs.length){
      h += '<div class="pnon"><div class="pnont">Non coché — ' + abs.length + ' sur ' + tout.length + '</div>'
        + abs.map(function(x){ return '<span class="pill2 off">' + esc(x) + '</span>'; }).join(" ") + '</div>';
    }
    return h;
  }
  function ligne(k, v){
    return '<div class="kv"><span class="kk">' + esc(k) + '</span><span class="kvv">' + (v || '<span class="dim">—</span>') + '</span></div>';
  }
  function texte(t, v){
    return '<div style="margin-top:12px"><div class="kk">' + esc(t) + '</div>'
      + (v ? '<div class="quote">' + nl2br(v) + '</div>' : '<div class="dim">—</div>') + '</div>';
  }

  /* ── suivi ── */
  var suivi = ligne("Statut", '<span class="pill2 ' + (c.statut === "complet" ? "hot" : "wip") + '">'
        + (c.statut === "complet" ? "candidature complète" : "abandon — étape " + (c.etape||1)) + '</span>')
    + ligne("Étape atteinte", (c.etape || 1) + " / 7")
    + ligne("Commencée le", esc2(dt(c.ts)))
    + ligne("Dernière modification", esc2(dt(c.maj)))
    + ligne("Envoyée le", c.envoye ? esc2(dt(c.envoye)) : '<span class="dim">pas encore envoyée</span>')
    + ligne("Parcours", esc2(c.parcours === "jour" ? "JOUR — atelier" : "NUIT — bar & accueil"))
    + ligne("Référence", '<span class="mono">' + esc2(c._k) + '</span>');

  /* ── profil ── */
  var mrev = revMoyenne(c);
  var profil = ligne("Poste visé", pills(c.postes_vises, "hot"))
    + ligne("CV", c.cv_url
        ? '<a class="lien" href="' + esc2(c.cv_url) + '" target="_blank" rel="noopener">' + esc2(c.cv_nom || "ouvrir le document") + '</a>'
        : '<span class="dim">aucun</span>')
    + ligne("Notes de revue", mrev
        ? ('<b>' + mrev.moy + ' / 5</b> <span class="dim">' + mrev.n + ' note' + (mrev.n > 1 ? 's' : '')
           + ' de ' + mrev.voix + ' personne' + (mrev.voix > 1 ? 's' : '') + '</span>')
        : '<span class="dim">pas encore notée</span>')
    + ligne("Ancienneté générale", esc2(c.anciennete))
    + ligne("Expérience dans le métier", esc2(c.anciennete_metier))
    + ligne("Permis B", '<span class="pill2 ' + (c.permis === "Oui" ? "hot" : (c.permis === "Non" ? "no" : "wip")) + '">' + esc2(c.permis || "—") + '</span>')
    + ligne("Moyen de transport", esc2(c.transport))
    + ligne("Veut l’offre par mail", c.offre_mail
        ? '<span class="pill2 hot">oui</span>'
        : '<span class="pill2">non</span>');

  /* ── quiz ── */
  var qh = "";
  (c.quiz || []).forEach(function(q, i){
    if(!q) return;
    qh += '<div class="qa"><div class="qq">' + (i+1) + '. ' + esc2(q.q) + '</div>'
       + (q.r ? '<div class="ra">' + nl2br(q.r) + '</div>' : '<div class="dim">sans réponse</div>') + '</div>';
  });
  if(!qh) qh = '<span class="dim">—</span>';

  /* ── mises en situation ── */
  var sit = (c.situations||"").split("|"), sh = "";
  (CFG.situations||[]).forEach(function(s2, i){
    if(sit[i] === undefined || sit[i] === "") return;
    sh += '<div class="qa"><div class="qq">' + (i+1) + '. ' + esc2(s2.q) + '</div>'
       + '<div class="ra">' + esc2(s2.o[Number(sit[i])] || "?") + '</div></div>';
  });
  if(!sh) sh = '<span class="dim">—</span>';

  /* ── créneaux de rappel, en grille ── */
  var CRE = ["Matin","Après-midi","Soir"], JRS = ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
  var g = c.grille || "";
  var gh = '<table class="gr"><tr><th></th>';
  CRE.forEach(function(x){ gh += '<th>' + x + '</th>'; });
  gh += '</tr>';
  JRS.forEach(function(j){
    gh += '<tr><th class="jr">' + j + '</th>';
    CRE.forEach(function(x){
      var on = g.indexOf(j + "-" + x) > -1;
      gh += '<td class="' + (on ? "oui" : "non") + '">' + (on ? "✓" : "") + '</td>';
    });
    gh += '</tr>';
  });
  gh += '</table>';
  var nbCre = g.split("|").filter(Boolean).length;

  /* ── enregistrements ── */
  var LECTEURS = [
    { k:"pitch1",   t:(CFG.pitchs||[])[0] || "Pitch 1" },
    { k:"pitch2",   t:(CFG.pitchs||[])[1] || "Pitch 2" },
    { k:"pitch3",   t:(CFG.pitchs||[])[2] || "Pitch 3" },
    { k:"pitch4",   t:(CFG.pitchs||[])[3] || "Pitch 4" },
    { k:"motmedia", t:"Un dernier mot" },
    { k:"media",    t:"Enregistrement (candidature d’avant la v2.8)" }
  ];
  var med = "";
  LECTEURS.forEach(function(L){
    var u = c[L.k + "_url"]; if(!u) return;
    med += '<div class="qa"><div class="qq">' + esc(L.t) + '</div>'
      + (c[L.k + "_type"] === "video"
          ? '<video src="' + esc(u) + '" controls playsinline style="max-width:100%;border-radius:8px;margin-top:6px"></video>'
          : '<audio src="' + esc(u) + '" controls style="width:100%;margin-top:6px"></audio>')
      + '<div style="margin-top:4px"><a class="lien" href="' + esc(u) + '" target="_blank" rel="noopener">ouvrir dans un onglet</a></div></div>';
  });
  if(!med) med = '<span class="dim">aucun enregistrement</span>';

  /* ── jeu ── */
  var jh = "";
  (c.jeux || []).forEach(function(j){
    var nm = GAMES[j.jeu] ? GAMES[j.jeu].nom : j.jeu;
    jh += ligne(nm, '<b>' + (j.points||0) + '</b> points' + (j.essais > 1 ? ' <span class="dim">(' + j.essais + ' essais)</span>' : ''));
  });
  jh = ligne("Score total", '<b>' + (c.score||0) + '</b> points') + jh;

  /* — potentiel, expliqué ligne par ligne — */
  var ev = evalCandidat(c);
  var AXL = { metier:"Métier", terrain:"Terrain", posture:"Posture", engagement:"Engagement", praticite:"Praticité" };
  var ph = '<div class="potbig"><span class="pot ' + couleurPot(ev.total) + '">' + ev.total + '</span>'
    + '<span class="potl">sur 100<br><span class="dim">' + ev.brut + ' points bruts</span></span></div>';
  Object.keys(AXL).forEach(function(a){
    var v = Math.min(100, Math.round(ev.axes[a] / Math.max(1, maxAxe(a)) * 100));
    ph += '<div class="brow"><span class="bl">' + AXL[a] + '</span>'
      + '<span class="bb"><i style="width:' + v + '%"></i></span>'
      + '<span class="bn">' + ev.axes[a] + '</span><span class="bp"></span></div>';
  });
  ph += '<details class="pdet"><summary>Voir le détail des points</summary>';
  Object.keys(AXL).forEach(function(a){
    var l = ev.detail.filter(function(d){ return d.axe === a; });
    if(!l.length) return;
    ph += '<div class="pgrp">' + AXL[a] + '</div>';
    l.forEach(function(d){ ph += '<div class="kv"><span class="kk">' + esc(d.l) + '</span><span class="kvv">' + (d.p ? "+" + d.p : "0") + '</span></div>'; });
  });
  ph += '</details>';

  var nExp = (c.experiences||"").split("|").filter(Boolean).length;
  var nSav = (c.savoirs||"").split("|").filter(Boolean).length;

  var f = el('<div class="fiche"><div class="inner"></div></div>');
  f.querySelector(".inner").innerHTML =
      '<div class="fhead">'
    + (c.photo ? '<img class="fphoto" src="' + c.photo + '" data-nom="' + esc2(nomComplet(c)) + '" alt="">' : '<div class="fphoto vide">—</div>')
    + '<div class="fid"><h3>' + esc2(nomComplet(c)) + '</h3>'
    + '<div class="fcoord">'
    + (c.tel ? '<a class="lien" href="tel:' + esc2(c.tel) + '">' + esc2(c.tel) + '</a>' : '<span class="dim">pas de téléphone</span>')
    + (c.email ? ' &nbsp;·&nbsp; <a class="lien" href="mailto:' + esc2(c.email) + '">' + esc2(c.email) + '</a>' : '')
    + '</div></div>'
    + '<button class="btn sec fclose" id="fi-x">Fermer</button></div>'

    /* Un jure lit le dossier en entier — c'est ce qu'on lui demande de juger —
       mais n'y trouve aucun levier : ni statut, ni rendez-vous, ni message.
       Les regles de la base ne peuvent pas l'imposer ici : l'ecriture dans
       /recrutement/candidats doit rester ouverte pour que les candidats
       eux-memes puissent deposer et completer leur dossier. C'est donc une
       retenue d'interface, et elle est assumee comme telle. */
    + boite("Impression g\u00e9n\u00e9rale", blocImpression(c), "act")
    + (estAdmin() ? boite("Suivi — appels et rendez-vous", blocSuivi(c)) : "")
    + (estAdmin() ? boite("Envoyer un message", blocEnvoi(c), "act") : "")
    + boite("Potentiel", ph)
    + '<div class="fgrid">'
    +   boite("Suivi de la candidature", suivi)
    +   boite("Profil", profil)
    + '</div>'

    + boite("Expériences déclarées <span class=\"cpt\">" + nExp + " / " + ((CFG.experiences||[]).length||20) + "</span>",
        pillsComp(c.experiences, CFG.experiences, "hot"))
    + boite("Savoir-faire cochés <span class=\"cpt\">" + nSav + " / " + ((CFG.savoirs||[]).length||12) + "</span>",
        pillsComp(c.savoirs, CFG.savoirs))
    + boite("Réponses au quiz", qh)
    + boite("Mises en situation", sh)
    + boite("Ce qu’il ou elle écrit",
        texte("Pourquoi LUMIIA", c.pourquoi) + texte("Ce que les gens disent de lui / d’elle", c.portrait) + texte("Un dernier mot", c.mot))
    + boite("Enregistrements audio et vidéo", med)
    + boite("Créneaux de rappel <span class=\"cpt\">" + nbCre + " coché" + (nbCre > 1 ? "s" : "") + "</span>", gh)
    + boite("Résultats du jeu", jh)

    + '<div class="factions">'
    + '<button class="btn sec" id="fi-x2">Fermer</button>'
    + (estAdmin() ? '<button class="btn danger" id="fi-del">Supprimer cette candidature</button>' : "")
    + '</div>';
  document.body.appendChild(f);
  brancherPhotosZoom(f);
  brancherSuivi(c, f);
  brancherEnvoi(c, f);
  brancherImpression(f);
  function ferme(){
    couperMedias(f); f.remove();
    document.removeEventListener("keydown", surEchap);
  }
  /* Quand une photo est agrandie par-dessus la fiche, Echap doit fermer la
     PHOTO et laisser la fiche ouverte. Les deux ecoutes sont sur document et
     celle de la fiche s'execute en premier : c'est donc a elle de s'abstenir. */
  function surEchap(ev){ if(ev.key === "Escape" && !document.querySelector(".photoz")) ferme(); }
  f.querySelector("#fi-x").onclick = ferme;
  f.querySelector("#fi-x2").onclick = ferme;
  /* Clic sur le fond — et pas sur le panneau : ev.target n'est le voile que si
     le clic a atterri en dehors de .inner. Echap fait la meme chose. */
  f.onclick = function(ev){ if(ev.target === f) ferme(); };
  document.addEventListener("keydown", surEchap);
  /* suppression en deux temps plutot qu'une boite de dialogue */
  var armee = false;
  var btDel = f.querySelector("#fi-del");
  if(btDel) btDel.onclick = function(){
    if(!armee){
      armee = true;
      this.textContent = "Confirmer la suppression";
      this.classList.add("armed");
      var b = this;
      setTimeout(function(){ armee = false; b.textContent = "Supprimer cette candidature"; b.classList.remove("armed"); }, 5000);
      return;
    }
    db.ref(FB_PATH + "/candidats/" + c._k).remove();
    ferme();
  };
}

function admCsv(){
  var rows = [["date","statut","etape","prenom","nom","tel","email","suivi","rdv","relance","anciennete","anciennete_metier","experiences","savoirs",
               "situations","creneaux_rappel","poste_vise","permis","transport","cv","note_revue","offre_par_mail","pitch1","pitch2","pitch3","pitch4","mot_media","score","pourquoi","portrait","mot","quiz"]];
  for(var k in LAST_CAND){
    var c = LAST_CAND[k];
    rows.push([
      new Date(c.maj||c.ts||0).toLocaleString("fr-FR"), c.statut||"", c.etape||"", c.prenom||"", c.nom||"", c.tel||"", c.email||"",
      suiviDe(c.suivi_statut).n, (c.rdv_date||"") + (c.rdv_heure ? " " + c.rdv_heure : ""), c.relance_date||"",
      c.anciennete||"", c.anciennete_metier||"", (c.experiences||"").replace(/\|/g,", "), (c.savoirs||"").replace(/\|/g,", "),
      (c.situations||"").replace(/\|/g,", "), (c.grille||"").replace(/\|/g,", "),
      (c.postes_vises||"").replace(/\|/g," + "), c.permis||"", c.transport||"",
      c.cv_url||"", (function(){ var m = revMoyenne(c); return m ? (m.moy + "/5 sur " + m.n) : ""; })(),
      c.offre_mail ? "oui" : "non",
      c.pitch1_url||"", c.pitch2_url||"", c.pitch3_url||"", c.pitch4_url||"", c.motmedia_url||c.media_url||"", c.score||0,
      (c.pourquoi||"").replace(/\n/g," "), (c.portrait||"").replace(/\n/g," "), (c.mot||"").replace(/\n/g," "),
      (c.quiz||[]).map(function(q){ return (q && q.r) ? (q.q + " → " + q.r) : ""; }).filter(Boolean).join(" // ").replace(/\n/g," ")
    ]);
  }
  var csv = rows.map(function(r){
    return r.map(function(f){ return '"' + String(f).replace(/"/g,'""') + '"'; }).join(";");
  }).join("\n");
  var blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "lumiia-candidats.csv"; a.click();
}

/* ══════════ GO ══════════ */
(function boot(){
  var q = window.location.search;
  var sp = $("splash");
  /* ?offre est un apercu, pas une partie : il ne doit pas subir les cinq
     secondes d'ecran d'accueil avant de s'afficher. */
  var isJeu = q.indexOf("admin") === -1 && q.indexOf("offre") === -1;
  var v = $("sp-ver"); if(v) v.textContent = "LUMIIA RECRUTE · " + VERSION;
  var spT = sp && sp.querySelector(".sp-t"), spS = sp && sp.querySelector(".sp-s");
  if(spT) spT.innerHTML = Tb("acc_titre");
  if(spS) spS.textContent = T("acc_sous");
  if(!isJeu){ if(sp) sp.remove(); route(); return; }

  /* Lien reçu par email : ?c=<identifiant de candidature>. Le navigateur qui
     l'ouvre peut n'avoir jamais vu cette candidature — on la redemande donc au
     guichet plutôt qu'au stockage local. */
  /* ?x=<fiche> — le bouton « extras » du mail. Meme mecanique que ?c= : la
     fiche est redemandee au guichet, jamais cherchee dans le stockage local,
     puisqu'on peut ouvrir le lien depuis n'importe quel appareil. */
  /* Le motif acceptait uniquement une cle Firebase (tiret initial, 20 signes),
     ce qui excluait la fiche de test interne — donc rendait le parcours extras
     intestable sans ecrire chez un vrai candidat. On accepte desormais ce que
     le guichet lui-meme accepte ; un identifiant inconnu ressort en 404 et
     affiche l'ecran d'erreur, ce qui est le bon comportement. */
  var lienExtra = q.match(/[?&]x=([A-Za-z0-9_-]{6,64})/);
  if(lienExtra){
    if(sp && sp.parentNode) sp.remove();
    loadCfg(function(){
      S.parcours = "nuit";
      view('<div class="card center"><div class="sp-load" style="margin:10px auto"><i></i></div>'
        + '<div class="mut" style="margin-top:12px">' + esc(T("mod_charge")) + '</div></div>');
      guichetFiche(lienExtra[1], function(ok, fiche){
        if(!ok){
          view('<div class="card center"><div style="font-size:2.6rem">\ud83d\ude15</div>'
            + '<div class="mut" style="margin-top:12px">' + Tb("mod_ko") + '</div>'
            + '<button class="btn sec" id="mo-re">' + esc(T("mod_btn")) + '</button></div>');
          $("mo-re").onclick = function(){ window.location.search = ""; };
          return;
        }
        CAND.id = lienExtra[1]; CAND.data = fiche || {};
        candLocalSave();
        xtStatut();
      });
    });
    return;
  }

  var lienModif = q.match(/[?&]c=([A-Za-z0-9_-]{6,64})/);
  if(lienModif){
    if(sp && sp.parentNode) sp.remove();
    loadCfg(function(){
      S.parcours = "nuit";
      if(CFG.modif_bloquee){
        view('<div class="card center"><div class="big" style="color:var(--lime)">' + Tb("fin_titre") + '</div>'
          + '<div class="mut" style="margin-top:12px">' + Tb("fin_modif_close") + '</div>'
          + '<button class="btn sec" id="mo-re">' + esc(T("mod_btn")) + '</button></div>');
        $("mo-re").onclick = function(){ window.location.search = ""; };
        return;
      }
      view('<div class="card center"><div class="sp-load" style="margin:10px auto"><i></i></div>'
        + '<div class="mut" style="margin-top:12px">' + esc(T("mod_charge")) + '</div></div>');
      guichetFiche(lienModif[1], function(ok, fiche){
        if(!ok){
          view('<div class="card center"><div style="font-size:2.6rem">😕</div>'
            + '<div class="mut" style="margin-top:12px">' + Tb("mod_ko") + '</div>'
            + '<button class="btn sec" id="mo-re">' + esc(T("mod_btn")) + '</button></div>');
          $("mo-re").onclick = function(){ window.location.search = ""; };
          return;
        }
        CAND.id = lienModif[1]; CAND.data = fiche || {};
        candLocalSave();

        /* Le lien du mail deposait toujours a l'etape 1, champs pre-remplis.
           Quelqu'un qui s'etait arrete a l'etape 5 devait donc retraverser
           quatre ecrans pour revenir la ou il en etait — dans un message dont
           le seul but est de LEVER un obstacle. On propose desormais les deux :
           reprendre ou tout revoir. Les deux, parce qu'on arrive souvent d'un
           autre appareil et qu'on peut vouloir verifier ce qu'on avait mis. */
        var et = CAND.data.etape || 1;
        if((CAND.data.statut === "complet") || et < 2){ screenContact(); return; }

        function ecranDe(e){
          if(e >= 6) return screenEtape7();
          if(e === 5) return screenEtape6();
          if(e === 4) return screenEtape5();
          if(e === 3) return screenEtape4();
          return screenEtape3();
        }
        var pre = (CAND.data.prenom || "").trim();
        view('<div class="card center">'
          + '<div style="font-size:3rem">\ud83d\udc4b</div>'
          + '<div class="big" style="color:var(--lime)">' + Tb("mod_reprise_t") + '</div>'
          + (pre ? '<div class="mut" style="margin-top:10px">' + esc(pre) + ', ' + esc(T("mod_reprise_s")) + '</div>'
                 : '<div class="mut" style="margin-top:10px">' + esc(T("mod_reprise_s")) + '</div>')
          + '<button class="btn" id="mo-go" style="margin-top:18px">' + esc(T("mod_reprise_btn")) + '</button>'
          + '<button class="btn sec" id="mo-tout">' + esc(T("mod_depart_btn")) + '</button>'
          + '</div>');
        $("mo-go").onclick   = function(){ ecranDe(et); };
        $("mo-tout").onclick = function(){ screenContact(); };
      });
    });
    return;
  }

  candLocalLoad();
  var partie = CAND.id && CAND.data && CAND.data.statut === "en cours";
  var envoyee = CAND.id && CAND.data && CAND.data.statut === "complet";
  if(partie){
    var t = sp.querySelector(".sp-t"), st = sp.querySelector(".sp-s"), b = $("sp-go");
    if(t) t.innerHTML = Tb("acc_reprise_t");
    if(st) st.textContent = T("acc_reprise_s");
    if(b){ b.textContent = T("acc_reprise_btn"); b.style.display = ""; }
    var again = el('<button class="btn sec sp-btn" style="animation-delay:1.35s">' + esc(T("acc_recommencer")) + '</button>');
    b.parentNode.insertBefore(again, b.nextSibling);
    again.onclick = function(){ try{ localStorage.removeItem(LSK); }catch(e){} CAND = { id:null, data:{} }; go(false); };
  }

  if(envoyee && !partie){
    var t2 = sp.querySelector(".sp-t"), s2 = sp.querySelector(".sp-s"), b2 = $("sp-go");
    if(t2) t2.innerHTML = Tb("acc_envoyee_t");
    if(s2) s2.textContent = T("acc_envoyee_s");
    if(b2){ b2.textContent = T("fin_modifier"); b2.style.display = "";
      b2.onclick = function(ev){ ev.stopPropagation(); clearTimeout(auto);
        if(sp && sp.parentNode) sp.remove();
        loadCfg(function(){ S.parcours = "nuit";
          if(CFG.modif_bloquee){ toast("Les modifications sont closes"); screenIntro(); }
          else screenContact();
        });
      };
    }
  }
  var partie2 = partie;
  function go(reprendre){
    if(sp && sp.parentNode) sp.remove();
    if(reprendre){
      loadCfg(function(){
        S.parcours = "nuit";
        var e = CAND.data.etape || 1;
        if(e >= 6) return screenEtape7();
        if(e === 5) return screenEtape6();
        if(e === 4) return screenEtape5();
        if(e === 3) return screenEtape4();
        if(e === 2) return screenEtape3();
        return screenEtape2();
      });
    } else route();
  }
  var auto = setTimeout(function(){ if(!partie2) go(false); }, 6200);
  $("sp-go").onclick = function(ev){ ev.stopPropagation(); clearTimeout(auto); go(partie2); };
  /* plus de bouton visible : un appui n'importe ou sur l'accueil coupe l'attente */
  if(sp && !partie2) sp.addEventListener("pointerdown", function(){ clearTimeout(auto); SFX.unlock(); go(false); });
})();
</script>
